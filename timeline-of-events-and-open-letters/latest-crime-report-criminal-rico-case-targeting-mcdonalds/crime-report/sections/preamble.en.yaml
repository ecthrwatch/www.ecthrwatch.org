raw_header: '## Preamble {id="preamble"}'
content: |-
  (version#initial)(29)&emsp;This document serves as a non-exhaustive crime report against McDonald’s Corporation and its various accomplices, encompassing a spectrum of allegations that span from direct involvement in criminal activities at local levels to federal criminal activities, including but not limited to money laundering and violations under the Racketeer Influenced and Corrupt Organizations (RICO) Act. While certain aspects of these allegations necessitate federal investigation and even international cooperation with judicial systems of other countries affected by this criminal enterprise, <span style="color:red;font-weight:bold;text-decoration:underline">it is crucial to recognize the integral role of state and municipal law enforcement in addressing the implicated crimes at the local level</span>.

  (version#initial)(30)&emsp;It’s indeed apparent that the franchisees, through their complicity or direct involvement, have participated in actions that contribute to the operation of a criminal RICO enterprise.

  (version#initial)(31)&emsp;Law enforcement officials at all levels are implored to consider the breadth of their jurisdictional authority in the context of this report. <span style="color:red;">Municipal and state law enforcement agencies are equipped with the legal mandate to investigate crimes committed by McDonald’s franchisees and local outlets within their respective jurisdictions</span>. Such investigations are not only within their purview but are essential for comprehensively addressing the scope of this criminal network and its impact on local communities.

  (version#initial)(32)&emsp;Therefore, while this report may warrant the attention and action of federal entities like the FBI, it should not be exclusively escalated to federal authorities without concurrent local action. The collaborative efforts of law enforcement at every level are paramount in ensuring a thorough and effective response to the allegations presented herein. It is with the intention of fostering a multi-faceted law enforcement approach that this report is submitted, urging officials at the municipal, state, and federal levels to undertake a coordinated investigation into the crimes committed by McDonald’s Corporation and its accomplices.

  (version#initial)(33)&emsp;<span style="color:red;">Furthermore, authorities in other countries where McDonald’s operates are also called to scrutinize the crimes of McDonald’s entities within their jurisdictions.</span> The global nature of McDonald’s Corporation, positioned at the apex of this criminal enterprise, implies a systemic influence that extends beyond the borders of the United States. Foreign law enforcement agencies must therefore also investigate the extent to which McDonald’s Corporation and its accomplices have engaged in criminal activities that violate local laws.

  (version#initial)(34)&emsp;For authorities in countries where specific fraudulent activities have not been identified, it is crucial to consider the broader implications of affiliation with a corporation involved in a pattern of racketeering activity, as defined under the RICO Act. Indeed, even in the absence of direct mass-marketing fraud within a particular country, the overarching power and influence of McDonald’s Corporation does have adverse effects on local markets and competition. <span style="color:red;text-decoration:underline">Small business owners and competitors are effectively forced to contend with an entity whose global operations are tainted by criminal conduct and more specifically money laundering.</span> This situation creates an uneven playing field, disadvantaging those who endeavor to compete fairly. Law enforcement and regulatory authorities worldwide are therefore urged to assess the impact of McDonald’s operations on local business ecosystems, considering the indirect victimization of competitors and the integrity of the market.

  (version#initial)(35)&emsp;As a document, “[MONEY LAUNDERING: A PRACTICE MANUAL FOR STATE PROSECUTORS](https://www.ojp.gov/pdffiles1/Digitization/155129NCJRS.pdf)”, found on the website of the Office of Justice Programs of the U.S. Department of Justice[^Preamble-1-Money-Laundering] explains:

  (version#initial)(36)&emsp;“<span style="color:red;">Money laundering also distorts the economy.</span> Honest businesses lose out to those bankrolled by organized crime. As a member of the Italian parliament and former prosecutor observed, ‘<span style="color:red;font-style:italic;">How would you like to be a company competing against \[businesses taking dirty money\] when you have to carry a debt load of 25 percent and your competition has zero?</span>’ <span style="font-weight:bold;">With such a competitive advantage, it is no wonder that dirty money quickly penetrates and dominates entire industries.</span>” (emphasis added) (PART I INTRODUCTION TO MONEY LAUNDERING, CHAPTER ONE -- MONEY LAUNDERING: OVERVIEW OF THE PROBLEM, SECTION B. MONEY LAUNDERING DISTORTS THE ECONOMY AND CORRUPTS SOCIETY).

  (version#initial)(37)&emsp;That's precisely what McDonald's Corporation is: a criminal entity orchestrating a criminal enterprise which has dominated the fast-food industry because they’ve engaged, for decades, in a pattern of racketeering activities as defined in the Racketeer Influenced and Corrupt Organizations (RICO) Act (see Title 18 of the United States Code, Section 1961(5)).

