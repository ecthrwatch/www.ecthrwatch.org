content: |-
  (version#initial)(1104)&emsp;[TO IMPROVE] and also for some of the opportunities which have been presented to me, as some business ventures with equity being mirrored.

  (version#initial)(1105)&emsp;[TO IMPROVE] while I don't want to speculate as to why I have been gag ordered,

  (version#initial)(1106)&emsp;[TO IMPROVE] I won't be corrupted. I won't be extorted. I won't be blackmailed. I won't be silenced.

  (version#initial)(1107)&emsp;[TO IMPROVE] Remind again the NDA I said I would be asked to sign.

  (version#initial)(1108)&emsp;=========================

  (version#initial)(1109)&emsp;Although the transnational money laundering component will be detailed subsequently, it is vital first to grasp the scale and depth of the mass-marketing frauds that McDonald's Corporation has perpetrated worldwide.

  (version#initial)(1110)&emsp;===============

  (version#initial)(1111)&emsp;

  (version#initial)(1112)&emsp;McDonald's Corporation and their accomplices lied!

  (version#initial)(1113)&emsp;They committed mass-marketing fraud!

  (version#initial)(1114)&emsp;Then, money laundering!

  (version#initial)(1115)&emsp;Their executives knew!

  (version#initial)(1116)&emsp;McDonald's Corporation knew!

  (version#initial)(1117)&emsp;TO THE NOT (YET) CORRUPTED LAW ENFORCEMENT OFFICERS ACROSS THE WORLD, AND THE NOT (YET) CORRUPTED ELECTED OFFICIALS ACROSS THE WORLD: IT'S NOW TIME TO SERIOUSLY WAKE UP!!!

  (version#initial)(1118)&emsp;

  (version#initial)(1119)&emsp;That's the reason, even though it might seem a bit repetitive for now, for full thoroughness, I'd like to guide you through a visual demonstration, reminiscent of the one I previously provided to New York Times journalist, Constant Méheut. While the specifics differ slightly due to the fine print distinctions between the United States and France, the underlying principle remains consistent.

  (version#initial)(1120)&emsp;Begin by sketching four rectangles on a piece of paper, each symbolizing an individual game stamp (see Figure 1 below for a visual aid).

  ![Figure 1 - Four rectangles representing game stamps](images/1-in-4-urn-example_1/figure_1_IMG_8507.jpeg)

  (version#initial)(1121)&emsp;

  (version#initial)(1122)&emsp;Given that McDonald's advertised a "1 in 4" chance of an instant win, this unequivocally suggests that, in every quartet of game stamps, exactly one is designated a winner. Hence, inscribe the word "(INSTANT) WIN" within one of the rectangles and "OTHER" in the remaining rectangles **(see Figure 2 below for a visual aid).**

  ![Figure 2 - Rectangles with WIN and OTHER labels](images/1-in-4-urn-example_1/figure_2_IMG_8508.jpeg)

  (version#initial)(1123)&emsp;

  (version#initial)(1124)&emsp;Proceed to cut out each of the four rectangles using scissors **(see Figure 3 below for a visual aid)**.

  ![Figure 3 - Cutting out the rectangles with scissors](images/1-in-4-urn-example_1/figure_3_IMG_8509.jpeg)

  (version#initial)(1125)&emsp;

  (version#initial)(1126)&emsp;As you hold these cut-outs in your hand, reflect on the probability presented before you. Pose the question to yourself: when selecting a piece at random, what is the probability of drawing the winning stamp? **(see Figure 4 below for a visual aid)**.

  ![Figure 4 - Holding the cut-out rectangles](images/1-in-4-urn-example_1/figure_4_IMG_8510.jpeg)

  (version#initial)(1127)&emsp;

  (version#initial)(1128)&emsp;To enhance your understanding even further, if you have drawing balls and an urn at hand, place each of the four cut-outs into separate drawing balls. Now, place all four drawing balls into the urn. As you mix them and ponder over the configuration, ask yourself once more: what's the probability of drawing the ball containing the winning game stamp? **(See Figures 5, 6, 7 and 8 below for a visual aid)**.

  ![Figure 5 - Cut-outs and drawing balls](images/1-in-4-urn-example_1/figure_5_IMG_8512.jpeg)

  (version#initial)(1129)&emsp;

  ![Figure 6 - Placing cut-outs in drawing balls](images/1-in-4-urn-example_1/figure_6_IMG_8513.jpeg)

  (version#initial)(1130)&emsp;

  ![Figure 7 - Drawing balls ready for urn](images/1-in-4-urn-example_1/figure_7_IMG_8514.jpeg)

  (version#initial)(1131)&emsp;

  ![Figure 8 - Drawing balls in the urn](images/1-in-4-urn-example_1/figure_8_IMG_8515.jpeg)

  (version#initial)(1132)&emsp;

  (version#initial)(1133)&emsp;

  (version#initial)(1134)&emsp;===============

  (version#initial)(1135)&emsp;In the key witness, analyst, whistleblower

  (version#initial)(1136)&emsp;[TO IMPROVE] I feel truly grateful and blessed for the support I've received from some insiders

  (version#initial)(1137)&emsp;[TO IMPROVE] That's how I can assert, beyond a reasonable doubt, that the U.S. Department of Justice knew, or ought to have known, since the summer/fall of 2019, that McDonald's Corporation and its accomplices were engaging in global criminal activities.

  (version#initial)(1138)&emsp;=========================

  (version#initial)(1139)&emsp;Yours sincerely,

  (version#initial)(1140)&emsp;Vincent B. Le Corre

  (version#initial)(1141)&emsp;Taiyuan, Shanxi Province, China

  (version#initial)(1142)&emsp;September 14, 2023, 11:34 +0800 (China Standard Time)

