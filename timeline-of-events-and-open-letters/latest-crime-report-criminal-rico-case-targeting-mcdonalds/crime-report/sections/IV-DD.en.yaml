raw_header: '### (IV)(DD) 6th Example of Fraud: the 2015 "Collect-to-Win" Fraud by McDonald''s France and Accomplices, Crimes Condoned by McDonald''s Corporation {id="mcdonalds-france-2015-collect-to-win-fraud"}'
content: |-
  (version#initial)(435)&emsp;Understanding the full spectrum of McDonald's alleged malfeasance requires a deep dive into specific instances of criminal activity. A pivotal instance in this narrative pertains to the crimes committed by McDonald's France in 2015 and which were condoned by McDonald's Corporation. This year is not just another in a series of accusations; it bears undeniable evidence that directly implicates McDonald's Corporation in the crimes committed by its European subsidiary.

  (version#initial)(436)&emsp;The premise of the 2015 fraud by McDonald's France mirrors those from 2010, 2011, and 2012. For the years 2013 and 2014, McDonald's France switched to a different sweepstakes, momentarily displacing the fraudulent Monopoly scheme. However, by 2015, the criminal practices through the fraudulent Monopoly scheme resurfaced.

  (version#initial)(437)&emsp;To ensure clarity and underscore the gravity of this section, section which is of the utmost importance, a brief refresher is in order.

  (version#initial)(438)&emsp;At the heart of these fraudulent activities is a core misconception: as journalist Walter Hickey aptly noted, "Many people assume that all the spaces are equally likely." But what Mr. Hickey dubs "the secret to McDonald's Monopoly," I interpret as a spectrum of deceit that extends from fraudulent misrepresentation, if not outright fraud, in cases like the 2016 U.S. edition, to outright fraud in the French editions of 2010, 2011, 2012, and 2015.

  (version#initial)(439)&emsp;In France, McDonald's didn't just omit essential information, leading consumers to believe all properties held equal odds; they sometimes actively misled them. Take 2011, for instance: McDonald's France advised players to first complete their entire game board before submitting their pieces to claim prizes. In 2012, even after receiving formal notifications highlighting the fraudulent nature of their sweepstakes, they brazenly portrayed seemingly equal quantities of each property on their website's front page. Imagine the uproar if McDonald's U.S. depicted, say, four BOARDWALK stamps alongside three PARK PLACE stamps on their website, without clarifying the actual odds in their official rules. The gravity of such fraudulent misrepresentations cannot be overstated.

  (version#initial)(440)&emsp;Before I became aware McDonald's started defrauding French consumers again in 2015, I decided to alert the headquarters of McDonald's Corporation, based in Illinois, directly. I drafted an email, detailing some of my concerns and demands, and sent it to the General Counsel of McDonald's Corporation, Ms Gloria Santona. The email was CCed to other executives including Steve Easterbrook and Kevin Ozan among other people.

  (version#initial)(441)&emsp;Subsequently, I managed to reach Ms Santona by phone. If my memory serves me right, during our conversation, she appeared unaware or claimed ignorance of the previous warnings I had sent regarding the issue. This could possibly indicate a severe communication breakdown between the European and global branches of McDonald's. Either the French executives hadn't informed the global headquarters about their criminal marketing tactics, or there was an intentional omission.

  (version#initial)(442)&emsp;Shortly after this call and based on my best recollection, I revisited the McDonald's France website. To my dismay, the fraudulent practices seemed to have resumed. In response, I sent a series of emails to McDonald's Corporation's top executives, ensuring they were formally notified.

  (version#initial)(443)&emsp;In a correspondence timestamped 2015-10-21 23:47 (China Standard Time +0800) and addressed to me with CEO Steve Easterbrook CCed, Ms Santona responded, stating: "[…] Thanks for your follow-up note. Of course, we take such inquiries seriously. As this is a French matter, I have asked the French team to review the situation and respond to you once they have shared their findings with me. The details are being checked in an expeditious manner and no delay is anticipated. […]" (I emphasize)

  (version#initial)(444)&emsp;This email sent by Gloria Santona can visualized at the following URL: https://www.ecthrwatch.org/timeline/mcdonalds-general-counsel-confirms-taking-inquiry-seriously-2015-10-21/MCD--2-2015-10-21-23h47CN_Redacted.pdf

  (version#initial)(445)&emsp;This email holds paramount importance. It serves as undeniable evidence that McDonald's Corporation, at its highest echelons, was made aware of the then ongoing criminal activities of its subsidiary companies. The chain of communication had been established. Therefore, any subsequent actions or lack thereof from McDonald's Corporation become a conscious choice, with full knowledge of the criminal misconduct by McDonald's France and related entities. It illuminates the corporation's complicity in these actions, making them equally accountable.

  (version#initial)(446)&emsp;Following this exchange, on October 23, 2015, at 05:34 +0800 (China Standard Time), I received another email, this time from Malcolm Hicks. He introduced himself as the "General Counsel for the McDonald's business segment that includes France among other countries." The email can be accessed here: https://www.ecthrwatch.org/timeline/2015-10-23_email_received_from_malcolm_hicks_mcdonalds_corporate_vice_president/MCD-2--2015-10-23-05h34CN_Redacted.pdf

  (version#initial)(447)&emsp;Mr. Hicks mentioned his intent to employ an external French attorney to scrutinize this issue, likely in response to my prior communication suggesting that McDonald's Corporation appoint an independent attorney not previously entangled in the crimes committed by McDonald's France.

  (version#initial)(448)&emsp;A few points of note:

  (version#initial)(449)&emsp;Origins of Contact: The mechanism of how Mr. Hicks acquired my contact remains uncertain. Post-receiving his email, I attempted to connect with Ms Santona, but this time she did not answer. One of her presumed assistants intimated that Malcolm Hicks was now overseeing this matter. My strong presumption is that McDonald's Corporation in Illinois handed over this case to Mr. Hicks. Thus, when Mr. Hicks mentions that he "[has] chosen to intervene in this matter," it warrants the question: was it genuinely his unilateral decision?

  (version#initial)(450)&emsp;The Connection with McDonald's France: A pivotal discovery was made in late 2022 or early 2023 when, through an official website, I stumbled upon the fact that Malcolm Hicks was intricately tied to McDonald's France. The official publication can be viewed here: https://www.bodacc.fr/pages/annonces-commerciales-detail/?q.id=id:B201301902227

  (version#initial)(451)&emsp;As per the mentioned publication:

  (version#initial)(452)&emsp;"Annonce n° 2227 du BODACC B n° 20130190 publié le 02/10/2013

  (version#initial)(453)&emsp;[…]

  (version#initial)(454)&emsp;N° RCS : 479 506 800 RCS Versailles

  (version#initial)(455)&emsp;Dénomination : MCD FRANCE [note: "dénomination" = name]

  (version#initial)(456)&emsp;Forme juridique : Société à responsabilité limitée [note: free translation: Legal Form: Limited liability company]

  (version#initial)(457)&emsp;Administration : Gérant : PETIT Jean-Pierre Robert modification le 12 Septembre 2007 Gérant : BOURDON Alexis, Germain, Jean, Hugues en fonction le 03 Février 2011 Gérant : GOARE Douglas en fonction le 23 Février 2012 Gérant : HICKS Malcolm Wayne en fonction le 24 Septembre 2013" (I emphasize)

  (version#initial)(458)&emsp;This unearths Mr. Hicks's undeniable affiliation with McDonald's France.

  (version#initial)(459)&emsp;Given these circumstances, the overarching theme surfaces: the ties between McDonald's France and the McDonald's Corporation were intricate and tightly interwoven. Claims of ignorance or distance from the crimes committed become increasingly questionable in light of these revelations.

  (version#initial)(460)&emsp;Even more strikingly, another revelation emerged when I scoured the same official website. Steve Easterbrook, who held the position of CEO at McDonald's Corporation in 2015 and was CCed in Gloria Santona's correspondence to me, was discovered to have been an executive at McDonald's France during the time of the 2011 frauds. The official publication, accessible here https://www.bodacc.fr/pages/annonces-commerciales-detail/?q.id=id:B201102121431 makes it evident:

  (version#initial)(461)&emsp;It states:

  (version#initial)(462)&emsp;"Annonce n° 1431 du BODACC B n° 20110212 publié le 31/10/2011

  (version#initial)(463)&emsp;[…]

  (version#initial)(464)&emsp;N° RCS : 479 506 800 RCS Versailles

  (version#initial)(465)&emsp;Dénomination : MCD FRANCE [note: "dénomination" = name]

  (version#initial)(466)&emsp;Forme juridique : Société à responsabilité limitée [note: free translation: Legal Form: Limited liability company]

  (version#initial)(467)&emsp;Administration : Gérant : PETIT Jean-Pierre Robert modification le 12 Septembre 2007 Co-gérant : BOURDON Alexis, Germain, Jean, Hugues en fonction le 03 Février 2011 Co-gérant : EASTERBROOK Stephen James en fonction le 03 Février 2011" (I emphasize)

  (version#initial)(468)&emsp;This newly-unearthed detail amplifies the connections and corroborates the fact that McDonald's Corporation, all the way to its highest ranks, was intimately aware of the operations and potential irregularities happening within its French subsidiary. Given Easterbrook's involvement with McDonald's France during the specific period when these frauds were happening, the plausible deniability of the parent corporation being uninformed or detached from its subsidiary's actions becomes totally untenable.

  (version#initial)(469)&emsp;Such intertwining of roles and positions underscores that the activities of McDonald's France might not have been isolated incidents but potentially a reflection or consequence of a broader corporate ethos or lack of oversight. The onus and responsibility rest significantly, but not only, on McDonald's Corporation's leadership.

  (version#initial)(470)&emsp;Furthermore, it is important to emphasize that Steve Easterbrook, as mentioned above, had firsthand knowledge and direct involvement with both entities. This dual association further implicates him and the broader corporate structure in any allegations related to these crimes.

  (version#initial)(471)&emsp;Given the close association and overlaps in executive roles, questions arise about the integrity of the internal investigations promised by McDonald's Corporation. Malcolm Hicks, who was purportedly tasked with independently examining the allegations against McDonald's France, had a conspicuous history with the very entity he was supposedly investigating. One wonders how an investigation into criminal activities could be impartial when the investigator has had prior associations, and perhaps even allegiances, with the entity under scrutiny.

  (version#initial)(472)&emsp;It is therefore crucial to scrutinize the depth and breadth of these internal probes. Were they merely perfunctory exercises aimed at giving an appearance of due diligence? Or were they genuine attempts to unearth the truth, hold individuals accountable, and rectify systemic issues? The lack of transparency and tangible outcomes from these investigations tilts the balance in favor of the former assumption.

  (version#initial)(473)&emsp;Moreover, the narrative becomes even more compelling when we consider the swiftness with which McDonald's Corporation historically intervened in the operations of its subsidiary companies, even when legalities were not in question. Former McDonald's France CEO Jean-Pierre Petit's recount in his book, "I sold my soul to McDonald's", highlighted the parent company's capability to halt an advertising campaign with just one phone call. Given this precedent, it seems implausible that the corporation, when informed of ongoing criminal activities by one of its most prominent subsidiaries, would take a passive stance and allow such activities to continue unbridled.

  (version#initial)(474)&emsp;Indeed, in the memoir "I sold my soul to McDonald's," (in reference to the expression selling one's soul to the devil) penned by Jean-Pierre Petit, the former CEO of McDonald's France, there's an anecdote that vividly highlights the ironclad control McDonald's Corporation wields over its subsidiaries. Mr. Petit recalls a time when McDonald's France had rolled out an advertising campaign that, while entirely within the bounds of the law, was met with disapproval by McDonald's U.S. headquarters. With just a single phone call from the corporate center, the campaign was immediately terminated. This incident poses a stark and unsettling question: If McDonald's Corporation can wield such power to swiftly halt a legitimate campaign purely based on their preferences, how can they possibly argue an inability to intervene and stop an unequivocally criminal operation, especially given the clear implications of money laundering? Mr. Petit's story is not just corporate lore; it's a glaring revelation of the centralized authority and inherent responsibility at the very top of McDonald's Corporation.

  (version#initial)(475)&emsp;It is clear that McDonald's Corporation, with its intricate web of shared executives and cross-entity involvements, cannot simply distance itself from the actions of McDonald's France or feign ignorance. Instead, the corporation is deeply implicated in these alleged frauds, either through its direct knowledge, tacit approval, or lack of decisive intervention.

  (version#initial)(476)&emsp;The implications of this are far-reaching. Not only does this reflect a glaring ethical lapse on the part of one of the world's most recognizable brands, but it also draws attention to the inherent flaws in multinational corporations' oversight mechanisms. How can these behemoths ensure accountability and ethical conduct when their top executives wear multiple hats and when lines of loyalty, duty, and responsibility are blurred?

  (version#initial)(477)&emsp;The onus is on the legal and regulatory bodies to delve deeper into these concerns and hold entities and individuals accountable. Only then can consumers repose faith in global brands and their promises of integrity, transparency, and ethical conduct.

  (version#initial)(478)&emsp;Another damning repercussion of McDonald's Corporation's complacency regarding the transgressions in France and in Europe is their direct involvement in money laundering. The depths of this grave criminal endeavor will be meticulously dissected in an upcoming section.

  (version#initial)(479)&emsp;McDonald's Corp. v. Simon Marketing, Inc., Case No. 01 C 8121 (N.D. Ill. Sep. 16, 2002), provides a stark revelation about the vigilance McDonald's Corporation can exercise when there's suspicion or evidence of wrongdoing, especially if it concerns the potential of significant financial harm or reputational damage to the company. Given their previous litigation under the Racketeer Influenced and Corrupt Organizations Act (RICO) against individuals associated with Simon Marketing, McDonald's Corporation clearly demonstrated its awareness of the gravity of certain illicit activities and their potential consequences.

  (version#initial)(480)&emsp;The 2002 case, as described, outlined charges against individuals for conducting a company's affairs through a pattern of racketeering activity and conspiracy. The fact that McDonald's sought relief under RICO proves, beyond a shadow of a doubt, their awareness of such regulations. Because Gloria Santona served as U.S. General Counsel from December 1999 to June 2001 and corporate General Counsel from June 2001 until March 2017, she could only have understood that McDonald's subsidiary companies in Europe were committing serious frauds and money laundering, and that McDonald's Corporation was engaging, with their accomplices (i.e. their subsidiary companies, among other persons) in a pattern of racketeering activity as defined under 18 U.S. Code § 1961.

  (version#initial)(481)&emsp;Therefore, with this historical context in mind, it becomes impossible to believe that the executives of McDonald's Corporation could be oblivious to any criminal actions of their subsidiary companies, especially if they carried the same weight and significance as a RICO violation. The logical deduction here is clear: if the corporate leadership had the inclination and resources to pursue legal action in one instance, how could they, in 2015, turn a blind eye or plead ignorance to the criminal actions of their subsidiary in France? Such incongruence confirms that McDonald's Corporation's compliance policy is nothing more than a superficial paper program without any value and that it is NOT a genuine commitment to ethics, oversight, and corporate governance. McDonald's Corporation operates as nothing short of a criminal syndicate!

  (version#initial)(482)&emsp;Why didn't McDonald's Corporation, in 2015, once fully aware that their subsidiary company in Europe was engaging in organized criminal activities targeting, among other people, children, order McDonald's France and its franchisees to immediately stop their then ongoing criminal activities? As unequivocally evidenced by the book written by former CEO of McDonald's France, Jean-Pierre Petit, a simple phone call would have sufficed!

  (version#initial)(483)&emsp;McDonald's Corporation's history, including their proactive pursuit in the 2002 RICO lawsuit, makes their 2015 inaction all the more indefensible. How can Steve Easterbrook, Gloria Santona, and Malcolm Hicks justify their deafening silence in the face of such damning evidence? It's not just an oversight; it's criminal negligence and a blatant act of willful blindness.

  (version#initial)(484)&emsp;The audacity of the frauds by the subsidiary isn't just alarming; it's an indictment of the corporation's entire operational ethos. This isn't a minor error that can be excused or overlooked. This is a deeply rooted, orchestrated scheme that severely undermines the integrity of McDonald's Corporation as a whole.

  (version#initial)(485)&emsp;Given the evidence, McDonald's Corporation and McDonald's France are on the brink of financial collapse. Their evasion and avoidance of direct questions suggest a desperate scramble to cover their tracks and mitigate the fallout.

  (version#initial)(486)&emsp;To state it unequivocally: McDonald's Corporation's behavior mirrors not that of a global, reputable brand but of a covert, criminal syndicate. The FBI's involvement isn't just advisable; it's imperative. The time for accountability is now.

  (version#initial)(487)&emsp;On October 27, 2015, at 15:59 +0800 (China Standard Time), I received an unequivocal email from McDonald's France attorney Éric Andrieu, a partner at the Péchenard & Associés law firm. Mr. Andrieu curtly dismissed my accusations without offering any substantive explanations. He conveyed that his client — referred to in the French feminine form "ma cliente", possibly indicating the French General Counsel, Ms Françoise de Borda — had mandated him to state that no further discussions on this matter would be entertained, and that henceforth, I should expect no communication from either him or McDonald's.

  (version#initial)(488)&emsp;My subsequent investigation revealed a startling connection. Mr. Andrieu, McDonald's France attorney, is the best friend, allegedly dating back to their childhood, of Frédéric Péchenard, the erstwhile General Director of the French National Police. For context, during the period I was myself a victim of these organized crimes orchestrated by McDonald's, Péchenard held the highest office in the French Police, making him the French counterpart to the FBI Director.

  (version#initial)(489)&emsp;Further delving into the intricate web of associations, I discovered that the Péchenard & Associés law firm was established by none other than Frédéric Péchenard's parents. This assertion is reinforced by the fact that the letter I received from Éric Andrieu bears the unmistakable name of Chantal PÉCHENARD, Frédéric's mother.

  (version#initial)(490)&emsp;Intriguingly, there was a juncture, in 2002, when McDonald's France attracted the scrutiny of the French Ministère de l'Intérieur, owing to suspicions of conducting unlawful lotteries within the country, leading to their indictment. Given this backdrop, it's staggering that McDonald's Corporation, with its stringent compliance policy that categorically prohibits even a hint of potential conflicts of interest, opted to retain a law firm so deeply intertwined with French law enforcement.

  (version#initial)(491)&emsp;On August 1, 2016, at 03:12 +0800 (China Standard Time), an email was sent to Steve Easterbrook, Gloria Santona, and Malcolm Hicks highlighting a potentially compromising association. The correspondence indicated concerns about McDonald's choice of legal representation in Mr. Andrieu, especially given his known close relationship with Frédéric Péchenard, the former General Director of the French National Police.

  (version#initial)(492)&emsp;Yet, even with this information, McDonald's persisted in retaining the services of this law firm, closely connected to the former director of the French National Police, seemingly overlooking their own compliance policy.

  (version#initial)(493)&emsp;Compounding these concerns is the revelation that Frédéric Péchenard shared close ties with François Molins, who was then the preeminent public prosecutor in France. The plot thickens with accounts of various legal proceedings being compromised by forged, doctored, or falsified public/legal/court documents. These manipulations effectively shielded McDonald's France from being held accountable in a French courtroom. It's ambiguous whether these falsifications stemmed from an inherently flawed French judicial system or if external forces were at play to aid McDonald's evasion of justice. However, the body of evidence I've amassed indubitably establishes multiple instances of fraud, both in France and the U.S., but also in other third countries.

  (version#initial)(494)&emsp;The relationship between McDonald's and the Péchenard & Associés law firm appears to be clouded with some uncertainty. While it's unclear whether Péchenard & Associés was specifically engaged by Malcolm Hicks for a second opinion regarding McDonald's alleged criminal activities, certain events provide a more defined picture.

  (version#initial)(495)&emsp;Soon after detecting renewed fraudulent activities by McDonald's France, I created a website to warn consumers, leading to interactions with several victims. Subsequently, another website focused on white-collar criminal Steve Easterbrook was launched: https://www.Steve-Easterbrook.com. The domain name was registered on 2015-12-23 14:12:52 UTC.

  (version#initial)(496)&emsp;Shortly after, on January 04, 2016, I noticed internet connections on some of my websites from the London network of a Big Law law firm: Allen & Overy.

  (version#initial)(497)&emsp;Despite McDonald's previous engagement with Péchenard & Associés during that time, their association would shift during the fall of 2016 with Allen & Overy emerging as the new legal representative.

  (version#initial)(498)&emsp;I accuse both Péchenard & Associés and Allen & Overy of being complicit with McDonald's Corporation and its associates in aiding and abetting in money laundering activities.

  (version#initial)(499)&emsp;I will later delve deeper into the intricacies of asset forfeiture. The justification for pursuing indictments under RICO against both law firms will be discussed, alongside the rationale for pursuing asset forfeiture even when assets have been transferred to attorneys as compensation for legal representation in criminal matters.

  (version#initial)(500)&emsp;Was Péchenard & Associés the original law firm representing McDonald's France before I receive the email from Malcolm Hicks who was then based in London? Or was it the law firm mandated by Malcolm Hicks to have a second opinion? Or was the first law firm mandated by Malcolm Hicks to have a second opinion Allen & Overy? Only a criminal investigation can determine the facts. Given the weight and scope of my accusations, it's imperative that every stone be turned, every connection investigated.

  (version#initial)(501)&emsp;In a series of events that adds further depth to the ongoing investigation against McDonald's Corporation, a notable interaction transpired on Twitter with Gloria Santona, a significant executive figure within the organization.

  (version#initial)(502)&emsp;On November 24, 2016, at 01:15 Beijing time, I was notified by Twitter that Gloria Santona chose to follow one of my accounts. Given the extensive and detailed nature of the accusations I've been directing at McDonald's, this action is far from a casual or incidental gesture. It demonstrates a clear indication that Santona, at the very least, was monitoring the situation.

  (version#initial)(503)&emsp;Upon her follow, Twitter's system automatically enabled the Direct Message (DM) feature between us, a potential oversight she may not have anticipated. I promptly initiated a conversation, seeking explanations and highlighting the gravity of McDonald's alleged unlawful activities. Shortly after my series of messages, I found myself blocked, suggesting she might not have intended to open such a direct communication channel or was taken aback by the immediate contact.

  (version#initial)(504)&emsp;This incident is not a minor footnote. Instead, it underscores a tacit acknowledgment from high-level executives at McDonald's. Their awareness of the allegations cannot be dismissed, and such digital interactions further solidify the case against the company's oversight, if not outright approval, of the purported frauds.

  (version#initial)(505)&emsp;Furthermore, it's crucial to highlight Gloria Santona's subsequent career moves. Instead of retiring after a long tenure at McDonald's, she transitioned, a few months later, to another role leaving McDonald's Corporation. This shift, within the context of our exchanges and her seemingly inadvertent acknowledgment of the allegations, might signify internal company dynamics or her personal attempt to distance herself from the brewing storm at McDonald's.

  (version#initial)(506)&emsp;Considering the gravity of these revelations, the DOJ may want to approach Ms Santona for potential cooperation. Her proximity to the crimes committed by McDonald's Corporation and her evident awareness might make her a valuable asset in unravelling the depth and breadth of these accusations.

  (version#initial)(507)&emsp;It's of paramount importance that every strand of this narrative is meticulously verified, as the implications of these allegations are profound. The digital trail, combined with the substantive claims, paints a picture that demands rigorous examination by investigative authorities.

