title: (I)(G) Important Notes in the Interest of Transparency
anchor_id: important-notes-transparency
raw_header: '### (I)(G) Important Notes in the Interest of Transparency {id="important-notes-transparency"}'
content: |-
  (version#initial)(175)&emsp;Since June/July 2023, there have been indications that the U.S. Department of Justice (DOJ) was, or should have been, aware, since the summer/fall of 2019, of the serious criminal activities involving McDonald's Corporation and their accomplices.

  (version#initial)(176)&emsp;My efforts to expose these serious criminal activities involving McDonald's Corporation and their accomplices encountered resistance in June/July 2023. This resistance, which was not officially sanctioned as a legal gag order, might nonetheless be seen as an informal attempt to discourage or prevent disclosure. Such an experience, while lacking formal recognition, might imply a preference for maintaining silence over facilitating transparency.

  (version#initial)(177)&emsp;In response to these developments, and amid concerns that these actions might be construed as an attempt at silencing me through indirect means—which I must clarify is a speculative, but credible, interpretation of events—I sought legal recourse at an international level. Near the end of 2023, I initiated a process by filing requests for interim measures with the European Court of Human Rights (ECtHR), under the case designation V.L.C. v. France (50552/22). Presently, the documents pertaining to this case are under confidentiality orders, reflecting the extreme sensitive nature of the allegations and proceedings.

  (version#initial)(178)&emsp;Without contravening any legal directives, it's pertinent to mention that the ambiguity surrounding the DOJ's knowledge of these activities raises questions. The distinction between inadvertent oversight and deliberate obfuscation remains unclear, especially in light of further discoveries in 2023 that proved, beyond a shadow of a doubt, a broader scope of criminality within the United States, complicating any efforts to maintain silence on these issues.

  (version#initial)(179)&emsp;Local, state, and federal law enforcement agencies have the jurisdiction and the responsibility to investigate these allegations thoroughly. It's imperative that these entities explore every avenue for prosecution since evidence supports my claims that crimes have been committed. While there is a possibility that earlier efforts to address these concerns were hindered, the primary focus must now be on ensuring accountability and upholding the rule of law.

  (version#initial)(180)&emsp;Given the sensitive nature of some of the information I received, I proceed with caution in discussing these matters publicly. It's my hope that this note serves not as an accusation but as a call for a more profound, transparent investigation into the crimes committed by McDonald's Corporation and their accomplices, and the allegations at hand that the DOJ knew or ought to have known since the summer/fall of 2019, respecting legal boundaries while advocating for justice and corporate accountability.

  (version#initial)(181)&emsp;What distinguishes this report from others is the undeniable nature of certain evidence presented. For specific aspects of these crimes, I can provide proof that stands beyond a shadow of a doubt, supported by rigorous mathematical demonstration ensuring 100% certainty that mass-marketing frauds were committed. I will also later precisely detail, in this crime report, how McDonald's Corporation and their highest level executives knew about the frauds and condoned them, and how they engaged in money laundering.

  (version#initial)(182)&emsp;But before we delve deeper into what is one of the biggest frauds in history, if not the biggest one, I want to extend my true, sincerest, apologies if the language used in this document might sometimes be perceived as harsh or confrontational. This approach is necessitated by an urgent need to dismantle a widespread and deeply ingrained bias—a bias not only prevalent among the general public but also possibly held by officials who may mistakenly view McDonald's Corporation as embodying corporate virtue.

  (version#initial)(183)&emsp;This misconception is significantly influenced by McDonald's global fame and the incessant promotion of their "I'm lovin' It" slogan, coupled with financial reports or standards of business conduct that falsely profess adherence to the letter and the spirit of the law. Such assertions are starkly misleading when not blatantly downright false.

  (version#initial)(184)&emsp;The stark reality is obscured beneath this meticulously constructed facade. McDonald's Corporation and its accomplices, at their essence, symbolize a paradigm of corporate malfeasance. Rather than embodying stewards of public trust, they have instead chosen a path of criminal activity.

  (version#initial)(185)&emsp;

  (version#initial)(186)&emsp;==================

  (version#initial)(187)&emsp;Therefore, the intention behind the forthright language is not to provoke or offend but to fulfill a moral obligation to reveal deceit, illuminate corporate misdeeds, and demand accountability for McDonald's Corporation, and its accomplices, extensive history of criminal behavior. This is an appeal to readers and law enforcement officials to look beyond McDonald's carefully curated public image—to question and to demand justice, recognizing that the widespread perception of its corporate virtue is a carefully crafted illusion, bolstered by its global recognition and misleading public relations strategies.

