raw_header: '### (V)(O) Asset Forfeiture of McDonald''s Suppliers and Accomplices like The Marketing Store {id="asset-forfeiture-suppliers-marketing-store"}'
content: |-
  (version#initial)(815)&emsp;Note: Pay attention to my notes (check email sent to Dr. Lehman October 30, 2023 at 18:13) in red color fonts about the HAVI group and The Marketing Store and their executives and the ties with McDonald's, even that Simon Marketing company for one of the executive, quite stunning! Completely stunning. I knew Mr. Perlman was on the board of McDonald's "charity" but I didn't know Russ Smyth served as President of McDonald's Europe or that Mark Landolt was working for HAVI/TMS and that he "worked at Simon Marketing" (remember MCDC launched a civil RICO lawsuit against employees of Simon Marketing) and that "Over the course of his career at Simon Marketing, Mark was an essential part of the company's explosive growth and development, building revenues from $100 million to $750 million." Very good, excellent, I hope the FBI/DOJ will like it.

