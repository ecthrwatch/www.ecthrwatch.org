raw_header: '### (I)(A) Witness Tampering and the (Death?) Threats I Have Received {id="introduction-witness-tampering-and-threats-received"}'
content: |-
  (version#initial)(38)&emsp;Dear Sir or Madam,

  (version#initial)(39)&emsp;I wish to bring to your attention a series of local, national, and transnational criminal activities involving McDonald’s Corporation and its accomplices. McDonald’s Corporation and its accomplices have engaged in a pattern of racketeering activity as defined under the Racketeer Influenced and Corrupt Organizations (RICO) Act in Title 18 of the United States Code, Section 1961(5). I am a key witness, analyst, and whistleblower, in this criminal RICO case targeting McDonald’s Corporation and its accomplices.

  (version#initial)(40)&emsp;In order to protect McDonald’s Corporation from bankruptcy, there might currently be attempts by both the United States and the French government to cover up these serious crimes, which I am exposing in this crime report.

  (version#initial)(41)&emsp;That’s why if you are a part of the local law enforcement community and have not fully read the preamble of this report, which briefly explain the scope of this criminal network and the necessity for a layered investigative approach, I strongly urge you to review it now to fully understand the roles and responsibilities that local jurisdictions hold in addressing these serious allegations.

  (version#initial)(42)&emsp;<span style="color:red;font-weight:bold;text-decoration:underline">I must first emphasize that this crime report is written under duress</span> since I've received multiple threats including being witness tampered with and blackmailed.

  (version#initial)(43)&emsp;Furthermore, <span style="color:red;font-weight:bold;text-decoration:underline">I’ve been informally gag ordered since June 2023</span>, potentially, <span style="font-style:italic;">but not necessarily</span>, as an attempt to silence me.

  (version#initial)(44)&emsp;Since there is no such thing as an informal gag order, at least from a legal point of view, such an informal gag order might be construed as an act of witness tampering (18 U.S. Code § 1512) and even as potential death threats.

  (version#initial)(45)&emsp;I could publicly detail why the informal gag order I've been subjected to might be construed as encompassing death threats, but to do so would require me to violate the very gag order that has been informally imposed upon me. This places me in a classic catch-22 situation. For those unfamiliar, a catch-22 is a paradoxical scenario where an individual cannot avoid a problem because of contradictory constraints or rules. Essentially, the resolution of the problem is dependent upon an action that is forbidden by the problem itself, creating a no-win situation where every potential solution is blocked by the terms of the predicament itself. <span style="color:red;">Thus, I am compelled to remain silent about specifics that could potentially illustrate and expose these threats, as doing so would itself be a breach of the gag order.</span>

  (version#initial)(46)&emsp;That's the reason why, despite the European Court of Human Rights (ECtHR) having granted me anonymity in November 2022, I decided to temporarily lift my anonymity at the end of August 2023. This decision was made not only for my own safety but also, more importantly, for the safety of my loved ones. In December 2023, I filed additional requests for interim measures with the ECtHR, case V.L.C. v. France (50552/22). <span style="color:red;">The Court's records pertaining to this case have been sealed to protect sensitive information</span>, specifically including details related to the informal gag order I have received, which was notified to me in an unofficial manner.

  (version#initial)(47)&emsp;I have also taken the initiative to inform two U.S. Senators about these developments, ensuring that key policymakers are aware of the situation. Additionally, I will continue to actively submit evidence to the FBI and other relevant authorities to aid in the investigation of this global case. Recognizing the international scope of the issues at hand, I have begun notifying a member of the House of Lords in the United Kingdom, aiming to engage support and action from influential figures across different jurisdictions. This approach underscores my commitment to pursuing justice and safeguarding the rights and safety of all involved parties, transcending national boundaries to address the criminal activities comprehensively.

  (version#initial)(48)&emsp;For a long time now, I have faced multiple threats for trying to raise public awareness about the crimes committed by McDonald’s Corporation and its accomplices, as well as for my efforts to report these activities to the relevant authorities. For example, in the summer/fall of 2019, shortly before the abrupt dismissal of McDonald’s Corporation CEO Steve Easterbrook, I was threatened and blackmailed by Cédric Villani, a high-profile French elected official who was in a position to confirm the serious crimes McDonald’s has committed.

  (version#initial)(49)&emsp;This incident is one of many pivotal moments in this case. Cédric Villani, before turning to politics, was awarded the Fields Medal—often regarded as the Nobel Prize of Mathematics. His profound expertise in mathematics enabled him to quickly understand the extent of McDonald’s crimes. This expertise is one of the reasons I reached out to him initially.

  (version#initial)(50)&emsp;However, instead of fulfilling his duties as an elected official, Villani, through his director of communication Philippe Mouricou, resorted to threats and blackmail in an attempt to silence me. Moreover, based on statements made by his director of communication, <span style="color:red;">there is probable cause to believe that McDonald’s pressured French elected official Cédric Villani.</span> <span style="text-decoration:underline">If confirmed, such actions by McDonald’s would not only fall under the scope of the Foreign Corrupt Practices Act (FCPA) but also constitute another predicate act in the pattern of racketeering activity that McDonald’s Corporation and its accomplices have engaged in for decades.</span>

  (version#initial)(51)&emsp;All this underscores the need for a comprehensive overview of the events that have unfolded. Before delving into a brief, non-exhaustive timeline to illustrate the broader context of this case, it is crucial to first address my Christian duty to report these wrongdoings. Additionally, I will clarify my role as a “key witness, analyst, whistleblower,” and now, given the complexities and increased risks I face, as “whistleblower x2.” These sections will set the foundation for understanding the ethical and personal imperatives that drive my actions.

