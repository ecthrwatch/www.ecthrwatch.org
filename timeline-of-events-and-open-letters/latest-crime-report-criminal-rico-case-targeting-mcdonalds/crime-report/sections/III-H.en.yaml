title: (III)(H) McDonald's Power to Corrupt in France
anchor_id: null
raw_header: '### (III)(H) McDonald''s Power to Corrupt in France'
content: |-
  (version#initial)(254)&emsp;As this report unfolds, intricate facts will be brought to light. A notable instance involves McDonald’s France, a European subsidiary of McDonald’s Corporation, which was represented at some point in time, maybe still is, by the law firm Péchenard & Associés. This law firm was established by the parents of Frédéric Péchenard, who, at the time of numerous mass-marketing frauds and money laundering incidents, held a position analogous to the Director of the FBI in the United States—as the General Director of the French National Police.

  (version#initial)(255)&emsp;What deepens even further the complexity of this relationship is the connection between McDonald’s France’s legal representation and Frédéric Péchenard. The attorney for McDonald’s France, Éric Andrieu, is not merely a partner of Péchenard & Associés; he is reportedly Frédéric Péchenard’s lifelong best friend, since childhood, based on information from a news article. This relationship mirrors a hypothetical scenario where the legal counsel for McDonald’s Corporation in a criminal RICO investigation is best friend, since childhood, with the FBI Director Christopher Wray, and is employed by a law firm founded by Wray’s parents, with Wray’s mother still a lawyer within the firm. The parallels drawn here illustrate a profound conflict of interest that sharply highlights the issues at play in France.

  (version#initial)(256)&emsp;While it may be premature to categorize these actions unequivocally as corruption pending a thorough legal evaluation, it is evident that these dealings directly contravene the internal compliance policies of McDonald’s Corporation.

  (version#initial)(257)&emsp;But in his book titled "I Sold My Soul to McDonald's," Jean-Pierre Petit, the former CEO of McDonald's France, makes a provocative assertion. The title itself, a reference to the saying "selling one's soul to the devil," sets the tone for Petit's revelations. Within its pages, Petit appears to boast about McDonald's ability to wield influence over politicians, suggesting the company had key political figures in their pockets. This candid admission sheds light on the extent of McDonald's entanglements with political power, echoing concerns about corporate influence on democratic institutions.

