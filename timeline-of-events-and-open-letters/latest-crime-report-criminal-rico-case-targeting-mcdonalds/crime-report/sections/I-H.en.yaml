id: I-H
level: 3
title: (I)(H) Should We Show Mercy Towards some of the Criminals?
anchor_id: showing-mercy-towards-criminals
raw_header: '### (I)(H) Should We Show Mercy Towards some of the Criminals? {id="showing-mercy-towards-criminals"}'
content: |-
  (version#initial)(188)&emsp;[TO IMPROVE] Start with McTruth then Penichon, then, ask but what about Miami-Dade guy or Dallas guy, or even someone who simply launched its business yesterday? => it will require true coordination and proportionate response. But no matter what, they must quickly choose their side. Talk also about the French franchisee in Rosny since he was protected by a law firm who aided and abetted MCDC to committed money laundering.

  (version#initial)(189)&emsp;[TO IMPROVE] Talk about showing mercy towards some of the criminals and more specifically some of the franchisees.

  (version#initial)(190)&emsp;[TO IMPROVE] There are different kind of franchisees. A franchisee who spent his life's savings and just bought and started a McDonald's outlet yesterday and never partook, as a possible former McDonald's employee, to any crimes, while such a franchisee would still be de facto part of a criminal enterprise, it's hard to hold such a person to the same degree of accountability as a franchisee like this group in Florida…

  (version#initial)(191)&emsp;[TO IMPROVE] since they opened in 1982, it means they most likely operated and benefited from all of the mass-marketing frauds… considering he is a former policeman, how could he have not realized that he was committing mass-marketing fraud? And it's a very strong point: if a former policeman turned businessman and who therefore should have been diligent in launching an important marketing operation didn't realize he was engaging in organized crime, how could he possibly argue in the upcoming class-action lawsuits that his victims should have been aware.

  (version#initial)(192)&emsp;[TO IMPROVE] or this guy from Dallas who, at some point in time, liked to talk about Faith and Integrity. As a Christian, we should always give the benefit of the doubt to xxxxx. I guess satan has blinded his judgement.

  (version#initial)(193)&emsp;[TO IMPROVE] and there are those who knew more about these crimes and who simply, with disdain, belittled my claims. Should these be held more accountable for criminal negligence?

  (version#initial)(194)&emsp;[TO IMPROVE] and what about those who were executives of McDonald's and who were aware of the frauds, who benefited from organized crime with their salary, and who would later use this dirty money to launder it keep financing and partaking into this criminal enterprise by purchase a franchise. How to make up of them?

  (version#initial)(195)&emsp;[TO IMPROVE] I sincerely want to show mercy. I perfectly understand. It's a broken world. I know, personally, that had I been in the same exact situation, I would probably not have done any better because we are all sinners. That's why I hope that they can be shown some mercy if they truly repent, that is, if they immediately dissolve their partnership with their franchisor.

  (version#initial)(196)&emsp;[TO IMPROVE] The love of money is a root of all kind of evil says the Bible. The seed is the greed, the sin, it's Wall Street. And we should take down this corrupt temple. That's why investors, those who are de facto financing this organized criminal enterprise and who are part of it, should also see their assets frozen if they don't sell off their stocks within, let's give them some time, like 30 days.

