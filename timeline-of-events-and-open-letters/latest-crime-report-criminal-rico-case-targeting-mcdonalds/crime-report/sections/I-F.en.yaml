title: '(I)(F) The 2023 Informal Gag Order: the U.S. Department of Justice Knew or Ought to Have Known Since 2019'
anchor_id: 2023-informal-gag-order-doj-knew
raw_header: '### (I)(F) The 2023 Informal Gag Order: the U.S. Department of Justice Knew or Ought to Have Known Since 2019 {id="2023-informal-gag-order-doj-knew"}'
content: |-
  (version#initial)(169)&emsp;In June 2023, not long after having conclusively demonstrated, through mathematical analysis, that billions of fraudulent transactions also occurred within the United States, I received what can only be described as an informal gag order.

  (version#initial)(170)&emsp;Furthermore, what could be construed as death threats is not acceptable. I will not be silenced. I will not be blackmailed.

  (version#initial)(171)&emsp;This "directive", this informal gag order, was communicated to me in an unofficial manner, leaving me to navigate the ambiguity of its origins and implications.

  (version#initial)(172)&emsp;One might question the feasibility of such an informal directive and its potential origins; unfortunately, I cannot provide a definitive answer. The possibilities are numerous, yet speculative.

  (version#initial)(173)&emsp;However, I can now assert, beyond a reasonable doubt, that the U.S. Department of Justice was, or should have been aware of McDonald's Corporation's involvement in serious criminal activities since at least the summer/fall of 2019—if not earlier. The absence of action on their part raises significant concerns, some details of which I am constrained from discussing publicly.

  (version#initial)(174)&emsp;Text Note: => SEC DOJ Active Top Secret Clearance. Coincidence? Maybe. But maybe not.

