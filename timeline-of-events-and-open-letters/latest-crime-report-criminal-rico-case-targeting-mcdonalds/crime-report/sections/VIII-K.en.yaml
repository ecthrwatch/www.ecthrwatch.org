id: VIII-K
level: 3
title: (VIII)(K) The FBI and Federal Crime Victims' Rights
anchor_id: fbi-federal-crime-victims-rights
raw_header: '### (VIII)(K) The FBI and Federal Crime Victims'' Rights {id="fbi-federal-crime-victims-rights"}'
content: |-
  (version#initial)(952)&emsp;The FBI is legally mandated to identify victims of federal crimes that it investigates and provide these victims with information, assistance services, and resources.

  (version#initial)(953)&emsp;This obligation is primarily grounded in the "Justice for All Act" of 2004, which brought forth pivotal amendments to the rights of federal crime victims, central to which is the Crime Victims' Rights Act (CVRA). The CVRA, enshrined within Title 18, United States Code, Section 3771, stipulates several rights for victims, such as:

  (version#initial)(954)&emsp;- The right to be reasonably protected from the accused.

  (version#initial)(955)&emsp;- The right to receive timely and accurate notifications of public court proceedings.

  (version#initial)(956)&emsp;- The right against exclusion from public court proceedings.

  (version#initial)(957)&emsp;- The right to be reasonably heard during certain district court proceedings, notably those concerning release, plea, sentencing, or parole.

  (version#initial)(958)&emsp;Furthermore, the "Justice for All Act" bolstered victims' rights by introducing the Federal Crime Victim Assistance Fund and amplifying provisions related to victim restitution.

