title: (II)(C) Will German Automobile Manufacturer Volkswagen and American Fast Food Chain McDonald’s Corporation Be Held Accountable to the Same Standard by the American Judicial System?
anchor_id: will-there-be-equal-accountability-between-mcdonalds-and-volkswagen
raw_header: '### (II)(C) Will German Automobile Manufacturer Volkswagen and American Fast Food Chain McDonald’s Corporation Be Held Accountable to the Same Standard by the American Judicial System? {id="will-there-be-equal-accountability-between-mcdonalds-and-volkswagen"}'
content: |-
  (version#initial)(238)&emsp;The United States Department of Justice (DOJ), along with other regulatory bodies, took significant actions against the German automobile manufacturer Volkswagen in light of the emissions scandal. Volkswagen agreed to plead guilty to three criminal felony counts and paid a <span>$</span>2.8 billion criminal penalty for its scheme to cheat on U.S. emissions tests. [This settlement](https://www.justice.gov/opa/pr/volkswagen-ag-agrees-plead-guilty-and-pay-43-billion-criminal-and-civil-penalties-six)[^8] was part of a broader action that included a total of <span>$</span>4.3 billion in criminal and civil penalties. The penalties were imposed not only for the direct violation of environmental laws but also for misleading consumers and the government about the vehicles’ emissions standards compliance. These actions reflected the DOJ’s commitment to holding companies accountable for corporate wrongdoing, emphasizing the importance of corporate honesty and integrity.

  (version#initial)(239)&emsp;In addition to the criminal penalties, Volkswagen agreed to spend up to <span>$</span>14.7 billion to settle allegations related to cheating on emissions tests and deceiving customers. This settlement included up to <span>$</span>10 billion for buybacks, lease terminations, or modifications of affected vehicles and compensation for consumers. Furthermore, Volkswagen was required to spend <span>$</span>4.7 billion to mitigate pollution and invest in green vehicle technology, highlighting the government’s effort to not only penalize but also rectify the environmental damage caused.

  (version#initial)(240)&emsp;While the specifics of the settlement discussions between Volkswagen and the DOJ do not explicitly mention the estimates of premature deaths caused by the excess emissions, the comprehensive nature of the penalties and the requirement for Volkswagen to mitigate pollution suggests a broad effort to address the environmental and public health impacts of the scandal.

  (version#initial)(241)&emsp;The actions taken against Volkswagen serve as a precedent for holding corporations accountable for environmental violations and ensuring they contribute to remedying the harm caused.

  (version#initial)(242)&emsp;Given the rigorous legal actions taken against Volkswagen for its environmental violations, it raises the question of whether the American fast food chain McDonald’s will face similar scrutiny and accountability for engaging in a pattern of racketeering activity as defined under the Racketeer Influenced and Corrupt Organizations (RICO) Act. The precedent set by the Volkswagen case underscores the importance of corporate responsibility and the legal system’s role in enforcing it. Will the same standards apply to McDonald’s Corporation and their accomplices, ensuring that they are held accountable for their crimes?

  (version#initial)(243)&emsp;As we navigate the complexities of corporate malfeasance and organized crime, the cases of Volkswagen and McDonald’s illuminate the urgent need for transparent, ethical business practices. It is a call to consumers, regulators, and the legal system to hold corporations accountable, ensuring that the standards of integrity apply uniformly across the board.

