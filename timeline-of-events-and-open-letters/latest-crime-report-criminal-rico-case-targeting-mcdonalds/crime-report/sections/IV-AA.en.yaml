raw_header: '### (IV)(AA) 3rd Example of Fraud: the "Collect-to-Win" Fraud by McDonald''s Corporation and Accomplices: A Case of Fraudulent Misrepresentation and Outright Fraud {id="3rd-example-fraud-collect-to-win-mcdonalds-corporation"}'
content: |-
  (version#initial)(411)&emsp;Building on the psychological tricks and manipulations previously discussed, which were inspired by theories such as those presented by Daniel Kahneman, McDonald's Corporation engaged in fraudulent misrepresentation, if not outright fraud, through its "Collect-to-Win" game in the United States.

  (version#initial)(412)&emsp;As journalist Walter Hickey correctly pointed out in his article, "The Math Behind McDonald's Monopoly Sweepstakes," many people erroneously assume that all the spaces are equally likely. For the record, this article contains many errors, but this particular point stands accurate. You can refer to the original article as it was when first published for evidence at this URL: https://www.ecthrwatch.org/evidence/business-insider-erroneous-article-2013-07-17/evidence_McDonalds_criminal_RICO_case_2013_07_17_business_insider_article.pdf

  (version#initial)(413)&emsp;Given that I have requested Mr. Hickey to correct the article, it's crucial to consult the archived version for reference.

  (version#initial)(414)&emsp;This false assumption corroborated by Hickey signifies that consumers, unaware of the game's rigging by McDonald's, would believe they had a 1 in 26 chance of acquiring any given property. This belief clearly violates the expectations set by the term "Collect-to-Win," which implies a game of collection, not one of rare, nearly unattainable pieces.

  (version#initial)(415)&emsp;Further confounding the issue are McDonald's official rules, which blatantly contradict their advertising. Notably, McDonald's emphatically states in upper-case letters within the fine print, "A PURCHASE WILL NOT IMPROVE CHANCES OF WINNING." As I have mathematically demonstrated to the FBI, using binomial distribution in correspondence sent to the FBI Field Office within the U.S. Embassy in Beijing, this statement logically implies a 100% winning probability for each play. This demonstration can be viewed at the following URL: https://www.linkedin.com/posts/x-v-france_explanation-sent-to-an-fbi-field-office-on-activity-7100867648397164544-2tk2

  (version#initial)(416)&emsp;This is irrefutable evidence—proof beyond a shadow of a doubt—that McDonald's Corporation engaged in fraudulent misrepresentation and fraud. It reaffirms what Walter Hickey articulated, supporting the idea that consumers did indeed believe each property had an equal chance of being collected. Daniel Kahneman's insights that we can be blind to the obvious, and also blind to our blindness, might explain why so many were deceived. However, the legal system operates based on facts. If McDonald's wasn't adequately covered by legal disclaimers to deceive consumers, then they are accountable for their actions. It's not merely fraudulent misrepresentation; it's outright fraud.

  (version#initial)(417)&emsp;Further details on this topic will be elaborated in subsequent sections.

