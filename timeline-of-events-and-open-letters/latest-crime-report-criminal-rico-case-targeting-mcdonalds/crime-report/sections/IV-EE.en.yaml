raw_header: '### (IV)(EE) 7th Example of Fraud: the 2016 Fraud by McDonald''s France and Accomplices, Crimes Condoned, Again, by McDonald''s Corporation {id="mcdonalds-france-2016-fraud"}'
content: |-
  (version#initial)(508)&emsp;In 2016, McDonald's France underwent a drastic change in its racketeering strategy. Even though its fraudulent sweepstakes retained the name "Monopoly", it unveiled a novel concept, entirely unrelated to the traditional Monopoly board game. Yet, the criminal activities persisted. Here's a breakdown of one of the frauds (as for the previous years, there were many frauds within a single criminal operation that year) from the 2016 criminal activities which took place from October 19, 2016, to November 13, 2016:

  (version#initial)(509)&emsp;One of the frauds within this single illegal sweepstakes revolved around collecting virtual currency, termed as '<span class="double-strike">M</span>'. The erstwhile property collection mechanism was supplanted by this virtual money accumulation. Participants had to amass a specific sum of '<span class="double-strike">M</span>' to claim prizes.

  (version#initial)(510)&emsp;With the purchase of a Maxi Best Of meal or a drink or a McFlurry (an ice cream), consumers would receive game stamps, one and only one of which would systematically indicate an amount ranging from 10 '<span class="double-strike">M</span>' to 500 '<span class="double-strike">M</span>'. McDonald's enticed people to accumulate these game stamps to claim gifts. For example, if a consumer managed to collect 4000 '<span class="double-strike">M</span>', he would win an XBOX. With 3500 '<span class="double-strike">M</span>', he would win a computer, etc.

  (version#initial)(511)&emsp;As you'll discern from the table below, McDonald's planned to distribute a total of 35,149,999 '<span class="double-strike">M</span>' game stamps, cumulating to an overall amount of 3,491,499,999 '<span class="double-strike">M</span>'.

  (version#initial)(512)&emsp;Based on my calculations, they circulated an equivalent of 3,491,499,990 '<span class="double-strike">M</span>' as evidenced by the table below (source: official rules of the 2016 edition "Monopoly" sweepstakes in France):

  (version#initial)(513)&emsp;

  <table>
  <thead>
  <tr style="background-color:#fd7e14;color:white;">
  <th>Color of the '<span class="double-strike">M</span>' game stamp</th>
  <th>Quantity of '<span class="double-strike">M</span>' game stamps per color</th>
  <th>Value of each '<span class="double-strike">M</span>' game stamp</th>
  <th>Total '<span class="double-strike">M</span>' value per color</th>
  </tr>
  </thead>
  <tbody>
  <tr><td><span style="background-color:#0066cc;color:white;padding:2px 8px;border-radius:3px;">Blue</span></td><td style="text-align:right;">7,149,999</td><td style="text-align:right;">10</td><td style="text-align:right;">71,499,990</td></tr>
  <tr><td><span style="background-color:#28a745;color:white;padding:2px 8px;border-radius:3px;">Green</span></td><td style="text-align:right;">6,000,000</td><td style="text-align:right;">20</td><td style="text-align:right;">120,000,000</td></tr>
  <tr><td><span style="background-color:#6f42c1;color:white;padding:2px 8px;border-radius:3px;">Purple</span></td><td style="text-align:right;">10,000,000</td><td style="text-align:right;">50</td><td style="text-align:right;">500,000,000</td></tr>
  <tr><td><span style="background-color:#ffc107;color:black;padding:2px 8px;border-radius:3px;">Yellow</span></td><td style="text-align:right;">8,000,000</td><td style="text-align:right;">100</td><td style="text-align:right;">800,000,000</td></tr>
  <tr><td><span style="background-color:#fd7e14;color:white;padding:2px 8px;border-radius:3px;">Orange</span></td><td style="text-align:right;">4,000,000</td><td style="text-align:right;">500</td><td style="text-align:right;">2,000,000,000</td></tr>
  <tr style="font-weight:bold;"><td>Total number of '<span class="double-strike">M</span>' game stamps:</td><td style="text-align:right;">35,149,999</td><td></td><td style="text-align:right;">Total value: 3,491,499,990</td></tr>
  </tbody>
  </table>

  (version#initial)(514)&emsp;This translates to approximately 99 '<span class="double-strike">M</span>' for every purchase that would yield an '<span class="double-strike">M</span>' game stamp. Indeed: 3,491,499,990 / 35,149,999 ≈ 99.33. To simplify the demonstration, let's round it down to 99.

  (version#initial)(515)&emsp;However, upon calculating the total value in '<span class="double-strike">M</span>' bills of the prizes on offer, one can startlingly ascertain that the total only amounts to 59,190,000 '<span class="double-strike">M</span>' (as seen in the table below).

  (version#initial)(516)&emsp;

  <table>
  <thead>
  <tr style="background-color:#fd7e14;color:white;">
  <th>List of prizes</th>
  <th>Quantity of prizes</th>
  <th>Number of '<span class="double-strike">M</span>' required per prize</th>
  <th>Quantity × '<span class="double-strike">M</span>' required</th>
  </tr>
  </thead>
  <tbody>
  <tr><td>An XBOX</td><td style="text-align:right;">200</td><td style="text-align:right;">4,000</td><td style="text-align:right;">800,000</td></tr>
  <tr><td>A computer</td><td style="text-align:right;">300</td><td style="text-align:right;">3,500</td><td style="text-align:right;">1,050,000</td></tr>
  <tr><td>A Bose headphone</td><td style="text-align:right;">500</td><td style="text-align:right;">3,000</td><td style="text-align:right;">1,500,000</td></tr>
  <tr><td>A Bose speaker</td><td style="text-align:right;">700</td><td style="text-align:right;">2,000</td><td style="text-align:right;">1,400,000</td></tr>
  <tr><td>A camera</td><td style="text-align:right;">1,000</td><td style="text-align:right;">1,000</td><td style="text-align:right;">1,000,000</td></tr>
  <tr><td>A video game</td><td style="text-align:right;">4,300</td><td style="text-align:right;">800</td><td style="text-align:right;">3,440,000</td></tr>
  <tr><td>1 movie to download</td><td style="text-align:right;">100,000</td><td style="text-align:right;">500</td><td style="text-align:right;">50,000,000</td></tr>
  <tr style="font-weight:bold;"><td>Total '<span class="double-strike">M</span>' value of all prizes:</td><td></td><td></td><td style="text-align:right;">59,190,000</td></tr>
  </tbody>
  </table>

  (version#initial)(517)&emsp;Since the total value of all '<span class="double-strike">M</span>' game stamps put on the market was 3,491,499,990 '<span class="double-strike">M</span>' but the total '<span class="double-strike">M</span>' value of all prizes available was only 59,190,000, this means that there was approximately 59 times less prizes than what should have been up for grabs!

  (version#initial)(518)&emsp;3,491,499,990 / 59,190,000 ≈ 59 (approximately)

  (version#initial)(519)&emsp;There is a glaring discrepancy in this sweepstakes that warrants attention. The stark contrast between the total value of all '<span class="double-strike">M</span>' game stamps in circulation, amounting to 3,491,499,990 '<span class="double-strike">M</span>', and the relatively paltry sum of prizes available, which is only 59,190,000 '<span class="double-strike">M</span>', raises serious concerns.

  (version#initial)(520)&emsp;Further analysis reveals an even more alarming picture when we consider the actual value of prizes that were of interest to the consumers. Most participants were not primarily attracted to the promotional game for the 1 movie download, which accounted for a significant 50,000,000 '<span class="double-strike">M</span>' of the total prize value. If we exclude this amount from the total prize pool, the value drops dramatically to only 9,190,000 '<span class="double-strike">M</span>' for the more desirable prizes.

  (version#initial)(521)&emsp;By subtracting 50,000,000 from 59,190,000, we arrive at a sum of 9,190,000. This means that the ratio is not just 59 times less than what should have been offered, but instead, it's a staggering 380 times less than what you should have had available for the game.

  (version#initial)(522)&emsp;Such a considerable disparity not only misleads consumers, but it also undermines the integrity of this sweepstakes which by the way wasn't free contrarily to what McDonald's fraudulently claim and how I will demonstrate later.

  (version#initial)(523)&emsp;Participants might have been led to believe that they had a genuine chance of accumulating enough '<span class="double-strike">M</span>' game stamps to secure the more sought-after prizes, whereas in reality, the odds were heavily skewed against them.

  (version#initial)(524)&emsp;Is it illegal? Indeed it is! It is even criminal! As highlighted in the previous section titled "Understanding Some Key Legal Concepts in France and Europe," the "While Supplies Last" notion doesn't hold water in either France or Europe. This concept not only lacks legitimacy, but it also potentially places businesses in direct contravention of the European directive 2005/29/EC, which pertains to unfair business-to-consumer commercial practices. It's crucial to understand that individual states within the European Union have the authority to fortify the transpositions of European directives. In France, the transposition of this particular directive has been executed stringently, to the extent of criminalizing such deceptive practices. Offenders found in violation face the possibility of incarceration. I will delve deeper into this shortly.

  (version#initial)(525)&emsp;Now, let's revisit the events of 2016: Soon after the promotional event was initiated, a rather predictable occurrence unfolded - all the prizes disappeared from availability. Given the calculations and projections I've laid out earlier, this should have been an expected outcome for McDonald's France and their accomplices. Unless, as the evidence demonstrate beyond a reasonable doubt and sometimes even beyond a shadow of a doubt, their intent was to continue in their trajectory that is clearly characterized by criminal activities.

  (version#initial)(526)&emsp;To elucidate further, the typical purchase would yield around 99 '<span class="double-strike">M</span>'. Hence, on average, a consumer who acquired 41 medium drinks priced at 2 euros each, resulting in an expenditure of 82 euros, would accumulate slightly over 4000 '<span class="double-strike">M</span>'. Such a cache of '<span class="double-strike">M</span>'s could be exchanged for an Xbox, which, I believe, was priced around 300 euros at that time. This disparity should have raised alarms for McDonald's France, signaling that the prize reservoir would deplete rapidly. And that is precisely what happened.

  (version#initial)(527)&emsp;Evidence supporting this claim can be found in the two following screenshots. The visuals from October 23, 2016, confirm that every single prize, with the exception of the movie download that hardly piqued anyone's interest, had been claimed.

  (version#initial)(528)&emsp;It's essential to note that, while the displayed figures pertain to October 23, 2016, I did not have the opportunity to observe the prize count on the preceding days. However, numerous online testimonials indicate that the majority of these prizes were depleted as early as the first or second day of the promotion, which commenced on October 19, 2016. A comprehensive criminal investigation should promptly establish the exact date of when the prizes ran out.

  <!-- Original filename: Screenshot 2023-10-18 at 23.52.16-26.png -->
