  (version#initial)(611)&emsp;**Aggravating circumstance number 7 for the 2016 frauds in France:**

  (version#initial)(612)&emsp;Consistently, I alerted key figures within the McDonald's Corporation about the ongoing criminal activities. My communications were detailed, providing ample evidence and legal references.

  (version#initial)(613)&emsp;In an email dated November 9, 2016, at 11:28 (China Standard Time), I outlined the extensive evidence of fraud and demanded immediate action. The email was addressed to multiple executives and legal representatives.

  (version#initial)(614)&emsp;How did they respond to my pressing concerns? Silence. Absolute silence, as if the matter were inconsequential. This deliberate non-responsiveness further implicates them in the ongoing criminal enterprise.

  (version#initial)(615)&emsp;**Aggravating circumstance number 8 for the 2016 frauds in France:**

  (version#initial)(616)&emsp;I've touched upon the censorship, harassment, and cyberbullying I faced at the hands of individuals connected to McDonald's. Now, let's delve deeper into the roles of Mélodie Josset and Arnaud Le Faucheur.

