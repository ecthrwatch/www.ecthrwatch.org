  (version#initial)(660)&emsp;Furthermore, communication sent to me by Éric Andrieu also bears the name of Chantal PÉCHENARD, Frédéric's mother, on the letterhead.

  (version#initial)(661)&emsp;Adding to the complexity, McDonald's Corporation's global compliance rules explicitly prohibit conflicts of interest. Yet, their choice of legal representation in France appears to flagrantly violate these very rules.

  (version#initial)(662)&emsp;Decades ago, McDonald's France faced scrutiny from the French authorities for conducting unlawful lotteries.

  (version#initial)(663)&emsp;Yet, in recent times, despite ample evidence proving that McDonald's France has engaged in similar if not more egregious conduct, no meaningful action has been taken.

