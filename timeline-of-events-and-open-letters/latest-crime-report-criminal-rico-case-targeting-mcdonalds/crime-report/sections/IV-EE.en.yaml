  (version#initial)(642)&emsp;**Aggravating circumstance number 10 for the 2016 frauds in France:**

  (version#initial)(643)&emsp;On January 27, 2017, at 20:39 (China Standard Time), I submitted a criminal complaint for defamation to the Paris Public Prosecutor's Office.

  (version#initial)(644)&emsp;Paris Public Prosecutor François Molins responded directly to me, noting: "Well received on 30/01/2017."

