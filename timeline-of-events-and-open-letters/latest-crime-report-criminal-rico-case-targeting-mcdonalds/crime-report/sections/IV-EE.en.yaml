  (version#initial)(604)&emsp;From the screenshot provided, my prior tweets are no longer visible due to the unjust suspension of my Twitter account (@McDoEscroc, account UID 766464750020653056). This suspension, a direct result of my efforts to spotlight what I've since identified as violations under 18 U.S. Code § 1961, among other statutes, underscores the lengths to which these entities will go to suppress the truth.

  (version#initial)(605)&emsp;In an attempt to engage more directly, I reached out to Mr. Penichon via Twitter Direct Message, offering to clarify certain legal nuances. His response was a curt disinterest ("[…] je ne suis pas intéressé. […]"). Refer to the attached screenshot for evidence:

