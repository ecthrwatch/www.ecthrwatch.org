  (version#initial)(626)&emsp;She remained silent in response. If my memory serves me right, in what appears to be a deliberate act of evidence destruction, she subsequently deleted her Facebook account.

  (version#initial)(627)&emsp;Destroying evidence, especially when one is aware or suspects their involvement in criminal activities, is a serious offense. This act further implicates Ms. Josset in the broader conspiracy to obstruct justice.

