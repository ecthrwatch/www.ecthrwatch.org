  ![Screenshot showing McDonald's France Monopoly 2016 prizes depleted - second view](images/2016-mcdonalds-france-frauds/Screenshot_2023-10-18_at_23.53.01.png)

  (version#initial)(531)&emsp;Not only did McDonald's France brazenly breach the European Directive 2005/29/EC, thereby committing a criminal act on French soil, but they and their associates went on to perpetrate an even more egregious crime. With full knowledge that all substantive prizes were depleted, save for the negligible movie download that drew scant attention, these entities maliciously continued to mislead the public. Via pervasive promotional displays, they audaciously and falsely asserted that consumers could still amass '<span class="double-strike">M</span>' stamps to stand a chance to win coveted items such as the XBOX, computer, Bose headset, Bose speaker, or the video game. This was a blatant, unadulterated deception! Refer to the following screenshot for undeniable proof of their duplicitous activities.

  <!-- Original filename: Screen Shot 2016-10-27 at 15.01.12 copy_IMPORTANT_USED IN CRIME REPORTED-30.png -->
  (version#initial)(532)&emsp;

  ![Screenshot showing McDonald's France continuing to advertise prizes that were already depleted](images/2016-mcdonalds-france-frauds/Screen_Shot_2016-10-27_at_15.01.12_copy_IMPORTANT_USED_IN_CRIME_REPORTED.png)

  (version#initial)(533)&emsp;While I won't provide the complete text of Article 313-1 of the French criminal code (formerly known as Article 405), which offers an in-depth definition of fraud that encompasses a wide range of deceptive tactics and ruses to clarify what constitutes fraud, it's beneficial to refer to several jurisprudences from French courts to further illustrate the scope of this law:

  (version#initial)(534)&emsp;"Simple lies, even when documented in writing, are insufficient to constitute punishable maneuvers in matters of fraud; however, it is different when these lies are repeated and widely broadcasted via press advertisements." (District Court of Laval, November 22, 1940) (I emphasize)

  (version#initial)(535)&emsp;"Intensively resorting to deceptive advertising to lend credibility and support to false allegations itself constitutes a set of fraudulent maneuvers within the meaning of Article 405 of the criminal code. [Note: Article 405 in the former criminal code is now Article 313-1 of the criminal code]" (District Court of Paris, November 17, 1983) (I emphasize)

  (version#initial)(536)&emsp;"Advertising that can mislead the public in general, regardless of any harm, and fraud to the detriment of a specific person are two materially distinct offenses and can thus be prosecuted under two distinct counts." (Criminal Chamber of the French Court of Cassation, May 10, 1978) (I emphasize)

  (version#initial)(537)&emsp;So, while it's evident that the promotional campaigns undertaken by McDonald's rank among the most intensive worldwide in terms of advertising scope, quantity, and intensity, the stark violation of both the European Directive 2005/29/EC and article 313-1 of the French criminal code cannot be overlooked.

  (version#initial)(538)&emsp;The choice of purchasing the cheapest menu items to get the '<span class="double-strike">M</span>' game stamps, which in theory could have been exchanged for prizes that were far more valuable, seemed smart and a rational thing to do.

  (version#initial)(539)&emsp;Back then, I published on a Facebook which I had created for the purpose of trying to bring public attention of the crimes committed by McDonalds a post starting this way: "McDonald's Monopoly is a fraud. Our page was created with the aim of trying to warn and protect consumers. […]"

  (version#initial)(540)&emsp;However, a damning revelation has come to light regarding the actual events of 2016 through an online testimony provided by an employee working at a McDonald's France restaurant during the time these crimes took place. Her name is Orane El'Khass. The testimony of this employee, unknowingly acting as a whistleblower, is especially pertinent as she shed light on the actual proceedings behind the scenes of the crimes which have been committed.

  (version#initial)(541)&emsp;This employee's revelations further expose the depth of the frauds, providing additional evidence of the aggravating circumstances surrounding the crimes committed by McDonald's Corporation, McDonald's France, and countless accomplices as you will soon understand.

  (version#initial)(542)&emsp;Orane El'Khass, who was a McDonald's employee at the time, publicly commented in reply to my post on Facebook: "All of the prizes were claimed in 2-3 days by McDonald's employees 😉." (Free translation) (I emphasize)

  (version#initial)(543)&emsp;When I probed further, inquiring, "How did they manage that? Did they gather the game stamps discarded by customers in the trash?" she responded:

  (version#initial)(544)&emsp;"Either on the stacks of beverage cups thrown away or consumed by my colleagues. Or just in the evening when we close, employees would collect multiple cups, even entire stacks, just to peel off the stickers and to accumulate, say, a maximum number of 500 points game stamps. Or they got them from the trash bins 😁." (Free translation)

  (version#initial)(545)&emsp;Another user, Emilien Vares, pointed out that "McDonald's employees are not supposed to participate in the sweepstakes." I emphasized that while this is true in theory, McDonald's no matter what committed a serious fraud by continuing to falsely advertise the availability of these prizes.

  (version#initial)(546)&emsp;Ms El'Khass further elaborated, "I work there, so I'm aware it's forbidden. But nearly 98% of the prizes were won by employees. They just had to register under a different name to claim the prize. And yes, I find this scandalous. I don't hide this from customers. They continue purchasing for the game stamps, so I openly tell them that it's useless and a fraud somehow." (Free translation) (I emphasize)

  (version#initial)(547)&emsp;Though some of my comments on Facebook might have been illegally removed or deleted without my consent, I will get back to this topic later on in this crime report to explain how it's possible and the kind of censorship I faced from Big Tech companies in respect to my accusations targeting McDonald's and their accomplices, I still have the screenshots of Ms El'Khass' pivotal testimony. While it seems I might not have access to my own comments any longer, if my memory serves correctly, I might have insinuated, at some point, that her statement was speculative.

  (version#initial)(548)&emsp;However, based on a screenshot and an email from Facebook, emails which were sent automatically for every reply I would receive and which contain the exact transcript of what she wrote, Ms El'Khass added:

  (version#initial)(549)&emsp;"These aren't official numbers. Speculation, as you say. But excuse me. Unless one buys 20 drinks in a day and gets only 500-point stickers, how did more than half of the computers get claimed in just one day? It's simple logic. At the McDonald's where I work, that's what most of my colleagues did in the evening after closing... So the '98%' is an exaggeration for illustrative purposes." (Free translation)

  (version#initial)(550)&emsp;As I elucidated while discussing the 2015 frauds in France, McDonald's Corporation, through its "previous litigation under the Racketeer Influenced and Corrupt Organizations Act (RICO) against individuals associated with Simon Marketing, McDonald's Corporation clearly demonstrated its awareness of the gravity of certain illicit activities and their potential consequences."

  (version#initial)(551)&emsp;Furthermore, I delineated that "the fact that McDonald's sought relief under RICO proves, beyond a shadow of a doubt, their awareness of such regulations."

  (version#initial)(552)&emsp;Given this precedent, one would logically expect McDonald's Corporation to have similarly sought relief under RICO against their subsidiary companies, franchisees, and respective employees. Unless, of course, they tacitly approved of these racketeering actions, which, I assert, is unequivocally evident.

  (version#initial)(553)&emsp;Now, I'd like to present further evidence that sheds light on the aggravating circumstances of the committed crimes.

  (version#initial)(554)&emsp;**Aggravating circumstance number 1 for the 2016 frauds in France:**

  (version#initial)(555)&emsp;Before the blatant frauds of 2016 transpired, McDonald's Corporation was undeniably informed that their subsidiary, McDonald's France, alongside their collaborators, was deeply entrenched in persistent racketeering activities across Europe.

  (version#initial)(556)&emsp;While I might not have previously employed the term "pattern of racketeering activity," it's inconceivable that McDonald's Corporation's General Counsel, Gloria Santona, would be oblivious to the RICO Act's stipulations.

  (version#initial)(557)&emsp;Determining whether McDonald's France alerted Gloria Santona in 2012 requires a criminal investigation. Yet, it's an undeniable fact that in 2015, Santona, grasping the severity of the matter, acknowledged it in an email, with then-CEO Steve Easterbrook CCed.

  (version#initial)(558)&emsp;Given these undeniable facts, any attempt by them to claim a defense of criminal negligence would be entirely baseless and disingenuous.

  (version#initial)(559)&emsp;**Aggravating circumstance number 2 for the 2016 frauds in France:**

  (version#initial)(560)&emsp;Upon recognizing the recurrence of McDonald's fraudulent activities in France, I took the initiative to comment on their Facebook page, aiming to alert consumers of the ongoing frauds.

  (version#initial)(561)&emsp;Shockingly, McDonald's chose to silence me by blocking my account, thereby preventing me from raising awareness and warning potential victims of their maliciously criminal schemes.

  (version#initial)(562)&emsp;Their attempt to muzzle a key witness, analyst, whistleblower, actively seeking to alert their victims is deeply unsettling. It's imperative to note that among these victims were innocent children.

  (version#initial)(563)&emsp;**Aggravating circumstance number 3 for the 2016 frauds in France:**

  (version#initial)(564)&emsp;Upon discovering that McDonald's was once again involved in fraud in France, I took to their Facebook page to inform consumers of the criminal nature of their Monopoly game. However, McDonald's swiftly silenced my attempts, leaving both victims and potential victims in the dark about the scam.

  (version#initial)(565)&emsp;Subsequently, on October 24, 2016, at 17:03 (China Standard Time), I dispatched a detailed formal notice to the upper echelons of McDonald's Corporation, McDonald's Europe, and McDonald's France. This notice was also extended to the corrupted French Ministerial Officer, Henri-Antoine Le Honsec. Furthermore, this correspondence was CC'd to both McDonald's lawyer, Éric Andrieu—who, notably, shares an extremely close bond with the ex-General Director of the French National Police, Frédéric Péchenard—and my attorney, Ms Blumberg.

  (version#initial)(566)&emsp;The initial section of my notice highlights an article authored by McDonald's attorney, showcasing his profound understanding of relevant consumer laws. Given this knowledge, it's unreasonable to assume he was unaware of McDonald's engagement in criminal activities. Subsequently, I referenced several pertinent legal cases related to McDonald's fraudulent actions.

  (version#initial)(567)&emsp;The Marketing Store, one of McDonald's marketing agencies and a de facto partner in crime of McDonald's Corporation and its subsidiary companies in this criminal RICO case, candidly refers to consumers as "our targets" on its website. This audacity is underscored by the fact that their fraudulent sweepstakes was open to young adolescents, as tender as 13.

  (version#initial)(568)&emsp;I presented detailed tables, previously shared in this crime report, to highlight the stark discrepancy between the touted '<span class="double-strike">M</span>' game stamps and the actual prizes. I also underscored the censorship I faced on their Facebook platform despite my noble intent to caution the public about their fraudulent sweepstakes.

  (version#initial)(569)&emsp;Detailing the timeline, I emphasized that by October 23, 2016—a day prior to dispatching my formal notice—all prized items that truly piqued consumer interest had vanished. Despite this, McDonald's persisted in fraudulently proclaiming the availability of these prizes on their website and on social media. I would later learn that a massive advertising campaign had also taken place not only on the internet but also using billboards.

  (version#initial)(570)&emsp;In no uncertain terms, I urged them to shut down all French outlets until all misleading billboards and advertisements were eradicated. I starkly highlighted that with every passing day, countless consumers—adults and children alike—fell victim to their frauds.

  (version#initial)(571)&emsp;In concluding, I pinpointed the absurdity that, even if a consumer were fortunate enough to secure two '<span class="double-strike">M</span>' game stamps valued at 500 '<span class="double-strike">M</span>' each, they'd merely amass 1000 '<span class="double-strike">M</span>'. Thus, four out of the six most sought-after prizes were fundamentally unattainable. Consequently, besides the blatant frauds, McDonald's was also perpetrating what can only be described as a deliberate deception on a massive scale.

  (version#initial)(572)&emsp;To drive my point home, I culminated my notice by referencing two jurisprudences that I believe were relevant to the frauds being committed.

  (version#initial)(573)&emsp;Clarification not mentioned in my initial report back then: further aggravating the situation, McDonald's France and their accomplices had priced the movie download at 500 '<span class="double-strike">M</span>', making it the only attainable prize with a single game stamp, while every other prize required multiple stamps. This deliberate design choice further entrenched the deceptive nature of their scheme.

  (version#initial)(574)&emsp;**Aggravating circumstance number 4 for the 2016 frauds in France:**

  (version#initial)(575)&emsp;In 2015, I was unexpectedly confronted with McDonald's continuation of their fraudulent Monopoly campaign in France. Responding swiftly, I engaged directly with the highest echelons of the corporation via email. Remarkably, during this period, I even had a telephonic exchange with the then General Counsel, Gloria Santona.

  (version#initial)(576)&emsp;In 2016, having received legal confirmation of McDonald's criminal actions, I felt a heightened responsibility to intervene. After being unjustly blocked from their Facebook platform, I established an informational website to enlighten consumers and ran a Google AdWords campaign to maximize reach.

  (version#initial)(577)&emsp;Initially, the Google AdWords campaign yielded promising results. [DRAFT NOTE: insert the screenshot showing the growth of the traffic]

  <!-- Original filename: Screen Shot 2016-10-25 at 20.14.21_IMPORTANT_GOOGLE_ANALYSTICS_EXPONENTIAL_GROWTH_TRAFFIC_COPY_REDACTED-32.png -->
  (version#initial)(578)&emsp;

  ![Google Analytics showing exponential traffic growth before censorship](images/2016-mcdonalds-france-frauds/Screen_Shot_2016-10-25_at_20.14.21_IMPORTANT_GOOGLE_ANALYSTICS_EXPONENTIAL_GROWTH_TRAFFIC_COPY_REDACTED.png)

  (version#initial)(579)&emsp;The screenshot from back then indicates that the campaign was showing promising exponential growth.

  (version#initial)(580)&emsp;However, a turn of events occurred a few days into the campaign. I received an unexpected notification from Google, stating that despite its initial approval, my advertisements were now disapproved, bringing the campaign to an abrupt halt.

  <!-- Original filename: Screen Shot 2016-10-28 at 16.52.17_IMPORTANT_GOOGLE_CENSORSHIP_6_ADS_DISAPPROVED_copy_REDACTED-36.png -->
  (version#initial)(581)&emsp;

  ![Google notification showing ads disapproved - censorship of McDonald's fraud awareness campaign](images/2016-mcdonalds-france-frauds/Screen_Shot_2016-10-28_at_16.52.17_IMPORTANT_GOOGLE_CENSORSHIP_6_ADS_DISAPPROVED_copy_REDACTED.png)

  (version#initial)(582)&emsp;After reaching out to Google for clarification, I learned from a representative that McDonald's had lodged a complaint against my advertising campaign, leading to its suspension.

  (version#initial)(583)&emsp;The implications of McDonald's actions are profound and deeply concerning. By not only perpetrating the fraud but also actively working to silence those who sought to expose it, McDonald's violated the rights of victims—rights to freedom of assembly and association as outlined in Article 11 of the European Convention on Human Rights.

  <!-- Original filename: Screenshot 2023-10-24 at 13.42.00_google_analytics_2016_traffic_collapse_REFRAMED-66.png -->
  (version#initial)(584)&emsp;You can see in the following screenshot how the traffic to my website dramatically dropped following this censorship:

  ![Google Analytics showing traffic collapse after McDonald's-initiated censorship](images/2016-mcdonalds-france-frauds/Screenshot_2023-10-24_at_13.42.00_google_analytics_2016_traffic_collapse_REFRAMED.png)

  (version#initial)(585)&emsp;

  (version#initial)(586)&emsp;On October 26, the website had 1,311 users. However, following collaboration between Google and the criminal entity McDonald's Corporation and/or their accomplices, traffic plummeted dramatically.

  (version#initial)(587)&emsp;Google was not the sole Big Tech platform where I experienced censorship and harassment. I also faced similar treatment on Twitter and Facebook. Such collaborative efforts between major corporations to silence whistleblowers and protect criminal enterprises warrant serious investigation.

  (version#initial)(588)&emsp;The European Court of Human Rights has emphasized the obligation of States to protect the rights enshrined in the Convention, including the right to freedom of expression and the right to receive information. McDonald's actions, in concert with Big Tech companies, appear to have violated these fundamental rights.

  (version#initial)(589)&emsp;Furthermore, I suspect this could be an infringement of specific French criminal laws regarding obstruction of justice and witness tampering.

  (version#initial)(590)&emsp;**Aggravating circumstance number 5 for the 2016 frauds in France:**

  (version#initial)(591)&emsp;On October 28, 2016, I sent another formal notice, this time focusing on the censorship I had experienced and the ongoing criminal activities.

  (version#initial)(592)&emsp;In my notice, I expressed the following (translated for clarity): I detailed the censorship tactics employed against me and reiterated the gravity of McDonald's ongoing fraudulent activities.

  (version#initial)(593)&emsp;What was McDonald's response? An ominous silence. Not only did they remain mute, but they also persisted in their fraudulent activities, continuing to mislead consumers.

  (version#initial)(594)&emsp;It's pertinent at this juncture to debunk a pervasive falsehood that McDonald's and their legal representatives might propagate: the claim that the sweepstakes was "free." This is categorically untrue, as I will demonstrate.

  (version#initial)(595)&emsp;**Aggravating circumstance number 6 for the 2016 frauds in France:** Jean-Noël Penichon

  (version#initial)(596)&emsp;

