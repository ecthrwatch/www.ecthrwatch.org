  (version#initial)(600)&emsp;In his self-description, Jean-Noël Penichon mentions a few notable points. He describes his role as "key and strategic" and highlights his expertise in the "digital world and communities, Social network and media."

  (version#initial)(601)&emsp;Owing to significant censorship efforts against me, multiple social media accounts of mine were suspended or deleted. As a result, I've lost access to some crucial data, which are paramount for detailing the infractions committed against me and countless other consumers. Still, I'll endeavor to present as comprehensive a case as possible, based on available screenshots and retained data from that period.

  (version#initial)(602)&emsp;To the best of my recollection, Jean-Noël Penichon, Mélodie Josset, and Arnaud Le Faucheur targeted me with verbal abuses and online defamation. On one occasion, Mr. Penichon questioned the veracity of my claims, rhetorically asking, "Because it's not true?". When I countered, asserting the falsehood of his statement, he responded dismissively, indicating he didn't wish to waste his time ("je n'ai pas de temps à perdre […]") (Tweet UID 793095857910538241). A screenshot of this interaction is provided below:

