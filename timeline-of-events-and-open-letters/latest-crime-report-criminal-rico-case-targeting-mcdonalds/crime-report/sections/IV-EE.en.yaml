  (version#initial)(618)&emsp;Mélodie Josset, through direct messages, also acknowledged her lack of qualification to assess the legal merits of my claims. Yet, despite this admission, she continued to engage in defamatory conduct against me.

  (version#initial)(619)&emsp;

  (version#initial)(620)&emsp;While encountering a derogatory and defamatory post from Arnaud Le Faucheur, I noticed that Mélodie Josset had "liked" his comment, thereby endorsing his defamatory statements.

  (version#initial)(621)&emsp;However, what truly astonished me was a subsequent comment by Mélodie Josset. She publicly stated that she had reported my account to the relevant authorities or platform administrators.

  (version#initial)(622)&emsp;

  (version#initial)(623)&emsp;It's perplexing to me. Having openly confessed her inability to render a judgment on the matter, why would Ms. Josset take it upon herself to report my account? This action appears to be a coordinated effort to silence me.

