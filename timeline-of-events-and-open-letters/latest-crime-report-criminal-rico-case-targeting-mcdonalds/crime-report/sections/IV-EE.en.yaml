  (version#initial)(607)&emsp;How is it conceivable that McDonald's executive Jean-Noël Penichon, who touts his "role [as] key and strategic" with expertise in "digital world and communities, Social network and media," could be indifferent to the alleged ongoing misconduct by the corporation he serves? This willful ignorance or deliberate avoidance is damning and should be of significant interest to the U.S. Attorney overseeing this criminal RICO case to persuade a jury of Mr. Penichon's involvement in the racketeering scheme.

