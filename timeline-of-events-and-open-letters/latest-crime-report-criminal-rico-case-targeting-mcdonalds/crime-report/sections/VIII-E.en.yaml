title: '(VIII)(E) McDonald''s Corporation Is Currently Virtually Bankrupt: A Rough Estimation of Their Current Liabilities'
anchor_id: mcdonalds-virtually-bankrupt
raw_header: '### (VIII)(E) McDonald''s Corporation Is Currently Virtually Bankrupt: A Rough Estimation of Their Current Liabilities {id="mcdonalds-virtually-bankrupt"}'
content: |-
  (version#initial)(889)&emsp;Éric Andrieu, an attorney from the Péchenard & Associés law firm representing McDonald's, authored a law review article published on May 1, 2014. This article is now an evidence in the criminal RICO case targeting McDonald's Corporation and their accomplices and I keep a copy of it which I share under the fair use doctrine for evidentiary and public interests purposes:

  (version#initial)(890)&emsp;https://www.ecthrwatch.org/evidence/mcdonalds-attorney-law-review-article-2014-05-01/evidence-law-review-article-from-mcdonalds-attorney-may-2014-european-parliament.pdf

  (version#initial)(891)&emsp;In this article, he cites the European Parliament resolution of February 4, 2014, on the implementation of the Unfair Commercial Practices Directive 2005/29/EC (2013/2116(INI)). Specifically, he references the statement "that the penalties imposed for failure to comply with the Directive ought never to be lower in value than the profit made through a practice deemed to be unfair or misleading."

  Refer to paragraph 19 of the European Parliament resolution, which is available for review at the following link:

  (version#initial)(892)&emsp;https://www.europarl.europa.eu/doceo/document/TA-7-2014-0063_EN.pdf

  (version#initial)(893)&emsp;This citation in Andrieu's article is unequivocal evidence of both his and McDonald's understanding of the potential severe financial implications if they continued their alleged racketeering activities. Given the applicability of this European Directive across all EU nations, McDonald's could face monumental financial consequences, possibly leading them to bankruptcy.

  (version#initial)(894)&emsp;In a LinkedIn post, Jana Cappello, spokesperson for the European Anti-Fraud Office (OLAF), referenced two poignant remarks from a conference: "EU funds belong to Europeans, not to fraudsters!" and "If you don't look for fraud, there is no fraud…"

  (version#initial)(895)&emsp;

  (version#initial)(896)&emsp;Drawing from this sentiment, it's conceivable that if rigorous criminal investigations were conducted across the European Union, scrutinizing every detail, the discovery of around 100 instances of mass-marketing frauds, if not more, could emerge throughout the region.

  (version#initial)(897)&emsp;

  (version#initial)(898)&emsp;Should the European resolution be upheld, dictating that penalties for failing to adhere to the Directive should at least equal the profit garnered from any misleading or unfair practice, and assuming an average clawback of 100 million euros for each identified mass-marketing fraud, the total could potentially reach a staggering 10 billion euros.

  (version#initial)(899)&emsp;

  (version#initial)(900)&emsp;And this figure pertains only to Europe. It doesn't factor in the compensations owed to deceived consumers or the competitors who grappled with the criminal strategies deployed by McDonald's.

  (version#initial)(901)&emsp;

  (version#initial)(902)&emsp;Considering only the infractions from the years 2010, 2011, 2012, 2015, 2016, and 2017, the reparations due to French consumers alone could run into the hundreds of billions of euros, underscored by the principle that contracts must be honored.

  (version#initial)(903)&emsp;

  (version#initial)(904)&emsp;Given the apparent lapses or potential complicity within the French administration, it might be argued that the statute of limitations may not present a hurdle. This opens the door for French consumers to potentially initiate a class-action lawsuit against McDonald's Corporation, citing sustained engagement in racketeering, money laundering, and the corruption of foreign officials. I'll delve into the corruption angle later, but a foundation for this claim is laid out in Jean-Pierre Petit's book, which illuminates how McDonald's effectively muted the French parliament and funneled ill-gotten funds to municipalities.

  (version#initial)(905)&emsp;Regarding the crimes committed in the United States, it's similar. Millions of young participants in the 2016 McDonald's Monopoly game may still regard themselves as victims of a federal offense. Setting aside state laws, many of which often have no expiration for fraud-related offenses, McDonald's Corporation's alleged continuous involvement in racketeering could imply that the statute of limitations might not begin until they completely cease these activities.

  (version#initial)(906)&emsp;

  (version#initial)(907)&emsp;In 2016, when McDonald's asserted in the U.S. that making a purchase doesn't amplify the odds of securing a win, the mathematical implication is that every purchase should, in essence, guarantee a win. This is a straightforward mathematical conclusion. Consequently, any interpretation of this claim should lean in favor of the consumers rather than the corporation in question. If not, it sets a precedent where corporations could potentially circumvent the law to their advantage, which is contrary to public interest. While I need to validate the math, I suspect that the compensatory sum owed to the 2016 game participants in the U.S. alone might exceed 1 trillion dollars.

  (version#initial)(908)&emsp;

  (version#initial)(909)&emsp;Moreover, if these allegations hold water, McDonald's Corporation and its associated franchisees might find themselves besieged by a plethora of class-action lawsuits at municipal, state, and federal levels, echoing the recent financial woes of Rite Aid.

  (version#initial)(910)&emsp;This naturally raises the question: What would it take to financially topple McDonald's Corporation? $10 billion? $20 billion? $50 billion? Some might point to McDonald's current market capitalization, hovering around $186 billion, to argue that even a $100 billion hit wouldn't destabilize them. However, this perspective might be misguided. It's crucial to distinguish between the market capitalization, which is based on stock price multiplication by the number of shares, and the intrinsic value of the company, often referred to as the book value or shareholder's equity.

