  (version#initial)(1009)&emsp;My primary objective with this report, and the subsequent ones that will follow, is to urge the FBI to initiate a Criminal RICO investigation into McDonald's Corporation and their accomplices.

  (version#initial)(1010)&emsp;I have already provided a significant amount of evidence and detailed explanations to the FBI Field Office located within the U.S. Embassy in China. Initially, when I sought to communicate with the FBI Field Office, I was approached by Assistant Legal Attaché Adam Rogalski.

  (version#initial)(1011)&emsp;Some of the communications were initially also forwarded to the FBI Field Office within the U.S. Embassy in France, specifically to FBI language specialist Mahonri Manjarrez. An inconsistency in their email domains caught my attention: Mr. Manjarrez uses an @fbi.gov domain, while Mr. Rogalski's is associated with @state.gov.

  (version#initial)(1012)&emsp;This divergence raised concerns. While Mr. Rogalski may be affiliated with the State Department rather than the Department of Justice (DOJ), I was initially under the assumption that my findings would be relayed directly to the DOJ. Although I want to believe in the diligence and competence of the officials I communicated with, the potential for misunderstandings remains.

  (version#initial)(1013)&emsp;International protocols further complicate the situation. If the FBI intended to engage with me directly for further questioning, they'd typically be required to navigate through official Chinese channels, given existing international treaties and agreements. Such bureaucratic intricacies could lead to delays or miscommunications.

  (version#initial)(1014)&emsp;I also want to acknowledge that the evidence and explanations I provided were spread out over numerous emails, making the narrative harder to follow. As such, I wasn't able to consistently update my communications with Mr. Rogalski on https://Adam-Rogalski.Federal-Bureau-of-Investigation.com, a NON-OFFICIAL website on Mr. Rogalski that I created for the sake of transparency. I genuinely want to believe Mr. Rogalski is astute and likely grasped much of the information I conveyed. However, given the intricacy and sophistication of the schemes devised by McDonald's, it took me considerable time and effort to unravel the full extent of their fraudulent activities, sometimes resorting to mathematical proofs to demonstrate the fraud conclusively.

  (version#initial)(1015)&emsp;In light of these complexities and my previous submissions to the U.S. Securities and Exchange Commission via the Office of the Whistleblower, I'm taking a two-step approach. I will first submit this report to the SEC and then promptly submit it to the FBI through https://tips.fbi.gov to ensure my crime reports are unequivocally documented in the system.

  (version#initial)(1016)&emsp;Moreover, considering the multifaceted nature of the infractions and their potential ramifications, I'm also contemplating submitting this crime report to other pertinent agencies: The Financial Crimes Enforcement Network within the U.S. Treasury, the Internal Revenue Service (IRS), and Homeland Security Investigations.

  (version#initial)(1017)&emsp;Furthermore, for the sake of transparency in this unprecedented Criminal RICO case, I have decided to publish the crime reports I submit to the FBI online. They will be available, among other websites, on Federal-Bureau-of-Investigation.com, another NON-OFFICIAL website I created to promote transparency in this exceptional case.

