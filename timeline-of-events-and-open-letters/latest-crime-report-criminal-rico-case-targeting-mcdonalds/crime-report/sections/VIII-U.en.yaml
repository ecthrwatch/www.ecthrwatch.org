  (version#initial)(1055)&emsp;"<span style="color:red;">Thus, for example, if a defendant's legal fees are paid by another in an effort to protect that other person's identity or legal interests or any other interests of the overall criminal venture, **such payments may not be bona fide**</span>. However, fee payments by third parties, standing alone, do not create any presumption of lack of bona fides, so long as the attorney's loyalty and obligation remains to the client and the third-party payment does not create any conflicting obligation to the payor." (I emphasize) => https://www.justice.gov/jm/jm-9-105000-money-laundering

  (version#initial)(1056)&emsp;IRS: "According to the legislative history of the amendment (134 Cong. Rec. S17367 (daily ed. November 10, 1988)):

  (version#initial)(1057)&emsp;[The provision] is vital to the effective use of the money laundering statute and would allow the Internal Revenue Service with its expertise in investigating financial transactions to participate in developing cases under § 1956. Under this provision any person who conducts a financial transaction that in whole or in part involves property derived from unlawful activity, intending to engage in conduct that constitutes a violation of the tax laws, would be guilty of a money laundering offense."

  "Section 1956 also directs that the authority to investigate money laundering violations is controlled by a Memorandum of Understanding which has been entered into by the Departments of Justice, Treasury, Homeland Security, and the Postal Service. *See* § 1956(e). Prosecutors should be aware of the provisions of this memorandum and do nothing to cause its abrogation."

  SOURCE: https://www.justice.gov/jm/jm-9-105000-money-laundering#9-105.750

