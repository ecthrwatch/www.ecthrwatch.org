  (version#initial)(1064)&emsp;9-131.000- THE HOBBS ACT- 18 U.S.C. § 1951 "This chapter focuses on the Hobbs Act (18 U.S.C. § 1951) which prohibits actual or attempted robbery or extortion affecting interstate or foreign commerce. Section 1951 also proscribes conspiracy to commit robbery or extortion without reference to the conspiracy statute at 18 U.S.C. § 371. Although the Hobbs Act was enacted as a statute to combat racketeering in labor-management disputes, the statute is frequently used in connection with cases involving public corruption, commercial disputes, violent criminals and street gangs, and corruption directed at members of labor unions." Source: https://www.justice.gov/jm/jm-9-131000-hobbs-act-18-usc-1951

