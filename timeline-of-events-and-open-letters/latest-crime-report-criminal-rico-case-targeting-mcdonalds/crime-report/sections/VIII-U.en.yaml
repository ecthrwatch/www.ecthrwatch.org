  (version#initial)(1067)&emsp;"Rule of law is a principle under which all persons, institutions, and entities are accountable to laws that are:

  (version#initial)(1068)&emsp;Publicly promulgated

  (version#initial)(1069)&emsp;Equally enforced

  (version#initial)(1070)&emsp;Independently adjudicated

  (version#initial)(1071)&emsp;And consistent with international human rights principles.

  (version#initial)(1072)&emsp;The courts play an integral role in maintaining the rule of law, particularly when they hear the grievances voiced by minority groups or by those who may hold minority opinions. Equality before the law is such an essential part of the American system of government that, when a majority, whether acting intentionally or unintentionally, infringes upon the rights of a minority, the Court may see fit to hear both sides of the controversy in court." Source: https://www.uscourts.gov/educational-resources/educational-activities/overview-rule-law

  (version#initial)(1073)&emsp;I may hold a minority opinion that McDonald's Corporation is a criminal enterprise, but once I demonstrate beyond a shadow of a doubt the crimes they've committed, like fraud for example, it becomes essential for the American authorities to handle this case impartially, without any biases which many people working for American institutions/agencies will necessarily simply because we are human and we can be blind to the obvious and be blind to our own blindness, as Daniel Kahneman perfectly described it.

