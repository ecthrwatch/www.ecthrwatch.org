  (version#initial)(1046)&emsp;Fraud against the United States and conspiracy to defraud the United States. VERY GOOD DOCUMENT: https://www.justice.gov/archives/jm/criminal-resource-manual-923-18-usc-371-conspiracy-defraud-us#:~:text=To conspire to defraud the,by means that are dishonest.

  (version#initial)(1047)&emsp;"or that the defendant performed acts or made statements that he/she knew to be false, fraudulent or deceitful to a government agency, which disrupted the functions of the agency or of the government. It is sufficient for the government to prove that the defendant knew the statements were false or fraudulent when made. The government is not required to prove the statements ultimately resulted in any actual loss to the government of any property or funds, only that the defendant's activities impeded or interfered with legitimate governmental functions."

  (version#initial)(1048)&emsp;"To conspire to defraud the United States means primarily to cheat the Government out of property or money, but it also means to interfere with or obstruct one of its lawful governmental functions by deceit, craft or trickery, or at least by means that are dishonest. It is not necessary that the Government shall be subjected to property or pecuniary loss by the fraud, but only that its legitimate official action and purpose shall be defeated by misrepresentation, chicane or the overreaching of those charged with carrying out the governmental intention.

  (version#initial)(1049)&emsp;Hammerschmidt, 265 U.S. at 188."

