id: I-B
level: 3
title: (I)(B) The Christian Duty to Report Wrongdoing
anchor_id: the-christian-duty-to-report-wrongdoing
raw_header: '### (I)(B) The Christian Duty to Report Wrongdoing {id="the-christian-duty-to-report-wrongdoing"}'
content: |-
  (version#initial)(52)&emsp;In light of the scriptural commands and my own Christian convictions, reporting wrongdoing is not merely a legal obligation but a divine mandate. The Scriptures make it clear, as stated in Exodus 20:16: “<span style="color:red;font-style:italic;">You shall not bear false witness against your neighbor.</span>” This commandment not only prohibits lying but also compels us to speak out against falsehood and injustice wherever they may arise.

  (version#initial)(53)&emsp;Similarly, Isaiah 59:4 paints a vivid picture of a society overwhelmed by deceit and injustice:<br>
        “<span style="font-style:italic;">No one enters suit justly;</span><br>
                <span style="font-style:italic;">no one goes to law honestly;</span><br>
          <span style="font-style:italic;">they rely on empty pleas, they speak lies,</span><br>
                <span style="font-style:italic;">they conceive mischief and give birth to iniquity.</span>”

  (version#initial)(54)&emsp;This passage, like many others in the prophetic books, is not only a critique of current misdeeds but also a call to amend our ways and seek justice and truth earnestly.

  (version#initial)(55)&emsp;In my efforts to expose the malpractices at McDonald’s Corporation, I am driven by these biblical injunctions. The decision to report their actions stems from a commitment to uphold the principles of truth and justice, foundational to both societal wellbeing and Christian doctrine. Reporting such activities aligns with the biblical imperative to protect the innocent and ensure that justice prevails. It is a reflection of my duty, not to spread rumors or engage in gossip, but to act responsibly and courageously in the face of wrongdoing.

  (version#initial)(56)&emsp;This commitment to truth is further underscored by the Christian belief that God is law and justice. As I challenge the attempts by <span style="text-decoration:underline;font-style:italic;">any</span> entity, whether corporate <span style="text-decoration:underline;font-style:italic;">or governmental</span>, to silence this truth through a gag order, I stand firm on the promise that “<span style="font-style:italic;">the truth will set you free</span>” (John 8:32). My pursuit is not motivated by personal gain but by a sincere desire to see justice served and integrity restored in accordance with God’s law.

  (version#initial)(57)&emsp;While the crimes committed by McDonald’s Corporation and its accomplices on a global scale are already exceptionally serious, <span style="color:red;font-weight:bold;font-style:italic;">any attempt by the American and/or French governments to cover up these crimes would constitute an even graver category of offenses.</span>

  (version#initial)(58)&emsp;<span style="color:red;font-weight:bold;">Guarantee of Disclosure:</span>

  (version#initial)(59)&emsp;It is important to clarify that my earlier pursuits may have been influenced by personal circumstances, including financial distress and my wife's health concerns. Initially, any potential settlement with McDonald's might have alleviated these personal hardships. However, the focus of my actions has evolved significantly, particularly after being blackmailed, threatened, spied upon by the French government, and now informally served with a gag order—an action that could be seen as a further instance of blackmail and threat. Today, my commitment to exposing the truth is driven by a desire <span style="text-decoration:underline;font-style:italic;">to prevent further harm to others</span> and to seek justice for the irreversible damages caused by this criminal enterprise. High-level officials from France have already partaken in these activities, at the very least through serious criminal negligence, as I have [detailed in a communication submitted to the European Court of Human Rights](https://www.ecthrwatch.org/timeline/ecthr-request-for-interim-measures-fax-submission-2023-12-15/)[^IB8].

  (version#initial)(60)&emsp;<span style="color:red;font-weight:bold;text-decoration:underline">Should there be any attempts by governmental entities to protect or obscure the serious crimes committed by McDonald’s Corporation and its accomplices, I assure all stakeholders that these efforts will be met with heightened vigilance and escalated actions to ensure maximum scrutiny and public awareness.</span> I am committed to full and thorough disclosure of the facts surrounding these cases. My resolve is to bring transparency to these proceedings, ensuring that justice is served openly and without interference. <span style="color:red;font-weight:bold;text-decoration:underline">The involvement of any government in protecting McDonald’s would be utterly unacceptable, compounding the gravity of the original offenses and betraying public trust.</span>

  (version#initial)(61)&emsp;<span style="font-weight:bold;text-decoration:underline">I won’t act against conscience.</span>

  (version#initial)(62)&emsp;“Better is a little with righteousness than great revenues with injustice.” (Proverbs 16:8)

