raw_header: '### (II)(B) Drawing Parallels, McDonald’s Corporation and its Accomplices are Architects of Mortality: They Have Probably Already Caused, or Will Certainly Cause in the Future, Far More Premature Deaths Than Volkswagen {id="mcdonalds-corporation-and-its-accomplices-are-architects-of-mortality"}'
content: |-
  (version#initial)(222)&emsp;For decades, the public has been systematically misled by McDonald’s false portrayal of itself as an ethical entity. Such claims are a stark contradiction to the reality of its criminal operations. It’s imperative that we critically reassess these narratives and unmask McDonald’s Corporation and its accomplices for what they genuinely are: a criminal organization comparable to the most notorious mafias.

  (version#initial)(223)&emsp;McDonald’s, albeit not through overt violence, inflicts serious harm. Its criminal activities encourage the consumption of unhealthy food, which has probably already indirectly contributed, or will certainly indirectly contribute in the future, to premature deaths among its consumers.

  (version#initial)(224)&emsp;Prominent critiques, such as those from Lord Watson of Wyre Forest, a member of the House of Lords, the upper house of the Parliament of the United Kingdom, [sharply criticized](https://www.theguardian.com/business/2019/mar/17/tom-watson-urges-mcdonalds-cancel-unhealthy-campaign-promotion)[^6] McDonald’s Monopoly promotion describing it as a “grotesque marketing strategy” and unequivocally branding it “a danger to public health.”

  (version#initial)(225)&emsp;Unbeknownst to Lord Watson, the situation extends beyond ethical concerns; evidence I've gathered confirms that McDonald’s Corporation and its accomplices are deeply entwined in criminal activities surrounding their fraudulent sweepstakes. These include serious crimes, including, but not limited to, McDonald's Europe, based in London, playing a role in the serious crimes of cross-border money laundering operations.

  (version#initial)(226)&emsp;The case of Volkswagen, which faced severe backlash and was, in a way, held indirectly accountable for the future premature deaths caused by manipulating engine emissions, sets a precedent:

  (version#initial)(227)&emsp;If individuals and legal entities like corporations are indeed equal under the law, then similar scrutiny must be applied to McDonald’s Corporation and its accomplices.

  (version#initial)(228)&emsp;It’s essential to question: How many lives might have already been, and/or certainly will be in the future, adversely affected by their crimes? We must not shy away from labeling them accurately: McDonald’s Corporation and its accomplices are perpetrators of fraud and architects of mortality.

  (version#initial)(229)&emsp;The severity of these actions and their classification as equivalent to manslaughter may vary across legal systems. However, if the indirect consequences of their crimes will be responsible for hundreds of thousands, if not more, of premature deaths, such a comparison warrants serious consideration. We must be fearless in declaring the truth: McDonald’s criminal practices contribute to loss of years of life.

  (version#initial)(230)&emsp;Moreover, we must acknowledge the broader societal impact of McDonald’s practices: the strain on national social security systems. Individuals suffering from chronic conditions like diabetes, heart diseases, exacerbated by the overconsumption of unhealthy food, inevitably lead to increased healthcare costs. These expenses are ultimately borne by social security systems, underscoring the far-reaching consequences of dietary habits influenced by junk food consumption.

  (version#initial)(231)&emsp;While McDonald’s is not the sole entity selling unhealthy food, its extensive involvement in criminal activities to boost profits distinguishes it significantly. Given this overstepping of legal boundaries, it is reasonable to argue that McDonald’s should face punitive damages through legal proceedings. This approach not only holds them accountable for their actions but also serves as a deterrent against similar conduct by other corporations.

  (version#initial)(232)&emsp;The information provided in the studies previously mentioned and conducted by researchers at MIT and Harvard University is crucial, especially considering McDonald’s evil marketing strategies, which skillfully target vulnerable demographics, including children and teenagers. A notable example is one of McDonald’s partners in crime, The Marketing Store, in France, proudly professing their expertise in engaging these young audiences. Such tactics, deliberately designed to exploit, can only be described as malevolent. Remember, even thirteen-year-old children are expected to discern the implications of these sophisticated marketing schemes. This exploitation of innocence is nothing short of diabolical.

  (version#initial)(233)&emsp;A post[^7],[^7-bis] published in March 2024 by the American Cancer Society on LinkedIn states that “McDonald's changed the way kids dined when they launched the Happy Meal nationwide in 1979. If you were also established in 1979, then it's time to talk with your healthcare provider about colorectal cancer screening. \[…\]” (I emphasize).

  (version#initial)(234)&emsp;This post by the American Cancer Society unambiguously implies a correlation between the commercial practices of McDonald’s and cancer.

  (version#initial)(235)&emsp;See the screenshot of the American Cancer Society’s post below for evidence:<br>
  {{< imgproc2 american-cancer-society-mcdonalds-happy-meals-cancer.jpg Fit "600x600 webp q90" "" />}}
  {#screenshot_of_linkedin_post_by_american_cancer_society}

  (version#initial)(236)&emsp;So, yes. McDonald’s kills. Sure, it's not as fast as a bullet in the head but as the American Cancer Society’s post clearly implies, an unhealthy diet will, sooner or later, cause serious health complications and therefore, sometimes, premature death.

  (version#initial)(237)&emsp;And I believe the number of premature deaths that McDonald’s Corporation and their accomplices have already caused or will cause in the future might be thousands-fold higher than the number of premature deaths Volkswagen will cause. Which leads us to the next question, and section: equality before the law.
