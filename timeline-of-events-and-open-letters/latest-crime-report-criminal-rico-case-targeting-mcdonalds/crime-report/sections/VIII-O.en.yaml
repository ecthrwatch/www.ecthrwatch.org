raw_header: '### (VIII)(O) 18 U.S.C. § 371—CONSPIRACY TO DEFRAUD THE UNITED STATES {id="conspiracy-to-defraud-united-states"}'
content: |-
  (version#initial)(998)&emsp;Source: https://www.justice.gov/archives/jm/criminal-resource-manual-923-18-usc-371-conspiracy-defraud-us

  (1) Although this language is very broad, cases rely heavily on the definition of "defraud" provided by the Supreme Court in two early cases, Hass v. Henkel, 216 U.S. 462 (1910), and Hammerschmidt v. United States, 265 U.S. 182 (1924).

  (2) In Hass the Court stated:

  (1) The statute is broad enough in its terms to include any conspiracy for the purpose of impairing, obstructing or defeating the lawful function of any department of government . . . (A)ny conspiracy which is calculated to obstruct or impair its efficiency and destroy the value of its operation and reports as fair, impartial and reasonably accurate, would be to defraud the United States by depriving it of its lawful right and duty of promulgating or diffusing the information so officially acquired in the way and at the time required by law or departmental regulation. (Hass, 216 U.S. at 479-480.)

  (3) In Hammerschmidt, Chief Justice Taft, defined "defraud" as follows:

  (1) To conspire to defraud the United States means primarily to cheat the Government out of property or money, but it also means to interfere with or obstruct one of its lawful governmental functions by deceit, craft or trickery, or at least by means that are dishonest. It is not necessary that the Government shall be subjected to property or pecuniary loss by the fraud, but only that its legitimate official action and purpose shall be defeated by misrepresentation, chicane or the overreaching of those charged with carrying out the governmental intention. (Hammerschmidt, 265 U.S. at 188.) (I emphasize)

