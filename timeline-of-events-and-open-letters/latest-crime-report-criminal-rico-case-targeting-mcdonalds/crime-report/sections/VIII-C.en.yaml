id: VIII-C
level: 3
title: (VIII)(C) "Consumer Psychology and the Problem of Fine Print Fraud"
anchor_id: consumer-psychology-fine-print-fraud
raw_header: '### (VIII)(C) "Consumer Psychology and the Problem of Fine Print Fraud" {id="consumer-psychology-fine-print-fraud"}'
content: |-
  (version#initial)(867)&emsp;Modern consumer contracts are pervasive, often characterized by intricate fine print that is overlooked or misunderstood by the average consumer. The problem escalates when such contracts arise out of deceitful actions by businesses. This section is based on an enlightening study by Furth-Matzkin and Sommers that delves into how laypeople respond to contracts stemming from fraudulent actions.

  (version#initial)(868)&emsp;Source: Furth-Matzkin, Meirav and Sommers, Roseanna, Consumer Psychology and the Problem of Fine Print Fraud (April 25, 2019). 72 STANFORD LAW REVIEW___ (Forthcoming), U of Michigan Law & Econ Research Paper No. 19-018, Available at SSRN: https://ssrn.com/abstract=3378353

  (version#initial)(869)&emsp;Consumer contracts in the context of fraud have been a long-standing topic of discussion. Recent findings, however, shed light on the profound impact of fine print on consumer psychology, debunking the common myth that such details are merely inconsequential.

  (version#initial)(870)&emsp;The Influence of Fine Print on Consumers: Conventionally, fine print in contracts is often dismissed as being trivial or treated as "white noise." However, studies indicate a much more profound effect. Fine print, even when unread or unnoticed at the point of signing a contract, can significantly affect a consumer's behavior and decisions after discovering they were misled.

  (version#initial)(871)&emsp;False Representations & Consumer Behavior: The study presented scenarios where sellers misled consumers with false promises, which were directly contradicted in the contract's fine print. What's startling is that, upon discovering the fraud, laypeople felt demoralized rather than wronged. Contrary to what legal professionals might believe, these laypeople often assumed that they had consented to these terms and that the contract, even if induced by deception, was valid and binding.

  (version#initial)(872)&emsp;The Impact of Deception on Contract Legitimacy: One might expect that discovering a seller's deception would undermine the perceived legitimacy of the contract. Surprisingly, the study found that the realization of being deceived did little to alter consumers' beliefs about the enforceability of the agreement. They still believed that the written contract was the ultimate authority, even if it contradicted verbal promises.

  (version#initial)(873)&emsp;Effect of Anti-Deception Consumer Protection Laws: Informing consumers about laws designed to protect against deception changed their perspectives slightly. While awareness of these laws did make consumers more skeptical of fraudulent contracts, it did not entirely erase their deep-seated belief in the sanctity of the written word in contracts.

  (version#initial)(874)&emsp;Implications for Business and Law: The study's findings have profound implications for both business practices and legal remedies. Relying solely on legal provisions to counteract deceptive practices seems inadequate. The very psychology of consumers, shaped by their trust in the finality of written contracts, poses a significant challenge. The need of the hour is to design interventions that both educate consumers and challenge these ingrained beliefs.

  (version#initial)(875)&emsp;In conclusion, while fine print might seem an insignificant aspect of consumer contracts, its psychological effects can't be ignored. The prevailing mechanisms to combat deceptive business tactics might need reevaluation, ensuring they align better with consumer perceptions and behaviors.

  (version#initial)(876)&emsp;It's important to note that the term "fine print" refers to any additional, often detailed information provided in a smaller font size at the bottom or on the back of an advertisement or other promotional material. It's typically used to include disclaimers, additional terms, or clarifications that might not be highlighted in the main body of the advertisement. But as it was demonstrated, the criminal entity McDonald's Corporation and their accomplices never disclosed to their victims that the fraudulent "1 in 4" claim was not a probability but the result of the sum of what we call in probability theory the probability mass function (PMF) of the hypergeometric distribution for obtaining at least k successes, summing from i = k to the minimum of n and K, each term calculating the probability of exactly i successes in a sample of size n from a population of N with K successes.

  (version#initial)(877)&emsp;Let's indulge in a bit of speculation for a moment. Imagine if McDonald's had decided to include in the fine print a mocking disclaimer along the lines of, "Haha! Got you! Actually, the odds are 1 in 8, not 1 in 4, because this figure is the result of the sum of the probability mass function (PMF) of the hypergeometric distribution yada yada yada..." Even if they had attempted to cloak their deceptive claim with this form of 'transparency,' would it truly absolve them of their mass-marketing fraud? The answer, grounded in the findings of this study, is a resounding no. Even a candid admission of the real odds in the fine print—which, let's be clear, McDonald's did not provide—would not legalize such deceptive practices. In numerous jurisdictions worldwide, including the United States, laws strictly prohibit misleading consumers in this manner. But let's not forget, McDonald's didn't even offer this hypothetical disclaimer. The absence of any clarification about the actual probability of winning leaves us with a straightforward case of fraud.

