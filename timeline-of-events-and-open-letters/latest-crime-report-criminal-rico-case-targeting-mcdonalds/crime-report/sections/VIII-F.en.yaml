title: '(VIII)(F) Understanding the Financial Core: Market Capitalization vs. Book Value (a.k.a. Shareholder''s Equity), and McDonald''s Massive Shares Buybacks'
anchor_id: market-capitalization-vs-book-value
raw_header: '### (VIII)(F) Understanding the Financial Core: Market Capitalization vs. Book Value (a.k.a. Shareholder''s Equity), and McDonald''s Massive Shares Buybacks {id="market-capitalization-vs-book-value"}'
content: |-
  (version#initial)(911)&emsp;In financial parlance, the distinction between market capitalization and book value is fundamental, yet often overlooked in popular discourse. Let's delve deeper into what sets these two metrics apart and why this distinction could be the linchpin when evaluating the real vulnerability of a corporate giant like McDonald's Corporation.

  (version#initial)(912)&emsp;Market Capitalization: This is a snapshot of what the market believes a company is worth at any given moment. It's calculated by multiplying the current stock price by the total number of outstanding shares. However, this figure is notoriously volatile, swayed by market sentiments, rumors, news, and even geopolitical events.

  (version#initial)(913)&emsp;Book Value (Shareholder's Equity): On the other hand, the book value represents the net value of a company's total assets minus its total liabilities. Think of it as the residual value to shareholders if the company were to be liquidated. Unlike market capitalization, book value is based on a company's balance sheet, a more concrete and less speculative representation of its worth.

  (version#initial)(914)&emsp;When gauging the financial stability or vulnerability of a company, relying solely on market capitalization can be misleading. While a high market cap might suggest robustness, it's the book value that gives a clearer picture of the company's "safety net" in times of crisis.

  (version#initial)(915)&emsp;In the case of McDonald's Corporation, if legal actions, penalties, and reparations were to chip away at its finances, it would be the book value that would serve as its actual buffer, not its inflated market capitalization. Knowing this distinction can make all the difference in understanding the true scale of impact potential lawsuits and penalties could have on the company's solvency.

  (version#initial)(916)&emsp;The latest annual report of McDonald's Corporation reveals a striking detail: the company's total shareholders' equity stands at a deficit of approximately $6 billion. This raises a pertinent question: How can a corporation, with an impressive market capitalization of $186 billion, display a negative book value?

  (version#initial)(917)&emsp;Let's delve into the apparent discrepancy between a company's large market capitalization and a negative book value, particularly through the lens of share repurchases.

  (version#initial)(918)&emsp;1. Negative Shareholder's Equity (Book Value): When a company reports a negative shareholder's equity, it means that its liabilities exceed its assets. This situation doesn't necessarily indicate financial distress. Sometimes, it's the result of accounting practices or financial strategies, such as share repurchases.

  (version#initial)(919)&emsp;2. Share Repurchases and Negative Equity:

  (version#initial)(920)&emsp;Share repurchases, also known as stock buybacks, involve a company buying back its own shares from the open market. The primary reasons for this are:

  (version#initial)(921)&emsp;- To return value to shareholders directly.

  (version#initial)(922)&emsp;- To reduce the number of outstanding shares, which can increase earnings per share and potentially boost stock price.

  (version#initial)(923)&emsp;- To utilize excess cash in a way that might be seen as beneficial for shareholders.

  (version#initial)(924)&emsp;From an accounting standpoint, when a company repurchases its shares, those shares become 'treasury stock'. The cost of these repurchased shares is then subtracted from shareholder's equity on the balance sheet, which reduces the total shareholder's equity. If a company repurchases a large number of shares, it can significantly decrease shareholder's equity and, in some cases, make it negative.

  (version#initial)(925)&emsp;3. Relevance of Accounting Rules:

  (version#initial)(926)&emsp;Under most accounting standards, including the Generally Accepted Accounting Principles (GAAP), treasury stock is recorded at cost (the price the company paid to repurchase the shares) and shown as a contra-equity account on the balance sheet. This means it's subtracted from shareholder's equity. The accounting treatment is not influenced by the market value of these shares. If the company repurchases the shares at a price higher than its book value, it can further dilute the shareholder's equity.

  (version#initial)(927)&emsp;4. Discrepancy in Shares:

  (version#initial)(928)&emsp;The "number of shares outstanding of the registrant's common stock as of January 31, 2023: 731,496,951" signifies the total shares that are currently held by all shareholders, including institutional investors, insiders, etc. The difference between this number and the larger "929.3 million shares" that McDonald's Corporation owned as of December 31, 2022, indicates the amount of treasury stock the company holds.

  (version#initial)(929)&emsp;In essence, even though treasury stocks reduce shareholder's equity, they don't diminish the intrinsic value or operational capacity of a company. However, a negative book value can be a concern for some investors, as it shows that the company has more liabilities than assets when excluding market value considerations. Still, it's essential to evaluate the entire financial picture, including cash flow, revenue, and other metrics, before drawing conclusions about a company's financial health.

  (version#initial)(930)&emsp;Isn't it alarming to consider a scenario where a corporation, fully aware of its illicit activities that could essentially render it bankrupt, remains silent? Where executives, rather than coming clean, opt to buy back the company's shares to artificially elevate the stock price, all while keeping their trusting shareholders in the dark? And where those very executives benefit personally, capitalizing on stock options, all based on this deception? What could one possibly call such actions, and under what legal framework might they fall?

  (version#initial)(931)&emsp;The situation I describe involves multiple potential legal and ethical breaches. Here's a breakdown:

  (version#initial)(932)&emsp;1. Misrepresentation and Omission: If executives are aware of ongoing criminal activities within their corporation and intentionally do not disclose this to shareholders and potential investors, they might be guilty of securities fraud. Specifically, companies are obligated to disclose material information — that is, any information a reasonable investor would consider important when deciding whether to buy or sell a stock.

  (version#initial)(933)&emsp;2. Manipulation: Intentionally buying back shares to artificially inflate the stock price is a form of market manipulation. This is prohibited under securities law in many jurisdictions, as it distorts the true market value of a security.

  (version#initial)(934)&emsp;3. Insider Trading: If corporate executives, having non-public knowledge about the criminal activities and potential adverse impacts on the stock price, trade the company's stock (such as exercising stock options), they might be engaged in insider trading, which is illegal in many countries.

  (version#initial)(935)&emsp;4. Breach of Fiduciary Duty: Corporate officers and directors owe fiduciary duties to their shareholders. This includes the duty of care (making decisions in the best interest of the corporation) and the duty of loyalty (putting the corporation's interests above their own). Engaging in or concealing illegal activities and manipulating stock prices for personal gain could be seen as a breach of these duties.

  (version#initial)(936)&emsp;5. Enrichment at the Expense of Shareholders: Receiving stock options and then artificially boosting the stock price to exercise these options at a profit, all while being aware of detrimental information not known to the public, can be considered unjust enrichment.

  (version#initial)(937)&emsp;Given the situation described, it's evident that such actions by McDonald's are not just unethical, but criminal. In the United States, the Securities and Exchange Commission (SEC) oversees federal securities laws, and such manipulative practices undoubtedly breach these regulations.

  (version#initial)(938)&emsp;Considering I first brought this to the SEC's attention via the whistleblower office program in 2015 and again in 2022, it's high time for the SEC to acknowledge the gravity of these actions. McDonald's should face criminal indictment for such blatant disregard of the law.

  (version#initial)(939)&emsp;Key applicable laws include:

  (version#initial)(940)&emsp;- The Securities Act of 1933 and the Securities Exchange Act of 1934, which, among other things, prohibit fraudulent acts, misrepresentations, and omissions in the offer and sale of securities and in connection with the purchase or sale of securities.

