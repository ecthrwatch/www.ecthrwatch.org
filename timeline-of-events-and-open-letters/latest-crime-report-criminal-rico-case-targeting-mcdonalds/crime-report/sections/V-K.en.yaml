raw_header: '### (V)(K) Immediately Initiate Asset Forfeiture Measures Against McDonald''s Corporation and Any Complicit Parties (SECTION FORMERLY CALLED (V)(Uncategorized-1)) {id="initiate-asset-forfeiture-measures-against-mcdonalds-corporation-and-complicit-parties"}'
content: |-
  (version#initial)(801)&emsp;Given the magnitude of the purported fraud, the Department of Justice should invoke its authority, as per Title 18 U.S.C. § 981 and § 982, to immediately initiate asset forfeiture measures against McDonald’s Corporation and any complicit parties. Such actions are especially warranted if it becomes evident that the sums due to victims eclipse McDonald’s current market capitalization, not to mention the intrinsic value or book value of the company.

  (version#initial)(802)&emsp;The book value, sometimes referred to as shareholders’ equity, provides a more genuine representation of a company’s net value. For McDonald’s Corporation, the book value is currently negative, a situation largely attributed to the extensive share buybacks the corporation has undertaken. While I’ll expound on this in detail later, there’s an underlying impression that the structure of these buybacks bears similarities to certain aspects of a Ponzi scheme. For the record, I am not categorically stating that McDonald’s Corporation is operating a Ponzi scheme; this is simply a preliminary concern that will be discussed further later in this crime report.

  (version#initial)(803)&emsp;Please allow me to emphasize that civil forfeiture doesn’t require a criminal conviction or even criminal charges against the owner of the asset. Instead, the asset itself is named as the defendant (a process known as “in rem”, or “against the property”). The government only needs to show that the property was connected to certain illegal activities, usually by a “preponderance of the evidence” which is a lower standard than the “beyond a reasonable doubt” standard in criminal cases.

  (version#initial)(804)&emsp;The Department of Justice, through its various divisions (like the Asset Forfeiture Program), can and does initiate civil and criminal forfeitures based on a broad range of offenses, including fraud.

  (version#initial)(805)&emsp;The government can initiate forfeiture procedures before a final judgment has been reached in the case, especially in situations where they believe the assets might be hidden, spent, or moved outside the jurisdiction of the court before the case is concluded. This is called “preliminary” or “prejudgment” forfeiture. The goal is to preserve the assets so they can be available for forfeiture if the government is ultimately successful in its case.

  (version#initial)(806)&emsp;Civil forfeiture in the U.S. federal system is primarily governed by Title 18, U.S.C., Section 981 and Title 21, U.S.C., Section 881. These statutes provide the framework and authority for the government to seize and forfeit property involved in certain offenses.

  (version#initial)(807)&emsp;For the specific details about the standard of proof and the “in rem” nature:

  (version#initial)(808)&emsp;Civil Forfeiture Standard of Proof: The standard of proof was raised by the Civil Asset Forfeiture Reform Act (CAFRA) of 2000. Under CAFRA, the government’s standard of proof in federal civil forfeiture proceedings is “preponderance of the evidence.” This is laid out in 18 U.S.C. § 983(c).

  (version#initial)(809)&emsp;“In Rem” Proceedings: The concept of “in rem” forfeiture (i.e., against the property itself) is embedded in the language of many forfeiture statutes. For example, for assets related to money laundering, 18 U.S.C. § 981 provides the authority for the government to seize and forfeit property involved in or traceable to certain offenses, including money laundering offenses. Section 981(a)(1)(A) specifically states that any property involved in a transaction or attempted transaction in violation of sections 1956, 1957, or 1960 of title 18 (which cover money laundering and illegal money transmitting) is subject to forfeiture.

  (version#initial)(810)&emsp;Moreover, many forms of fraud can lead to money laundering charges when the illicitly gained funds are moved, used, or disguised. Therefore, the assets connected to such fraudulent schemes can be subject to forfeiture under money laundering statutes as well.

  (version#initial)(811)&emsp;Again, civil forfeiture actions are "in rem" (against the property itself). This means the government alleges that the property itself was involved in or is traceable to the commission of the relevant offense, rather than pursuing action against the owner of the property. The goal is to remove the assets from the illicit enterprise and deprive wrongdoers of the proceeds of their activities.

