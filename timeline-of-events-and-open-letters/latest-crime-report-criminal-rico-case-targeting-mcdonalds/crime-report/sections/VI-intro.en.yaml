raw_header: '## (VI) Truth is Power: Mathematics is Power {id="truth-is-power-mathematics-is-power"}'
content: |-
  (version#initial)(838)&emsp;[TO IMPROVE] First, remember that some of the franchisees seem to feel very proud that they are "killing" competition. Never forget that. Never forget that you are dealing with one of the most powerful white-collar crime syndicate.

  (version#initial)(839)&emsp;[TO IMPROVE] before I start listing some of the crimes committed by McDonald's Corporation and its accomplices, it's important for you to arm yourself with knowledge and how to tackle this case, the best angle to create a breach. Some law enforcement agencies like the FBI will handle McDonald's Corporation. But I feel concerned to help out the local law enforcement community which might not have the same resources. And I want to help you building the strongest possible case.

  (version#initial)(840)&emsp;[TO IMPROVE] Truth is Power and Mathematics is Power. God gave you a brain, use it!

  (version#initial)(841)&emsp;[TO IMPROVE] If your have proceeded to freeze the assets of a franchisee, if you face their attorneys or legal counsel, they might attempt to mislead you, even lie to you. It's what the Big Law law firm Allen & Overy, which is now accused of aiding and abetting McDonald's Corporation and its accomplices to commit the crime of money laundering, did.

  (version#initial)(842)&emsp;[TO IMPROVE] Start by focusing your efforts on the "1 in 4" mass-marketing fraud. You must have a perfect understanding of something: always remember that the sweepstakes was the equivalent of a draw without replacement. So, you must first make it clear that it is the equivalent in probability theory of a draw without replacement. And any time a lawyer for McDonald's accomplice gives you a counter example with a flipping a coin or rolling a die, cite him for obstruction and lying to a police officer. Same in a court of law, when they will face a jury: disbar the rotten lawyer. The Bible says that [quote]

