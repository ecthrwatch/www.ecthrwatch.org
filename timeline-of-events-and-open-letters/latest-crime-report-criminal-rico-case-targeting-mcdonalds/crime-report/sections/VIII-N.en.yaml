title: (VIII)(N) Concerns for State Revenue Authorities
anchor_id: concerns-for-state-revenue-authorities
raw_header: '### (VIII)(N) Concerns for State Revenue Authorities {id="concerns-for-state-revenue-authorities"}'
content: |-
  (version#initial)(994)&emsp;It's crucial to recognize that if McDonald's Corporation engaged in mass-marketing fraud and subsequent money laundering—as demonstrated beyond a shadow of a doubt in certain aspects—this does not merely represent a federal issue but also poses serious concerns for state revenue authorities.

  (version#initial)(995)&emsp;When a large corporation like McDonald's Corporation engages in nationwide criminal practices, the economic repercussions are felt across the board, impacting state-level economies as well. These illicit activities can divert funds from legitimate businesses, causing a reduction in state tax revenue derived from those businesses. Additionally, the illegal gains accrued through such criminal enterprises may not be reported correctly, leading to further loss of state-level tax revenue.

  (version#initial)(996)&emsp;Given the fungibility of money, illicit income that enters the corporation's revenue stream contaminates the entire pool, making it complex to differentiate between 'clean' and 'dirty' money. Thus, McDonald's Corporation could potentially be dodging state taxes on income that is illicitly obtained, affecting state budget allocations for essential public services like education, health, and infrastructure.

  (version#initial)(997)&emsp;Therefore, this case should not just be of interest to federal agencies but also to individual state revenue and taxation departments. Their cooperation and vigilance are vital in fully untangling the economic impacts and ensuring compliance with both state and federal laws.

