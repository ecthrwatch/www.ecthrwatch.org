raw_header: '### (IV)(CC) 5th Example of Fraud: the 2012 "Collect-to-Win" Fraud by McDonald''s France and Accomplices {id="mcdonalds-france-2012-collect-to-win-fraud"}'
content: |-
  (version#initial)(423)&emsp;In December 2011, after detecting fraudulent practices, I sent a formal notice to McDonald's France and a few of their partners in crime. The notice, sent via certified mail with proofs of receipt requested, drew attention to the fraudulent practices they were involved in. McDonald's France offered no response.

  (version#initial)(424)&emsp;Undeterred, on June 12, 2012, I sent a second formal notice. I reiterated the accusations of their deceitful tactics and implored them to promptly inform top executives at McDonald's Corporation and its Board of Directors. Specifically, I listed the following individuals: James Skinner, Douglas Goare, Peter Bensen, Andrew McKenna, Timothy Fenton, Janice Fields, Donald Thompson, Gloria Santona (note: the then General Counsel of McDonald's Corporation who I would directly and personally notify in 2015 and who would acknowledge taking the inquiry seriously), Jose Armario, Richard Floersch, Kevin Newell, Jeffrey Stratton, Kevin Ozan, Susan Arnold, Robert Eckert, Enrique Hernandez (note: the then and still current Chairman of the Board who I would later notify but who seems to be burying his head in the sand), Jeanne Jackson, Richard Lenny, Walter Massey, Cary McMillan, Sheila Penrose, John Rogers, Roger Stone, and Miles White.

  (version#initial)(425)&emsp;In the same correspondence, I emphasized that, based on rough estimations, McDonald's owed French consumers a staggering sum of over 86 billion euros. Considering the market capitalization of McDonald's Corporation was approximately 88.49 billion dollars at that time, I advised McDonald's France and its associates to immediately alert their headquarters in the U.S. This was to ensure that American financial regulators were informed, and a profit warning was promptly issued. However, I must note a warning: I came to realize around spring 2023 that this figure of 86 billion euros might be significantly underestimated.

  (version#initial)(426)&emsp;The only response received was a letter from the General Counsel of McDonald's France, Françoise de Borda, audaciously claiming the legality of their operation. This defense, asserting the legitimacy of a marketing strategy that evidently deceived consumers, including children, was not just dismissive. Either they knowingly participated in fraud and money laundering, or the General Counsel of McDonald's France demonstrated criminal negligence of the highest order.

  (version#initial)(427)&emsp;In the subsequent months of 2012, showcasing brazen criminality, McDonald's France and its associates doubled down, launching yet another iteration of the McDonald's Monopoly. Their blatant disregard for the French criminal code was exemplified when McDonald's France, in their 2012 fraudulent campaign, showcased an almost equal distribution of properties like "RUE DE LA PAIX" and "AVENUE DES CHAMPS-ÉLYSÉES" on their website. Nowhere did they indicate, neither in the fine print nor the official rules, the rarity of some stickers. For instance, while they displayed multiple "RUE DE LA PAIX" stickers, only one such sticker, to my subsequent understanding, existed for the entire 2012 game in France.

  (version#initial)(428)&emsp;

  ![2012 McDonald's France Monopoly MAX promotional webpage showing misleading distribution of game pieces including multiple "Rue de la Paix" and "Avenue des Champs-Élysées" stamps](images/2012_preuve_intention_deliberee.jpg)

  (version#initial)(429)&emsp;The visual representation is a circular arrangement of Monopoly game pieces dispersed around the promotional logo "MONOPOLY." Notably, the distribution and frequency of the game pieces, particularly the "RUE DE LA PAIX" and "AVENUE DES CHAMPS-ÉLYSÉES" stamps, give a distinct impression.

  (version#initial)(430)&emsp;There are four "RUE DE LA PAIX" game stamps and three "AVENUE DES CHAMPS-ÉLYSÉES" game stamps, which are seemingly sprinkled amongst various other game pieces. Their almost equal number, coupled with their even distribution, strongly implies a parity in the likelihood of obtaining each stamp. This visual presentation obviously lead consumers to assume that all properties, including the aforementioned rare ones, have an equivalent distribution and are thus equally attainable.

  (version#initial)(431)&emsp;In essence, the visual layout of the game pieces, with nearly equal counts and evenly spaced placements for properties, suggests an equal probability for each property, criminally and deliberately misleading consumers regarding the true odds of the game.

  (version#initial)(432)&emsp;To ensure that American authorities fully grasp the gravity of the situation, it's pivotal to note that the "RUE DE LA PAIX" property in the French version is analogous to the "BOARDWALK" property in the U.S. game. And it bears repeating that there was no mechanism for French consumers to discern that certain properties were, in fact, scarce. Astoundingly, in the 2011 edition of this criminal campaign, McDonald's France overtly instructed that before laying claim to a prize, consumers were mandated to complete the entire board! Is there any record of such an accomplishment in any of the countries where these questionable practices were deployed? To my knowledge, there isn't.

  (version#initial)(433)&emsp;Such misrepresentation is beyond mere oversight; it is willful, calculated deception. The very fact that a game named after the iconic Monopoly, a symbol of fair play in the world of board games, was used to perpetrate this fraud adds insult to injury.

  (version#initial)(434)&emsp;<span style="color:red;font-weight:bold;">In conclusion, if the regulatory authorities in the U.S. and Europe consider such behavior legal, the ramifications would be cataclysmic. Endorsing these fraudulent practices would equate to the outright legalization of fraud. The foundational pillars of our democratic systems—within Europe, the United States, and other affected countries—would shatter. If equality before the law holds any meaning, then McDonald's should be recognized as teetering on the brink of bankruptcy, as they must be held accountable for their egregious actions.</span>

