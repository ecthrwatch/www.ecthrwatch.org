title: (III)(E) Has the Miami-Dade Police Force Been Corrupted Already?
anchor_id: miami-dade-police-corrupted
raw_header: '### (III)(E) Has the Miami-Dade Police Force Been Corrupted Already? {id="miami-dade-police-corrupted"}'
content: |-
  (version#initial)(251)&emsp;On March 3, 2024, [I reached out to the Los Angeles District Attorney's Office to report](https://www.usa-v-mcdonalds.org/open-letters/latest-communications-with-state-and-local-law-enforcement-in-the-usa/docs/california/los-angeles/2024-04-03_2100_0800_email-to-the-Los-Angeles-County-District-Attorneys-Office.pdf) alleged criminal activities committed by McDonald's Corporation franchisees operating within their jurisdiction. This step was part of a broader effort to expose and address the potential misconduct at various local levels, highlighting a pattern that might not be isolated to a single area.

  (version#initial)(252)&emsp;Shortly after my inquiry, I received a [response from the DA's Office](https://www.usa-v-mcdonalds.org/open-letters/latest-communications-with-state-and-local-law-enforcement-in-the-usa/docs/california/los-angeles/2024-04-04_0048_0800_email-from-the-Los-Angeles-County-District-Attorneys-Office.pdf). They emphasized that "all crimes must be reported to the police for a proper investigation and a criminal finding, this office is unable to act. Please report the crime to the appropriate law enforcement agency in the jurisdiction where the crime occurred." This standard procedural response underlines the pivotal role local law enforcement plays in the initial stages of criminal investigations.

  (version#initial)(253)&emsp;Given this procedural framework, it is imperative to scrutinize the integrity and independence of local law enforcement agencies that are crucial first responders to allegations of corporate misconduct. This section will explore whether the Miami-Dade Police Force, similar to other local enforcement bodies, might have been influenced or compromised by corporate entities like McDonald's and their expansive network of franchisees. This examination seeks to understand the depth of McDonald's influence and whether it extends to affecting the foundational integrity of local law enforcement, particularly focusing on whether there have been instances that might suggest a compromise in their duties and responsibilities.

