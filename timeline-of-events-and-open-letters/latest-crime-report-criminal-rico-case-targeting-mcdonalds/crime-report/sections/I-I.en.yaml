id: I-I
level: 3
title: '(I)(I) Message To Local Law Enforcement Officials: Together, You Hold More Power Than the Federal Government!'
anchor_id: message-local-law-enforcement
raw_header: '### (I)(I) Message To Local Law Enforcement Officials: Together, You Hold More Power Than the Federal Government! {id="message-local-law-enforcement"}'
content: |-
  (version#initial)(197)&emsp;First, I personally trust that 99.5% to 99.99% of FBI agents are people of integrity. But sometimes, when there is a lot of money at stake, and lots of potential political pressure, even the best agents can have their hands tied. And maybe some hands are tied not within the FBI but within the DOJ. And maybe not in this administration but maybe in the previous one. And everything can change in real time. But if, and only if, there is some corruption, you, the local enforcement officials, policemen, sheriffs, assistant-district attorneys and district attorneys, States Attorneys General, you all hold in your hand huge power in this case, you can launch local investigations and talk to the media about it. All it will take is a little media attention and once a few articles are published, the truth will be known quickly.

