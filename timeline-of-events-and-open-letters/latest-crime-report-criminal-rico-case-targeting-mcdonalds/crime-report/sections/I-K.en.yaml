raw_header: '### (I)(K) OPTIONAL {id="section-i-k-optional"}'
content: |-
  (version#initial)(210)&emsp;The accomplices include, among other persons, the subsidiary companies of McDonald's Corporation, such as McDonald's USA, LLC (note: which is a different entity than McDonald's Corporation), and McDonald's France, and McDonald's Italy, and McDonald's Germany, and McDonald's China just to give a few examples.

  (version#initial)(211)&emsp;The accomplices also include these subsidiary companies' respective franchisees and even some suppliers.

  (version#initial)(212)&emsp;Among the franchisees are independent owner-operators; however, as the entities directly interacting with consumers, they are integral components of the criminal enterprise I am about to expose.

  (version#initial)(213)&emsp;That's the reason why for the United States, this crime report is intended for federal and local—both state and county—law enforcement officials.

  (version#initial)(214)&emsp;The same goes for other countries. In France, for example, each single Procureur de la République (public prosecutor, the French equivalent of a district attorney in the U.S.) has the power to launch a criminal investigation against individual franchisees/restaurants.

  (version#initial)(215)&emsp;Furthermore, even in the countries in which frauds never took place, the authorities should nevertheless launch criminal investigations to first determine to which extent the subsidiary company and its franchisees are part of this criminal enterprise orchestrated by McDonald's Corporation and second

  (version#initial)(216)&emsp;but also law enforcement officials in all of the countries across the globe where McDonald's operates, including the countries where crimes of mass-marketing frauds haven't taken place (I will explain later why).

  (version#initial)(217)&emsp;not limited to the SEC and the FBI but also local police departments and sheriff's offices in regions hosting McDonald's operations, but also for law enforcement officials in all of the countries across the globe where McDonald's operates.

  (version#initial)(218)&emsp;While the expansive scope of this report might seem overwhelming, I tried my best to craft it with precision and depth to ensure accuracy in detailing the crimes McDonald's Corporation and its network committed.

  (version#initial)(219)&emsp;Although I do not anticipate local law enforcement agencies to delve into the international dimensions of this case, they are under a legal mandate to investigate the crimes of individual McDonald's outlets within their jurisdictions. As a result, local law enforcement hold tremendous power. Following such local investigations, there should be a concerted effort to coordinate findings with the FBI and other pertinent agencies, to comprehensively address and act upon the criminal activities of McDonald's Corporation and its accomplices.

