raw_header: '## TLDR; EXECUTIVE SUMMARY: {id="tldr-executive-summary"}'
content: |-
  (version#initial)(1)&emsp;McDonald’s Corporation and its accomplices have engaged in a pattern of racketeering activity as defined under the Racketeer Influenced and Corrupt Organizations (RICO) Act in Title 18 of the United States Code, Section 1961(5).

  (version#initial)(2)&emsp;<span style="color:red;">This crime report is written under duress.</span> So far, I have received multiple serious threats, thereby constituting the crime of witness tampering as defined under Title 18, Section 1512 of the U.S. Code. Whether death threats were hinted at, potentially targeting me and/or my family members, remains to be clarified.

  (version#initial)(3)&emsp;I have been informally, and therefore illegally, gag ordered. As a result, and for reasons I won't and/or can't detail now—due to the gag order—I firmly believe, beyond a reasonable doubt, that the U.S. Department of Justice knew or ought to have known since the summer/fall of 2019 that McDonald’s Corporation and its accomplices have been engaging in criminal activities.

  (version#initial)(4)&emsp;I have notified the European Court of Human Rights and requested interim measures (Rule 39 of the Court) in the case V.L.C. v. France 50552/22. Due to the <em>extreme sensitivity</em> of some information related to the McDonald's case, the Court's records have been sealed. However, given the grave nature of the ongoing white-collar, criminally organized financial crimes, and in the interest of public awareness, I have decided to start publishing selected documents online around April 24, 2024. These documents are carefully redacted to protect sensitive information while informing the public.

  (version#initial)(5)&emsp;I also started notifying two United States Senators: [Mitt Romney](https://www.usa-v-mcdonalds.org/open-letters/formal-notice-sent-to-senator-mitt-romney-2024-03-08/)[^TLDR-1-open-letter-Romney] and [Chuck Grassley](https://www.usa-v-mcdonalds.org/open-letters/formal-notice-sent-to-senator-chuck-grassley-2024-03-08/)[^TLDR-2-open-letter-Grassley].

  (version#initial)(6)&emsp;Some of the crimes committed by McDonald’s Corporation and its accomplices include mass-marketing frauds, money laundering, corruption of foreign officials, corruption and/or corruption attempt of American law enforcement officers, and violations of securities laws stemming from their ongoing failures to disclose significant legal challenges that have jeopardized the company's survival. <span style="color:red;">If the rule of law is upheld, McDonald’s Corporation is currently, for all intents and purposes, virtually bankrupt.</span>

  (version#initial)(7)&emsp;There are billions of fraudulent transactions spanning multiple countries. It’s global case.

  (version#initial)(8)&emsp;Here is one, and only one, example of the many frauds which were committed: in the United States, McDonald's Corporation and its thousands of accomplices, which include among other persons, the franchisees, defrauded consumers, the victims, who include millions of innocent child-victims, by falsely claiming that they had a per attempt probability, in which 1 attempt was 1 game stamp, of 1 in 4 chance to win instantly. <span style="font-weight:bold;text-decoration:underline">It was a vicious lie and a vicious fraud: this wasn't the probability of winning instantly per attempt.</span> <span style="color:red;"><span style="font-weight:bold;">It was, in reality, the result of the sum of</span> what we call in probability theory <span style="font-weight:bold;">the probability mass function (PMF) of the hypergeometric distribution for obtaining at least \\(k\\) successes, summing from \\(i=k\\) to the minimum of \\(n\\) and \\(K\\), each term calculating the probability of exactly \\(i\\) successes in a sample of size \\(n\\) from a population of \\(N\\) with \\(K\\) successes</span> and represented by the following expression:</span>

  $$P_{N, K, n}(X \geq k) = \sum_{i=k}^{\min(n, K)} \frac{{\binom{K}{i} \cdot \binom{N-K}{n-i}}}{{\binom{N}{n}}}$$

  (version#initial)(9)&emsp;<span style="color:red;">McDonald’s Corporation</span> and their accomplices <span style="color:red;">lied</span> when they <span style="color:red;">fraudulently claimed</span> consumers had “1 in 4” chances of winning instantly. <span style="color:green;">The real probability of winning was in fact “1 in 8.”</span> Please keep in mind that this is only one of their <span style="text-decoration:underline;font-style:italic;">many frauds</span>.

  (version#initial)(10)&emsp;<span style="color:red;font-weight:bold;">If the <span style="text-decoration:underline;font-style:italic;">real probability per attempt</span> is approximately 2.84% of chance of winning</span>, with 10 attempts, you end up having approximately 1 in 4 chance to win instantly:

  $$P_{10,\frac{2.84}{100}}(X \geq 1) \approx \frac{1}{4}$$

  (version#initial)(11)&emsp;<span style="color:red;">It’s like saying:<br>First part: “You attempt 1 time […]”<br>Second part: “[…] 10 attempts with a 2.84% of chance of success per attempt […]”<br>Third part: “[…] and the probability of a success is about 25%, or 1 in 4.”<br>But McDonald’s fraudulently omits the second part: “[…] 10 attempts with a 2.84% of chance of success per attempt […]” and as a result, they end up making the following fraudulent, by omission, statement:</span> “You attempt 1 time and the probability of a success is about 25%, or 1 in 4.”

  (version#initial)(12)&emsp;McDonald’s fraudulently claimed that it’s the result of a probability, while it was in reality the probability mass function (PMF) of the hypergeometric distribution for obtaining at least \\(k\\) successes, summing from \\(i=k\\) to the minimum of \\(n\\) and \\(K\\), each term calculating the probability of exactly \\(i\\) successes in a sample of size \\(n\\) from a population of \\(N\\) with \\(K\\) successes. Furthermore, by never telling all the parameters to the consumers, it was impossible for them to just guess.

  (version#initial)(13)&emsp;<span style="font-weight:bold;">Important note:</span> please remember that it's the probability mass function of the hypergeometric distortion and not the binomial distribution <span style="font-weight:bold;text-decoration:underline">but that I am displaying, however, the binomial distribution formula</span> because it's close enough, to demonstrate this fraud, and it can help the reader visualize the Machiavellian fraud committed by McDonald’s Corporation and their accomplices. Let me give you other examples:

  (version#initial)(14)&emsp;<span style="color:red;font-weight:bold;">If the <span style="text-decoration:underline;font-style:italic;">real probability per attempt</span> is 1 in 200, or 0.5% (half a percent) of chance of winning</span>, with 57 attempts, you end up having 1 in 4 chance to win instantly:

  $$P_{57,\frac{1}{200}}(X \geq 1) \approx \frac{1}{4}$$

  (version#initial)(15)&emsp;<span style="color:red;font-weight:bold;">If the <span style="text-decoration:underline;font-style:italic;">real probability per attempt</span> is 1 in 500</span>, with 144 attempts, you end up having approximately 1 in 4 chance to win instantly:

  $$P_{144,\frac{1}{500}}(X \geq 1) \approx \frac{1}{4}$$

  (version#initial)(16)&emsp;<span style="color:red;font-weight:bold;">If the <span style="text-decoration:underline;font-style:italic;">real probability per attempt</span> is 1 in a million (1,000,000)</span>, with 287,682 attempts, you end up having 1 in 4 chance to win instantly:

  $$P_{287682,\frac{1}{1000000}}(X \geq 1) \approx \frac{1}{4}$$

  (version#initial)(17)&emsp;<span style="color:red;">McDonald’s Corporation</span> and their accomplices <span style="color:red;">lied</span> when they <span style="color:red;">fraudulently claimed</span> consumers had “1 in 4” chances of winning instantly. <span style="color:green;">The real probability of winning was in fact “1 in 8.”</span> Please keep in mind that this is only one of their <span style="text-decoration:underline;font-style:italic;">many frauds</span>.

  (version#initial)(18)&emsp;The real probability of winning, <span style="color:green;">“1 in 8,” was never told to consumers, the victims</span>. The number “1 in 4” is, in <span style="font-weight:bold;">fact</span>, the result of a complex calculation driven from a binomial distribution function. It’s the result <span style="text-decoration:underline">if, and only if,</span> the consumers (the victims) were to attempt their chances <span style="text-decoration:underline">multiple times</span>.

  (version#initial)(19)&emsp;But consumers (the victims, including millions of child-victims), <span style="font-weight:bold;font-style:italic;">couldn’t</span> have easily guessed since <span style="color:red;">the criminal entity McDonald’s Corporation</span>, and their accomplices, among other persons, the franchisees, fraudulently claimed, with emphasis in upper case and bold characters that more attempts, i.e. purchases, wouldn’t increase the chances of winning.

  (version#initial)(20)&emsp;Here is an example and <span style="font-weight:bold;">a fact</span>: if the real probability of winning is 1 in a million (1,000,000) <span style="font-style:italic;">per attempt</span>, the probability of winning after 287,682 attempts is “1 in 4.”

  (version#initial)(21)&emsp;Fact and yet another example: if the real probability of winning is “1 in 500” <span style="font-style:italic;">per attempt</span>, the probability of winning after 144 attempts is “1 in 4.”

  (version#initial)(22)&emsp;McDonald’s could have made up almost any numbers using such fraudulent methods.

  (version#initial)(23)&emsp;I received <span style="text-decoration:underline;font-style:italic;">a kind of</span> <span style="font-weight:bold;">gag order, and I am <span style="font-style:italic;">potentially</span> (not sure) currently being blackmailed</span>. As a result, I can’t discuss certain aspects of this case publicly any longer.

  (version#initial)(24)&emsp;I want to trust the FBI and the DOJ 100%. But there will be lots of pressure on Washington D.C.: many financial institutions, financing, through stock ownership, the criminal entity McDonald’s Corporation, are bound to lose a lot of money if it goes bankrupt. Yet, the law is the law and McDonald’s Corporation and its accomplices are not above the law.

  (version#initial)(25)&emsp;However <span style="color:green;">local officials at municipal, county, and state level</span>, don’t need to wait for the green light from Washington D.C. and <span style="color:green;">can start prosecuting</span> McDonald’s Corporation and their accomplices, that is, among other persons, the franchisees, <span style="color:green;">right now</span>.

  (version#initial)(26)&emsp;<span style="font-weight:bold;">These predators</span> made tens of millions of victims in the United States alone, <span style="font-weight:bold;">including millions of child-victims</span>. Among the victims are not only consumers but other businesses who can’t possibly compete fairly with a criminal organization which has engaged in a pattern of racketeering activity (RICO) through frauds and money laundering.

  (version#initial)(27)&emsp;Criminal activity is continuous and has not concluded.

  (version#initial)(28)&emsp;If you don’t understand, I am here to help. Email me at [vincent@ecthrwatch.org](vincent@ecthrwatch.org)

