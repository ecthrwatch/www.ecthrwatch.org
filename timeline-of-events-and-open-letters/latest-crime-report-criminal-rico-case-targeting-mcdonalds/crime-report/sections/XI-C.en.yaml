title: (XI)(C) McDonald's Corporation, an Anti-American Company, a Wolf in Sheep's Clothing, the Work of the Devil
anchor_id: mcdonalds-anti-american-wolf-in-sheeps-clothing
raw_header: '### (XI)(C) McDonald''s Corporation, an Anti-American Company, a Wolf in Sheep''s Clothing, the Work of the Devil {id="mcdonalds-anti-american-wolf-in-sheeps-clothing"}'
content: |-
  (version#initial)(1097)&emsp;NOTE: I want to insert a small interlude within this crime report to tell you about how I personally feel about this transnational criminal entity: McDonald's Corporation.

  (version#initial)(1098)&emsp;NOTE: I always admired the United States of America and what it stood for.

  (version#initial)(1099)&emsp;NOTE: Talk about rights to free expression. Talk about integrity.

  (version#initial)(1100)&emsp;NOTE: But McDonald's Corporation doesn't reflect, or at the very least doesn't reflect any longer, these values of what America stands for. I feel it's one of the most anti-American company I've ever seen. A wolf in sheep's clothing. Truly I tell you, the work of the devil!

  (version#initial)(1101)&emsp;=========================

  (version#initial)(1102)&emsp;"If you are saying something that is an extraordinary story, it requires extraordinary proofs, but people won't believe you unless they see the proofs, and people won't have time to see the proofs if it's a complex story."

