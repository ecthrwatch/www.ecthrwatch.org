raw_header: '### (V)(J) Immediately Initiate Asset Forfeiture Measures Against the Attorneys of this Criminal RICO Enterprise (SECTION FORMERLY CALLED (V)(Uncategorized-2)) {id="initiate-asset-forfeiture-measures-against-the-attorneys-of-this-criminal-rico-enterprise"}'
content: |-
  (version#initial)(782)&emsp;Before delving into the asset forfeiture measures against McDonald's Corporation, it is essential to address the forfeiture of attorneys' fees. Considering the gravity of the allegations, agencies such as the FBI, DOJ, SEC, IRS, and Homeland Security must scrutinize whether attorneys' fees paid by McDonald's Corporation stem from the proceeds of their alleged criminal activities.

  (version#initial)(783)&emsp;According to legal precedents and discussions within the legal community, particularly those highlighted in the American Bar Association's publications, the forfeiture of attorneys' fees should be pursued only if it is clear that the attorneys knew the fees were the proceeds of criminal activities. Excluding attorneys' fees from forfeiture aligns with preserving defendants' constitutional rights, thus maintaining the statutory goal of combating organized crime without undermining the right to a fair trial.

  (version#initial)(784)&emsp;However, it is also argued that allowing defendants to use illicitly obtained funds to pay for defense contradicts the intent of the RICO statutes and potentially violates victims' rights. As noted in legal analyses, using stolen funds for defense is akin to a bank robbery suspect using stolen money to hire legal representation, which courts have ruled as impermissible:

  (version#initial)(785)&emsp;"[…] The Supreme Court then provided a concrete example of this concept: '[a] robbery suspect . . . has no Sixth Amendment right to use funds he has stolen from a bank to retain an attorney to defend him if he is apprehended,' and no lawyer has the right to accept stolen property or ransom money in payment of a fee—'the privilege to practice law is not a license to steal.' Id. […]"

  (version#initial)(786)&emsp;This situation is analogous to the principle upheld by the Supreme Court: no individual has the right to use stolen funds for defense purposes, as this would contravene the fundamental legal principles of justice and equity. The same should apply to McDonald's Corporation; if it is established that their legal fees were financed through criminal activities, these fees should be subject to forfeiture.

  (version#initial)(787)&emsp;Ensuring fair legal representation for McDonald's, if their assets are frozen or forfeited, means they might have to rely on public defenders or court-appointed attorneys. This transition is crucial to maintaining the integrity of the legal process while ensuring that illegally obtained funds are not used to influence the outcome of judicial proceedings.

  (version#initial)(788)&emsp;By addressing the potential forfeiture of attorneys' fees early in the proceedings, the involved legal and government agencies can safeguard the legal process and ensure that all parties retain their constitutional rights without enabling further misuse of stolen assets.

  (version#initial)(789)&emsp;================

  (version#initial)(790)&emsp;Draft: before I mention asset forfeiture of McDonald's Corporation, I believe it's important to first discuss the asset forfeiture of attorney's fees. The FBI/DOJ/SEC/IRS/Homeland Security will make their life infinitely easier once McDonald's Corporation gets a public defender.

  (version#initial)(791)&emsp;"This morning, I was thinking about the FBI crime report I want to submit to tips.fbi.gov to make sure they fully understand the scope of the criminal RICO case targeting McDonald's Corporation and I often wondered about lawyers fees, what if the fees comes from a RICO enterprise. I had read this before:

  (version#initial)(792)&emsp;https://www.ojp.gov/ncjrs/virtual-library/abstracts/against-forfeiture-attorneys-fees-under-rico-racketeer-influenced

  (version#initial)(793)&emsp;"The conflict among various courts' interpretations of the provisions are examined, and it is argued that attorney's fees should not be forfeitable unless the attorney knew them to be the fruit of crime."

  (version#initial)(794)&emsp;"Exclusion of attorney's fees from forfeiture would achieve the statutory purpose of combating organized crime while preserving defendants' constitutional rights."

  (version#initial)(795)&emsp;=> non-exclusion would also violate article 6 of the ECHR equality of arms. The rights of the victims should also be preserved. For the sake of clarity, imagine plaintiff A got defrauded by defendant B. Defendant B stole 100% of plaintiff A assets through a RICO enterprise. Should defendant B allowed to use the money he stole to defend himself against its victim who can't afford legal representation any longer because he was the victim of a RICO enterprise?

  (version#initial)(796)&emsp;"It is argued that forfeiture of attorney's fees interferes with the right to fair trial by stripping defendants of the competent counsel they could otherwise afford." => they (McDonald's) couldn't have afforded Big Law law firms like Allen & Overy hadn't they kept engaging in a criminal enterprise. Furthermore, they can get a free lawyer designated by the state/court lawyer like other criminals who can't afford a lawyer.

  (version#initial)(797)&emsp;Then, I found this document which I haven't finished reading:

  (version#initial)(798)&emsp;https://www.americanbar.org/groups/criminal_justice/publications/criminal-justice-magazine/2023/spring/potential-forfeiture-attorneys-fees-minefield-defense-attorneys/

  (version#initial)(799)&emsp;"[…] The [Supreme?] Court then provided a concrete example of this concept: "[a] robbery suspect . . . has no Sixth Amendment right to use funds he has stolen from a bank to retain an attorney to defend him if he is apprehended," and no lawyer has the right to accept stolen property or ransom money in payment of a fee—"the privilege to practice law is not a license to steal." Id. […]"

  (version#initial)(800)&emsp;Perfect, it's exactly the point I wanted to make! 😳" // end of messages sent to Dr. Lehman.

