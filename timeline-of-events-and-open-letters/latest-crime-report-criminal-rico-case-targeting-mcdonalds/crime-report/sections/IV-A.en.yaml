id: IV-A
level: 3
title: (IV)(A) Quick Introduction about this non-exhaustive list and why the criminal activity, the RICO pattern of racketeering activity as defined under 18 U.S.C. § 1961(5), is continuous and has not concluded
anchor_id: quick-introduction-non-exhaustive-list-rico-pattern
raw_header: '### (IV)(A) Quick Introduction about this non-exhaustive list and why the criminal activity, the RICO pattern of racketeering activity as defined under 18 U.S.C. § 1961(5), is continuous and has not concluded {id="quick-introduction-non-exhaustive-list-rico-pattern"}'
content: |-
  (version#initial)(260)&emsp;This non-exhaustive list of crimes committed by McDonald's Corporation, among other persons, is not necessarily in chronological orders. There are crimes which were committed by McDonald's Corporation. There are crimes committed by its subsidiary companies. Some of the crimes can be proven not only beyond a reasonable doubt but beyond a shadow of a doubt: that is with a 100% certainty rate. Other crimes, I believe, are proven beyond a reasonable doubt and it's up to the relevant authorities to investigate to cement an indictment.

  (version#initial)(261)&emsp;Some of the most important crimes can already be proven beyond a shadow of a doubt and these crimes are enough to bankrupt McDonald's Corporation. But it shouldn't be a reason for American law enforcement authorities at State level or District level, and/or for foreign law enforcement authorities, to relax.

  (version#initial)(262)&emsp;Indeed, other alleged crimes which I am not sure yet it reaches the threshold for State Attorneys General and District Attorneys General and or Public Prosecutors in other countries to obtain a conviction must still be investigated, especially the alleged crimes committed by the franchisees directly since the franchisees at local level are the ones who ultimately are in contact with the consumers, the victims.

  (version#initial)(263)&emsp;There are times when a single fraudulent sweepstakes contain multiple distinct fraudulent elements.

