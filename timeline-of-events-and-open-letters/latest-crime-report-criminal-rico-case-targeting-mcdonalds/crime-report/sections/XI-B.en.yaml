id: XI-B
level: 3
title: (XI)(B) Witness Tampering
anchor_id: witness-tampering
raw_header: '### (XI)(B) Witness Tampering {id="witness-tampering"}'
content: |-
  (version#initial)(1085)&emsp;Witness tampering is a criminal offense that involves attempting to alter, influence, intimidate, or otherwise obstruct the testimony of a witness in a criminal or civil proceeding. The legal definition and the specifics of the offense, including the article or section number, can vary by jurisdiction, including differences between countries and, within the United States, between federal and state law.

  (version#initial)(1086)&emsp;Under U.S. Federal Law:

  (version#initial)(1087)&emsp;Under federal law, witness tampering is addressed in 18 U.S. Code § 1512 - Tampering with a witness, victim, or an informant. The statute makes it illegal to knowingly use intimidation, threats, physical force, or to corruptly persuade another person, or attempt to do so, with the intent to:

  (version#initial)(1088)&emsp;Influence, delay, or prevent the testimony of any person in an official proceeding;

  (version#initial)(1089)&emsp;Cause or induce any person to withhold testimony, or withhold a record, document, or other object, from an official proceeding;

  (version#initial)(1090)&emsp;Evade legal process summoning that person to appear as a witness, or to produce a document in an official proceeding; or

  (version#initial)(1091)&emsp;Be absent from an official proceeding to which such person has been summoned by legal process.

  (version#initial)(1092)&emsp;The law also addresses harassment of a witness, victim, or an informant, and spells out penalties for anyone found guilty of such offenses, which can include fines, imprisonment, or both, depending on the severity of the conduct and the outcome of the tampering (such as whether it resulted in bodily injury or death).

  (version#initial)(1093)&emsp;State Laws:

  (version#initial)(1094)&emsp;At the state level, witness tampering is also a criminal offense, but the specifics of the law, including the definition, penalties, and the relevant statute or article number, can vary widely from one state to another. State laws generally parallel federal law in prohibiting actions intended to influence, intimidate, or obstruct the testimony of witnesses but may include different or additional provisions.

  (version#initial)(1095)&emsp;Legal Implications:

  (version#initial)(1096)&emsp;Witness tampering is considered a serious offense because it threatens the integrity of the judicial process by preventing the court from receiving complete and truthful evidence. The penalties for witness tampering can be severe, reflecting the importance of protecting witnesses and ensuring that justice can be served. Due to the variability in laws, anyone facing or curious about specific aspects of witness tampering should consult legal texts or seek legal advice within their jurisdiction for the most accurate and relevant information.

