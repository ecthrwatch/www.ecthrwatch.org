raw_header: '### (VIII)(D) McDonald''s Corporation, Their Subsidiary Companies, Their Respective Executives, Their Lawyers, All Knew They Were Committing Massive Mass-Marketing Frauds and Money Laundering. Even Some Employees Knew! {id="mcdonalds-executives-knew-about-frauds"}'
content: |-
  (version#initial)(878)&emsp;A critical facet of this multifaceted case hinges on the incontrovertible evidence pointing to the acute awareness of numerous executives across McDonald's Corporation, McDonald's Europe, and McDonald's France concerning the crimes the company had been embroiled in.

  (version#initial)(879)&emsp;Notably, many of these infractions can be substantiated with unwavering certitude. However, what sets this situation apart is the transparent nature of these malfeasances. Once highlighted, their egregiousness became palpable even to those without a legal background.

  (version#initial)(880)&emsp;An instance that stands out is that of an employee who, despite their lack of formal legal training, readily grasped the gravity of the malpractices. Similarly, certain fraudulent activities were so overt that the very notion of claiming criminal negligence or feigned ignorance becomes untenable. In this context, plausible deniability is rendered non-existent.

  (version#initial)(881)&emsp;Executives, including Gloria Santona and Malcolm Hicks, while initially attempting to deflect blame onto McDonald's France, could not remain oblivious once the full scope of the violations was unveiled. It became their moral and legal duty to intervene and cease any ongoing deceptive practices immediately—a step that was, as attested by former CEO Jean-Pierre Petit in his writings, entirely feasible.

  (version#initial)(882)&emsp;Their prolonged inaction, coupled with their eventual involvement, implies a deeper comprehension of the ramifications, including the inevitable descent into money laundering. This perception is further underscored by instances where Ms. Santona seemingly chose to distance herself from the ongoing schemes, even if it meant contravening U.S. regulations in 2016. Her possible involvement in insider trading, which I believe was reported in my 2015 submission to the Office of the Whistleblower of the U.S. Securities and Exchange Commission (if my memory serves me correctly), further complicates the picture.

  (version#initial)(883)&emsp;

  (version#initial)(884)&emsp;It's also concerning that several of the executives, once privy to these illicit activities and in positions of influence to effect change, remain entwined with McDonald's to this day. Figures like Malcolm Hicks, Jean-Noël Penichon (who may have faced a defamation lawsuit), and Christophe Chaps—who recently sought to influence my LinkedIn testimony—cast shadows over the integrity of the corporation's leadership.

  (version#initial)(885)&emsp;

  (version#initial)(886)&emsp;The epicenter of this vast web of white-collar malfeasance is unmistakably McDonald's Corporation. They are the architects behind this sprawling criminal enterprise, leading what could be one of the most potent white-collar crime syndicates in history. Yet, the repercussions of their actions, if the rule of law is duly honored, could lead to their financial ruin.

  (version#initial)(887)&emsp;

  (version#initial)(888)&emsp;In the ensuing section, we shall delve into a comprehensive evaluation of the potential financial liabilities McDonald's Corporation might be encumbered with—debts owed to national treasuries where their deceptions occurred, reparations to defrauded victims, and compensations to rival businesses that bore the brunt of their unscrupulous practices.

