id: VIII-M
level: 3
title: (VIII)(M) Concerns for the Internal Revenue Service (IRS)
anchor_id: concerns-for-irs
raw_header: '### (VIII)(M) Concerns for the Internal Revenue Service (IRS) {id="concerns-for-irs"}'
content: |-
  (version#initial)(978)&emsp;The primary focus of this report is to shed light on and substantiate the allegations of mass-marketing frauds and the subsequent money laundering operations by McDonald's Corporation. These operations have been identified in both domestic and international markets. Notably, the funds from these activities have found their way into the financial system, and by extension, to shareholders, given that McDonald's Corporation is publicly traded on the New York Stock Exchange.

  (version#initial)(979)&emsp;1. Provenance of Funds:

  (version#initial)(980)&emsp;The legitimacy of the proceeds from McDonald's Corporation's activities has been called into question. Although the principle of "innocent until proven guilty" stands in the U.S., the proofs presented in this report are so compelling that they go beyond the traditional "beyond a reasonable doubt" standard to "beyond a shadow of a doubt." This casts serious suspicions over the origin, movement, and utilization of these funds.

  (version#initial)(981)&emsp;2. Repatriation and Deferral of Foreign Income:

  (version#initial)(982)&emsp;a. Pre-TCJA Regulations:

  (version#initial)(983)&emsp;Prior to the enactment of the Tax Cuts and Jobs Act (TCJA) of 2017, corporations had the leeway to defer foreign income, presumably earned through legal means. However, the underlying question here is: Were the deferrals made by McDonald's Corporation a bona fide business decision or a strategy to avoid U.S. scrutiny, especially considering the possibly illicit nature of these funds?

  (version#initial)(984)&emsp;b. Post-TCJA Regulations:

  (version#initial)(985)&emsp;With the TCJA of 2017, there were significant changes in how U.S. corporations are taxed on their foreign income. The IRS should assess McDonald's Corporation's actions in light of these changes and whether any maneuvers post-TCJA could be seen as tactics to further obscure the movement of potentially illicit funds.

  (version#initial)(986)&emsp;3. U.S. Anti-Money Laundering Laws and Regulations:

  (version#initial)(987)&emsp;While it remains uncertain whether McDonald's Corporation chose to repatriate these questionable funds, it's undeniable that a significant portion of their income has been tainted due to the fungibility of money. Once illicit income, derived from criminal activities, merges into the corporation's financial pool, it contaminates the entire pool, making it virtually impossible to distinguish between legitimate and illegitimate sources. This fungibility might have facilitated the corporation's attempts to bypass anti-money laundering regulations.

  (version#initial)(988)&emsp;4. Implications for Tax Evasion:

  (version#initial)(989)&emsp;If funds obtained through dubious means were concealed or misrepresented, this could signify tax evasion. By deferring illicit income, there is a looming question of whether McDonald's Corporation may have underreported or misrepresented their taxable income to the IRS or to tax authorities of other countries.

  (version#initial)(990)&emsp;5. Conclusion for the IRS:

  (version#initial)(991)&emsp;Legal tax planning is one thing; however, the evasion of tax and legal responsibilities, especially when intertwined with criminal undertakings, is entirely different. Given the overwhelming evidence of fraudulent activities and the subsequent implications of money laundering, the IRS is strongly encouraged to deeply probe the financial movements, deferrals, and reporting practices of McDonald's Corporation. Their potential infractions are not just limited to tax evasion but extend to larger issues of financial fraud and corporate malfeasance.

  (version#initial)(992)&emsp;Given the severe nature of the allegations and the strength of evidence provided, a coordinated, rigorous investigation by the IRS, in tandem with other regulatory bodies, is both imperative and urgent.

  (version#initial)(993)&emsp;=> DRAFT NOTE IRS FORM 8300 https://www.irs.gov/pub/irs-pdf/f8300.pdf

