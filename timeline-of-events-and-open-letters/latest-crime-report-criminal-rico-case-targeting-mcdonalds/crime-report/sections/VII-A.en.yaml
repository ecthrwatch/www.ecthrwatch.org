title: (VII)(A) Understanding Some Key Legal Concepts in France and Europe
anchor_id: understanding-key-legal-concepts-france-europe
raw_header: '### (VII)(A) Understanding Some Key Legal Concepts in France and Europe {id="understanding-key-legal-concepts-france-europe"}'
content: |-
  (version#initial)(843)&emsp;In order to fully comprehend the allegations previously detailed, as well as the subsequent points that will be made, it's essential to grasp certain distinct legal concepts applicable in France and Europe. These concepts set the backdrop against which certain commercial actions, like those of McDonald's, must be viewed and evaluated.

  (version#initial)(844)&emsp;1. "While Supplies Last" is Not Valid in France

  (version#initial)(845)&emsp;In the United States and several other countries, promotions often come with the caveat "while supplies last." However, in France, this principle holds no water. Retailers, especially those launching commercial campaigns offering products at discounted rates, are legally mandated to ensure sufficient stock to meet expected demand.

  (version#initial)(846)&emsp;Illustrative Example: Suppose a supermarket advertises a week-long 50% discount on Champagne brand A, reducing its price from $50 to $25 per bottle. They are obligated to ensure stock availability for the entire duration of the sale. If they exhaust their stock before the sale ends, they must provide an equivalent quality product at the discounted price—even if the replacement is of a higher original value. Thus, a Champagne brand B, normally priced at $60, may have to be offered for $25. However, a cheaper alternative, originally priced at $40, cannot be provided at the $25 sale price. This principle stems from a commitment to fair trade practices and ensures that consumers always get what they're promised.

  (version#initial)(847)&emsp;2. Fine Print Cannot Counteract the Main Message

  (version#initial)(848)&emsp;France takes a firm stance against deceptive marketing. If a brand, for example, advertises "1 in 4 chances to win instantly" but later in the fine print states, "Just kidding! It's actually 1 in 8", such contradictory messages are not just viewed with skepticism—they're considered fraudulent.

  (version#initial)(849)&emsp;The EU's COUNCIL DIRECTIVE 93/13/EEC of 5 April 1993 reinforces this sentiment, clearly stating that any contractual terms must be in plain, intelligible language. Any ambiguity or contradiction is always resolved in favor of the consumer. The directive states: "Where there is doubt about the meaning of a term, the interpretation most favorable to the consumer shall prevail." (I emphasize)

  (version#initial)(850)&emsp;This concept isn't exclusive to Europe. Countries such as Canada, Australia, and New Zealand also uphold the principle that fine print cannot negate or contradict the main promotional message. It's a global recognition that consumers deserve clarity, and hidden terms or conditions that surprise and disadvantage them are unacceptable.

  (version#initial)(851)&emsp;3. The EU Directive 2005/29/CE

  (version#initial)(852)&emsp;The European Union's Directive 2005/29/CE of the European Parliament and of the Council, concerning unfair business-to-consumer commercial practices, is clear on one thing: misleading consumers is prohibited. The Directive makes it unlawful to give consumers a false impression about any primary product characteristics, the nature of the sales process, or the price. Clearly, the intent is to foster trust and transparency in commercial interactions.

  (version#initial)(853)&emsp;However, McDonald's seems to have taken their actions a step further. Instead of merely creating a false impression, they've actively and knowingly deceived consumers. This isn't just a violation of the Directive—It's outright fraud. It's also worth noting that this isn't an isolated incident affecting one European country; multiple nations across the continent have fallen prey to these tactics.

  (version#initial)(854)&emsp;I felt compelled to mention this Directive to McDonald's Corporation executives in 2015, warning them of the questionable practices of their European subsidiaries. At the time, my focus was primarily on Europe, and it wasn't until later that I came to understand that similar tactics were also in play in the United States.

  (version#initial)(855)&emsp;Conclusion: it's evident that European consumer protection laws, especially those in France, are robust and were crafted with the genuine interest of the consumer in mind. They prioritize transparency, fairness, and uphold the rights of consumers, ensuring that businesses cannot exploit or mislead them. Recall my earlier discussion referencing the works of Daniel Kahneman and the study by Furth-Matzkin and Sommers. Both these references underscore the global concern for protecting consumers from deceitful business practices, no matter how cleverly disguised. Whether in Europe, the US, or other parts of the world, such tactics merit serious scrutiny and accountability.

