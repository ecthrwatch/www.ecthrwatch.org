  #### (I)(E)(w) 2023: Contacted by a U.S. DOJ Employee With an Active Top Secret Clearance Regarding an S.E.C. FOIA/FOPA Request {id="2023-doj-employee-top-secret-clearance"}

  (version#initial)(157)&emsp;Text

  (version#initial)(158)&emsp;I have been made understood certain things in an informal, non-official way, things which could definitely be construed as a potential form of blackmail.

  (version#initial)(159)&emsp;For example, I was suggested to destroy all the evidence pertaining to this case including all of my hard drives and all of my hand-written notes, and that my life depended on it.

  (version#initial)(160)&emsp;Could this be construed as a death threat? I am not sure. I want to believe it's not. But since I had already been previously blackmailed and threaten before when I tried to alert relevant authorities, with one threat which has been put into execution, I believe I have the right to feel concerned.

  (version#initial)(161)&emsp;There are exceptionally disturbing elements in this criminal case targeting McDonald's Corporation and their accomplices.

  (version#initial)(162)&emsp;It's a fact that if the rule of law is upheld, McDonald's Corporation is currently virtually bankrupt. It's not an exaggeration: simply look at the corporation's book value and you will realize that it's negative. There will therefore be lots of pressure to try silence me.

  (version#initial)(163)&emsp;Based on some information which were communicated to me and which I am not at liberty to disclose, I currently believe, beyond a reasonable doubt, that the U.S. Department of Justice knew or ought to have known, since the summer/fall of 2019, that McDonald's Corporation was indeed engaging in serious criminal activities.

  (version#initial)(164)&emsp;Considering that the crimes committed by McDonald's Corporation and their accomplices are already exceptionally serious since they constitute a pattern of racketeering activity as defined under the Racketeer Influenced and Corrupt Organizations (RICO) Act, if on top of that, the U.S. government knew since 2019 and tried to cover it up, the scandal will be total!

  (version#initial)(165)&emsp;I currently believe, based on what I was made understood and that I can't, currently, and maybe never, disclose publicly, that there is a link between the U.S. government knowing since summer/fall 2019 and Steve Easterbrook's dismissal during that same period. I believe someone, within McDonald's Corporation, maybe the Chairman of the board, maybe someone else, was illegally tipped off and that it is the real reason why Steve Easterbrook was fired. They simply had to find a bogus, yet credible looking-like reason, to justify his removal, because he was too implicated.

  (version#initial)(166)&emsp;For the record, I am not saying that the official reason which was fed to the public is not true, I am simply stating that I currently believe, beyond a reasonable doubt, that it is true but that it is not the real reason behind his dismissal.

  (version#initial)(167)&emsp;I started requesting the assistance of Empower Oversight and I hope they, and/or other whistleblower associations, will be able to help me. I also started notifying two U.S. Senators, Chuck Grassley and Mitt Romney.

