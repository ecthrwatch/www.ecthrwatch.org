  #### (I)(E)(g) In 2015, I Started Alerting McDonald's Corporation Directly {id="2015-alerting-mcdonalds-corporation"}

  (version#initial)(126)&emsp;In 2015, I directly entered in contact with McDonald's Corporation to alert them that their subsidiary companies in Europe were engaging in criminal activities. McDonald's Corporation answered me via its then General Counsel, Gloria Santona, who acknowledged taking the inquiry seriously: they were therefore fully aware of the crimes which were taking place in Europe.

  (version#initial)(127)&emsp;Some of the highest-level executives within the headquarters, such as McDonald's Corporation CEO Steve Easterbrook and General Counsel Gloria Santona, were made aware of these concerns. In an email correspondence I received on October 21, 2015 at 23:47 +0800 (China Standard Time), Ms Santona stated, "Thanks for your follow-up note. Of course, we take such inquiries seriously. As this is a French matter, I have asked the French team to review the situation and respond to you once they have shared their findings with me." Former CEO of McDonald's Corporation, Steve Easterbrook, was also copied on this communication, indicating that he was informed of the matter.

  (version#initial)(128)&emsp;According to the RICO Act, Title 18 of the United States Code, Section 1961(5), a "pattern of racketeering activity" requires at least two acts of racketeering activity, one of which occurred after the effective date of this chapter and the last of which occurred within ten years after the commission of a prior act of racketeering activity.

  (version#initial)(129)&emsp;Section 1961(1) further defines "racketeering activity" to encompass a wide range of offenses, including but not limited to acts related to bribery, fraud, gambling, money laundering, obstruction of justice, and others.

  (version#initial)(130)&emsp;Considering the evidence at hand and the behaviors of the implicated parties, I believe that the actions of McDonald's Corporation and their accomplices align with the aforementioned definitions and requirements under the RICO Act.

  (version#initial)(131)&emsp;Indeed, given the knowledge of the highest level executives of McDonald's Corporation and McDonald's France, and their subsequent inaction, there are money laundering implications tied to the reported fraudulent activities. Based on the evidence and patterns of behavior observed, I believe that McDonald's Corporation keeps currently engaging in a pattern of racketeering activity, as defined in the Racketeer Influenced and Corrupt Organizations (RICO) Act.

  (version#initial)(132)&emsp;McDonald's Corporation has been stuck, since at least 2015, in a vicious circle from which they can never get out of. I will explain in further details later.

  (version#initial)(133)&emsp;I will also explain the pattern of racketeering activity later in this report. But the point I want to make is that starting in 2015, McDonald's Corporation couldn't reasonably ignore anymore their subsidiary companies were engaging in criminal activities.

  (version#initial)(134)&emsp;Once the apex company, McDonald's Corporation, supervising the global operations of their subsidiary companies became fully aware of these ongoing criminal activities, they should had stopped the then ongoing frauds immediately.

  (version#initial)(135)&emsp;McDonald's Corporation chose not to order their subsidiary companies to immediately cease their criminal activities. As a result, McDonald's Corporation has entered into a vicious circle from which it's now impossible to get out of: a pattern of racketeering activity as defined under the RICO act. If the rule of law is upheld, McDonald's Corporation is currently, for all intents and purposes, virtually bankrupt.

  (version#initial)(136)&emsp;This is a global case spanning multiple nations: almost the entire world has been affected by the pattern of racketeering activity McDonald's has engaged into. As I explain in the preamble of this crime report, even countries in which no mass-marketing frauds ever took place are affected by this criminal enterprise orchestrated by McDonald's Corporation.

