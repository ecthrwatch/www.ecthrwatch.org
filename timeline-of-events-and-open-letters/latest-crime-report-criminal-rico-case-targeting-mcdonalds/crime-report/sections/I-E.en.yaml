  #### (I)(E)(a) Introduction {id="timeline-introduction"}

  (version#initial)(89)&emsp;This section provides a brief explanation of some of the significant events related to the money laundering aspect of this case.

  (version#initial)(90)&emsp;The primary purpose of this non-exhaustive explanation is to offer a quick overview to help the reader understand the money laundering aspect of the case and why the executives of McDonald's France and McDonald's Europe, and more crucially, the executives of McDonald's Corporation were fully aware that they were committing the crime of money laundering.

  (version#initial)(91)&emsp;Regarding money laundering, the website of INTERPOL states: "Going back to the roots. The investigation of money laundering usually goes hand in hand with the investigation of the original crime generating the proceeds. Financial investigations aim to identify the origins, flows and whereabouts of illicit income and unmask the networks involved. Illegally acquired assets can then be frozen or confiscated and the perpetrators of both the original offences and the subsequent money laundering prosecuted."

  (version#initial)(92)&emsp;Only later in this crime report will I delve in greater detail into these original crimes generating the proceeds to reveal the depth and breadth of the criminal activities. For now, this brief, non-exhaustive, explanation, mainly serves to show the full implication of McDonald's Corporation in money laundering.

  [Return to the Table of Contents ↩︎](#table-of-contents)

  #### (I)(E)(b) 1987: The Downward Spiral Begins: The 1987 Monopoly Sweepstakes {id="1987-monopoly-sweepstakes"}

  (version#initial)(93)&emsp;McDonald's Corporation started heading down the wrong path at least since 1987 when they introduced the Monopoly sweepstakes. I believe that this sweepstakes, and I will explain in further detail later why, has always constituted a fraud because it fraudulently misrepresent the chances people have of winning.

  (version#initial)(94)&emsp;This McDonald's Monopoly sweepstakes vary from country to country in its content. But there are two main aspects which have been replicated across the world. The first one is the Collect-to-Win.

  (version#initial)(95)&emsp;Years after 1987, McDonald's would introduce another component/way of participating, to the McDonald's Monopoly. I am not sure exactly which year it started, but at some point in time, they would add the Instant-Win.

  (version#initial)(96)&emsp;

  (version#initial)(97)&emsp;In the Collect-to-Win part of the McDonald's Monopoly game, players collect game stamps attached to McDonald's products. Most of these game stamps represent Monopoly properties. To win a prize, participants must collect all the properties of the same color, mirroring the board game. However, not all pieces are equally obtainable; some properties are intentionally, and therefore fraudulently, made rarer than others. However, and as Pulitzer Prize winning journalist explained in an article he wrote about the Monopoly sweepstakes, the secret sauce–which I prefer to call fraudulent misrepresentation–is that participants believe that each property is equally likely to be found.

  (version#initial)(98)&emsp;From the outset, it marked the beginning of McDonald's descent into making easy money through questionable—actually illegal as I will detail later—marketing practices. By engaging in deceptive tactics to lure customers, McDonald's not only compromised its integrity but also began a pattern of behavior that would lead to significant legal repercussions.

  [Return to the Table of Contents ↩︎](#table-of-contents)

  #### (I)(E)(c) 2002: McDonald's Corporation v. Simon Marketing {id="2002-mcdonalds-v-simon-marketing"}

  (version#initial)(99)&emsp;The McDonald's Corporation v. Simon Marketing case in 2002 was a significant legal battle arising from a massive fraud scheme orchestrated by Jerome Jacobson, an ex-cop who worked for Simon Marketing, a supplier for McDonald's promotional games. Jacobson exploited his position to steal rare game pieces from the Monopoly game and distributed them to a network of accomplices who falsely claimed millions in prizes.

  (version#initial)(100)&emsp;However, I argue that Jerome Jacobson was nothing more than a thief, stealing from another thief which is McDonald's.

  (version#initial)(101)&emsp;The legal case of McDonald's Corporation v. Simon Marketing in 2002 serves as a pivotal moment in understanding the broader patterns of misconduct within McDonald's Corporation. This lawsuit arose from a massive fraud perpetrated by employees of Simon Marketing, the company that managed McDonald's promotional games, including the famous Monopoly game. The case not only highlighted significant vulnerabilities in McDonald's promotional practices but also shed light on the potential for internal and external collusion in defrauding customers.

  (version#initial)(102)&emsp;The significance of this case extends beyond the immediate legal repercussions; it provides critical insights into the corporate oversight and ethical controls—or lack thereof—within McDonald's operations. The lawsuit resulted in substantial financial settlements and should have served as a wake-up call for McDonald's regarding its contractual partnerships and operational security. Moreover, it opened public discourse on the need for corporations to enforce strict ethical standards and maintain rigorous oversight to prevent similar incidents.

  (version#initial)(103)&emsp;This case is crucial to our discussion because it exemplifies the types of vulnerabilities and ethical challenges that can pervade large corporations. It also sets a precedent for how such issues are handled legally and publicly, offering a foundational context for the ongoing scrutiny of McDonald's corporate practices in subsequent years.

  [Return to the Table of Contents ↩︎](#table-of-contents)

  #### (I)(E)(d) 2011: Beginning of My Discovery of the Crimes {id="2011-beginning-discovery-crimes"}

  (version#initial)(104)&emsp;I first started discovering some of the crimes that McDonald's has actually been committing for decades while I was living in France in 2011. And it would be in 2023, and shortly before I was gag ordered, that I started understanding that this ongoing/continuous criminal enterprise, criminal enterprise falling under the Racketeer Influenced and Corrupt Organizations (RICO) Act, criminal enterprise orchestrated by McDonald's Corporation, had started in 1987 if not earlier.

  (version#initial)(105)&emsp;In the executive summary of this crime report, I briefly detailed one of their many offenses—the "1 in 4" instant-win fraud, a mass-marketing fraudulent scheme. This fraudulent scheme also took place in France for the year of 2011. However, this was not the only fraud, in France, for that year.

  (version#initial)(106)&emsp;Notably, there also was the McDonald's Monopoly Collect-to-Win fraudulent scheme. For those unfamiliar with this operation—or more accurately, the outright fraud it constituted in France—here's how it functioned:

  (version#initial)(107)&emsp;In the Collect-to-Win part of the McDonald's Monopoly game, players collect game stamps attached to McDonald's products. Most of these game stamps represent Monopoly properties. To win a prize, participants must collect all the properties of the same color, mirroring the board game. However, not all pieces are equally obtainable; some properties are intentionally, and therefore fraudulently, made rarer than others. However, participants believe that each piece is equally likely to be found.

  (version#initial)(108)&emsp;In France, the transposition of European Union Directive 2005/29/EC, which targets unfair business-to-consumer commercial practices, firmly categorizes such deceptive practices as felonies, irrespective of what's disclosed in the official rules or even in the fine print. However, what's important to understand is that in France, McDonald's failed to indicate, not only in the fine print but even within the official rules, that some properties were made intentionally—and therefore fraudulent in a criminal sense—rare.

  (version#initial)(109)&emsp;But remember that what the European Union Directive 2005/29/EC means is that even if McDonald's had disclosed in the Monopoly game's rules, or the fine print, that some pieces were rarer than others—which, to be very clear, they did not—the mere attempt to skew the perception of winning chances would actually be considered a felony. The absence of this disclosure further underscores the deceptive nature of the promotion, aligning it squarely with practices that constitute downright fraud under French criminal law.

  (version#initial)(110)&emsp;Astoundingly, the 2011 campaign in France also stipulated that before claiming any prize, consumers were required to complete not just a single set but the entire board—a feat not documented in any participating country to my knowledge, further illustrating the scheme's fraudulent design.

  (version#initial)(111)&emsp;This level of fraudulent misrepresentation transcends mere oversight; it constitutes willful, calculated fraud. Fraud targeting children, among other vulnerable population.

  (version#initial)(112)&emsp;Approximately one month after my initial discovery in 2011, and following consultation with a lawyer, I began notifying McDonald's France about the fraudulent activities I had uncovered.

  (version#initial)(113)&emsp;Throughout the subsequent year, in 2012, I persisted in my efforts, escalating my concerns to include not only the local executives but also urging them to inform the higher echelons of the organization, including McDonald's Corporation in Chicago, its executive team, and the Board of Directors.

  (version#initial)(114)&emsp;Despite these efforts, McDonald's France and its accomplices continued their involvement in organized criminal activities.

  (version#initial)(115)&emsp;Over time, it became increasingly apparent that this pattern of misconduct was not isolated to France but was a widespread issue affecting numerous other countries globally.

