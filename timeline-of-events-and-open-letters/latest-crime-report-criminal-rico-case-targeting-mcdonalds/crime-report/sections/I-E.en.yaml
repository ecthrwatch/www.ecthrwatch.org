  #### (I)(E)(e) Key Legal Insights: the Implications for McDonald's Bankruptcy {id="key-legal-insights-mcdonalds-bankruptcy"}

  (version#initial)(116)&emsp;To fully comprehend the implications of the crimes which have been committed in Europe and the implications for the bankruptcy, then, of McDonald's France, and later of McDonald's Corporation, a quick explanation is in order.

  (version#initial)(117)&emsp;McDonald's France claimed an equal quantity of each property. However, they rigged the game to make it almost impossible for consumers to win via the collect-to-win fraudulent scheme.

  (version#initial)(118)&emsp;Therefore, by rigging the game, they deprived their own customers (more accurately their victims) of a fair and equal chance of winning.

  (version#initial)(119)&emsp;Since McDonald's France and its accomplices actually stated, through fraudulent misrepresentation, that all property game stamps were equally, and sequentially—I will get back on this part of sequential distribution later—, distributed, they engaged into a liability they can never honor.

  (version#initial)(120)&emsp;As a result, McDonald's France and its accomplices committed fraud and are under legal obligation to compensate the victims—their own customers—for the loss of chance of winning had the sweepstakes not been rigged. The total amount is, at most and theoretically, approximately up to 3,771,375,365,237.50 euros. Yes; over 3.7 trillion euros; you read correctly. And that's only for one of the frauds they committed in France for the year 2011.

  (version#initial)(121)&emsp;Given that McDonald's France is, directly or indirectly, a subsidiary company of McDonald's Corporation, and given that the stock market capitalization of McDonald's Corporation is currently about $192 billion (as of 2024-04-16), I believe it's fair to say that McDonald's France is virtually bankrupt since they can't possibly be valued more than McDonald's Corporation. And even the market capitalization of McDonald's Corporation wouldn't be enough to compensate the victims. Furthermore and as I will explain later, what actually matters is the book value of the company and not the market capitalization.

  (version#initial)(122)&emsp;The legal basis is identical to a case I would later find out about and which was part of an FBI nationwide operation called "Final Answer."

  (version#initial)(123)&emsp;Except that this time, the criminals are McDonald's France and its accomplices. McDonald's Corporation would later become an accessory after the fact and ultimately, I would realize that it's McDonald's Corporation who was actually condoning such organized criminal activities.

