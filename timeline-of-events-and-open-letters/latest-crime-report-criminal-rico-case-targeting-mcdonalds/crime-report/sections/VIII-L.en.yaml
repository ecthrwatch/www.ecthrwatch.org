id: VIII-L
level: 3
title: (VIII)(L) Concerns for the U.S. Securities and Exchange Commission
anchor_id: concerns-for-sec
raw_header: '### (VIII)(L) Concerns for the U.S. Securities and Exchange Commission {id="concerns-for-sec"}'
content: |-
  (version#initial)(959)&emsp;The U.S. Securities and Exchange Commission (SEC) has regulations that require public companies to disclose legal proceedings or other contingencies that might have a material impact on their financial position. This requirement is found in the Regulation S-K, specifically under Item 103 titled "Legal Proceedings."

  (version#initial)(960)&emsp;According to Item 103 of Regulation S-K:

  (version#initial)(961)&emsp;"The registrant shall describe briefly any material pending legal proceedings, other than ordinary routine litigation incidental to the business, to which the registrant or any of its subsidiaries is a party or of which any of their property is the subject."

  (version#initial)(962)&emsp;While the rule doesn't state a specific percentage threshold like 10%, the SEC provides some guidance. For instance, an instruction to Item 103 states:

  (version#initial)(963)&emsp;"No information need be given with respect to any proceeding that involves primarily a claim for damages if the amount involved, exclusive of interest and costs, does not exceed 10 percent of the current assets of the registrant and its subsidiaries on a consolidated basis."

  (version#initial)(964)&emsp;This suggests that legal actions involving amounts that exceed 10% of a company's current assets are deemed significant enough to require disclosure.

  (version#initial)(965)&emsp;However, it's essential to note that even if a legal action doesn't meet this specific threshold, companies still need to evaluate whether the lawsuit is "material" and therefore needs to be disclosed. The concept of materiality is broader than just this 10% threshold and involves a judgment about what a reasonable investor would consider important when making investment decisions.

  (version#initial)(966)&emsp;The specific disclosure requirements regarding legal proceedings for companies under the SEC's Regulation S-K, Item 103 ("Legal Proceedings") are described below:

  (version#initial)(967)&emsp;Description of the Proceedings: Companies must briefly describe any material pending legal proceedings to which they or their subsidiaries are a party, or of which any of their properties is the subject.

  (version#initial)(968)&emsp;Name of the Court or Agency: The disclosure must include the name of the court or agency in which the proceedings are pending.

  (version#initial)(969)&emsp;Date Instituted: The date on which the litigation was initiated should be mentioned.

  (version#initial)(970)&emsp;Principal Parties: The identities of the principal parties to the proceedings should be included.

  (version#initial)(971)&emsp;Factual Basis Alleged to Underlie the Litigation: A brief description of the factual basis alleged to underlie the litigation and the relief sought should be provided. This would include, for instance, any claims for damages or injunctive relief.

  (version#initial)(972)&emsp;Potential Impact: If it is possible to do so, the registrant should provide any material financial impact or potential exposure from the proceedings, though this can sometimes be challenging given the uncertainties of litigation.

  (version#initial)(973)&emsp;Management's Evaluation: If appropriate, the company can include management's evaluation of the likely outcome and potential impact, including any potential financial exposure or range of exposure.

  (version#initial)(974)&emsp;Environmental Proceedings: Special mention is made of certain types of legal proceedings arising under any federal, state, or local laws and regulations that regulate the discharge of materials into the environment or protect the environment. For these proceedings, if a governmental authority is a party and the potential monetary sanctions could exceed $100,000, specific disclosure might be required.

  (version#initial)(975)&emsp;Ordinary Routine Litigation: it's important to note that no disclosure is needed for "ordinary routine litigation incidental to the business."

  (version#initial)(976)&emsp;Proceedings Related to Matters of Financial Importance: As I mentioned earlier, no information might be needed for a proceeding that primarily involves a claim for damages if the amount, exclusive of interest and costs, doesn't exceed 10 percent of the current assets of the company and its subsidiaries on a consolidated basis. However, the concept of materiality can override this threshold.

  (version#initial)(977)&emsp;The above are general guidelines, and the specifics of disclosure can vary depending on the nature and complexity of the legal proceedings and the company's judgment about the materiality of the proceedings to investors.

