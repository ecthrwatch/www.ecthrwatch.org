  <style>
  /* Manual TOC (inline, page-local) */
  .manual-toc {
    margin: 1.25rem 0 1.5rem 0;
    padding: 1rem 1.25rem;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 12px;
  }
  
  /* Tight spacing + clean list appearance */
  .manual-toc ul {
    list-style: none;
    margin: 0.35rem 0;
    padding-left: 0;
  }
  
  .manual-toc li {
    margin: 0.18rem 0;
    line-height: 1.25;
  }
  
  /* Indentation by nesting level */
  .manual-toc ul ul { padding-left: 1.25rem; }
  .manual-toc ul ul ul { padding-left: 1.25rem; }
  
  /* Typography hierarchy */
  .manual-toc > ul > li > a {
    font-weight: 600;
  }
  
  .manual-toc ul ul > li > a {
    font-size: 0.94em;
    font-weight: 500;
  }
  
  .manual-toc ul ul ul > li > a {
    font-size: 0.90em;
    font-weight: 450;
  }
  
  /* Link styling */
  .manual-toc a {
    text-decoration: none;
  }
  
  .manual-toc a:hover {
    text-decoration: underline;
  }
  
  /* Double strikethrough for fake 'M' currency */
  .double-strike {
    text-decoration: line-through;
    text-decoration-style: double;
  }
  </style>
