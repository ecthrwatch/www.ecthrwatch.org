  (version#initial)(362)&emsp;One of the reasons I want to be extremely thorough is that I have myself been a victim of this criminal enterprise not only through their mass-marketing frauds but also through their obstruction of justice. Indeed, I’ve witnessed McDonald’s Corporation and their accomplices, like McDonald’s France and its franchisees, and one of their Big Law law firms, Allen & Overy, going as far as to lie in a court of law thus committing other serious crimes as obstruction of justice. It’s my God given duty to report such exceptionally serious crimes to the authorities and to make 100% sure that honest officials don’t get fouled by these criminals and answer for their serious crimes in a court of law.

  (version#initial)(363)&emsp;That's the reason, even though it might seem a bit repetitive for now, for full thoroughness, I'd like to guide you through another demonstration using, this time, binomial distributions.

  (version#initial)(364)&emsp;I am now going to very briefly introduce the concept of a binomial distribution. **Important:** please always remember that a binomial distribution <span style="text-decoration:underline;"><em>is not</em></span> the perfect formula to describe with <span style="text-decoration:underline;"><em>absolute perfection</em></span> what happened, for reasons I might explain later. But for now, simply accept it as true but with one condition: <span style="color:red;">if, and only if, the sample pool size is large enough.</span> The reason I will now use binomial distributions to explain is that by making two of the parameters showing explicitly, it will help you understand more easily the Machiavellian fraud that these white-collar criminals machinated.

  (version#initial)(365)&emsp;In a hypergeometric distribution, probabilities change after each draw/trial/attempt. This being said, if, and only if, the sample pool size is large enough, a binomial distribution can substituted to the probability mass function (PMF) of the hypergeometric distribution for obtaining at least \\(k\\) successes, summing from \\(i=k\\) to the minimum of \\(n\\) and \\(K\\), each term calculating the probability of exactly \\(i\\) successes in a sample of size \\(n\\) from a population of \\(N\\) with \\(K\\) successes. Again, I might explain later why.

  (version#initial)(366)&emsp;Therefore, and to make the demonstration easier to understand we can also say that the “1 in 4” result <span style="font-weight:bold;text-decoration:underline;">wasn't</span> the result of the probability to win <em><span style="font-weight:bold;text-decoration:underline;">but was, </span><span style="color:red;font-weight:bold;text-decoration:underline;">approximately,</span></em> the result of the sum of the probability mass function (PMF) of the binomial distribution (pay attention: this time, we are talking about the <span style="text-decoration:underline;">binomial distribution</span> and <em><span style="font-weight:bold;text-decoration:underline;">not</span></em> the hypergeometric distribution) for obtaining at least \\(k\\) successes, summing from \\(i=k\\) to \\(n\\), where each term within the sum calculates the probability of achieving exactly \\(i\\) successes in \\(n\\) trials.

  (version#initial)(367)&emsp;And so, the probability of at least \\(k\\) successes of a certain event happening would therefore be defined by the following expression:

  $$P_{n,p}(X \geq k) = \sum_{i=k}^{n} \binom{n}{i} p^i (1-p)^{n-i}$$

  (version#initial)(368)&emsp;The small letter \\(\_p\\) right at the beginning in the third position, in the subscript in \\(P_{n,p}\\) represents, in this formula, a Bernoulli trial. To explain briefly, let's simply say, for now, that this parameter is the probability per attempt, while the small letter \\(\_n\\) on its left side is the number of attempts. And so, the ruse of these fraudsters was to say, in essence, that a consumer, who would attempt this formula 1 time, would only then get about 1 in 4 chance to win instantly.

  (version#initial)(369)&emsp;And by choosing the right combination for the number of attempts \\(n\\) and for the probability \\(p\\), they could choose it in such a way that it would always end up approximately equaling a probability of 1 in 4 (or 25% of chance of winning instantly) even though the real probability could be 1 in a million (1 in 1,000,000, or 0.0001%). Here are a few concrete examples:

  (version#initial)(370)&emsp;If the real probability per attempt is approximately 2.84% of chance of winning, with 10 attempts, you end up having approximately 1 in 4 chance to win instantly:

  $$P_{10,\frac{2.84}{100}}(X \geq 1) \approx \frac{1}{4}$$

  (version#initial)(371)&emsp;<span style="color:red;">It’s like saying:</span><br>
  <span style="color:red;font-weight:bold;text-decoration:underline;">First part:</span> <span style="color:red;">“You attempt 1 time \[…\]”</span><br>
  <span style="color:red;font-weight:bold;text-decoration:underline;">Second part:</span> <span style="color:red;">“\[…\] 10 attempts with a 2.84% of chance of success per attempt […]”</span><br>
  <span style="color:red;font-weight:bold;text-decoration:underline;">Third part:</span> <span style="color:red;">“\[…\] and the probability of a success is about 25%, or 1 in 4.”</span><br>
  <span style="color:red;font-weight:bold;text-decoration:underline;"><em>But McDonald’s fraudulently omits the second part:</em></span> “\[…\] 10 attempts with a 2.84% of chance of success per attempt \[…\]” <em><span style="color:red;font-weight:bold;text-decoration:underline;">and as a result, they end up making the following fraudulent, by omission, statement: </span><span style="font-weight:bold;text-decoration:underline;">“You attempt 1 time and the probability of a success is about 25%, or 1 in 4.”</span></em>
  {#mcdonalds-usa-year-2011-instant-win-fraud-example-its-like-saying}

  (version#initial)(372)&emsp;McDonald’s fraudulently claimed that it’s the result of a probability, while it was in reality the result of the summation of the probability mass function (PMF) of the hypergeometric distribution for obtaining at least \\(k\\) successes, summing from \\(i=k\\) to the minimum of \\(n\\) and \\(K\\), each term calculating the probability of exactly \\(i\\) successes in a sample of size \\(n\\) from a population of \\(N\\) with \\(K\\) successes. Furthermore, by never disclosing in the fine print all the parameters to the consumers, it was mathematically impossible for them to just guess.

  (version#initial)(373)&emsp;**Important note:** please remember that it's the probability mass function of the hypergeometric distribution and not the binomial distribution <span style="font-weight:bold;text-decoration:underline;">but that I am however displaying, to help you understand this fraud, the binomial distribution formula</span> because it's close enough and it can help the reader visualize the Machiavellian fraud committed by McDonald’s Corporation and their accomplices. Let me give you other examples:

  (version#initial)(374)&emsp;<span style="color:red;font-weight:bold;">If the <span style="text-decoration:underline"><em>real probability per attempt</em></span> is “1 in 200” chance to win, or 0.5% (half a percent)</span>, with 57 attempts, you end up having 1 in 4 chance to win instantly:

  $$P_{57,\frac{1}{200}}(X \geq 1) \approx \frac{1}{4}$$

  (version#initial)(375)&emsp;<span style="color:red;font-weight:bold;">If the <span style="text-decoration:underline"><em>real probability per attempt</em></span> is “1 in 500” chance to win</span>, with 144 attempts, you end up having approximately 1 in 4 chance to win instantly:

  $$P_{144,\frac{1}{500}}(X \geq 1) \approx \frac{1}{4}$$

  (version#initial)(376)&emsp;<span style="color:red;font-weight:bold;">If the <span style="text-decoration:underline"><em>real probability per attempt</em></span> is “1 in 1,000,000” chance to win (one in a million)</span>, with 287,682 attempts, you end up having 1 in 4 chance to win instantly:

  $$P_{287682,\frac{1}{1000000}}(X \geq 1) \approx \frac{1}{4}$$

  (version#initial)(377)&emsp;To understand how people could be fooled is simple: it requires expert knowledge in the mathematical field of probability theory to fully fathom and understand perfectly this truly Machiavellian fraudulent scheme. Without expert knowledge and understanding, it’s hard, if not impossible, to understand what's happening.

  (version#initial)(378)&emsp;Furthermore, because McDonald's enjoys worldwide brand recognition, people don't even dare to question if it’s possible they would have committed such vicious crimes targeting even children. And for those who do question their frauds, as I did, they are met with harassment, blackmail, threats, and what I can only accurately describe as the crime of witness tampering as it clearly was, and as a matter of fact still currently is, the case for me.

  (version#initial)(379)&emsp;<span style="color:red;font-weight:bold;text-decoration:underline;">Always remember this truth, this fact:</span> in the United States, McDonald's Corporation and their thousands of accomplices, which include among other persons, the franchisees, fraudulently claimed to consumers, the victims, who include millions of innocent child-victims, that they had a per attempt probability, in which 1 attempt was 1 game stamp, of 1 in 4 chance to win instantly. <span style="font-weight:bold;text-decoration:underline;">It was a vicious lie and a vicious fraud: this <span style="color:red;font-weight:bold;text-decoration:underline;"><em>wasn't</em></span> the probability of winning instantly per attempt.</span> <span style="color:red;">It was, in reality,</span> <span style="color:red;font-weight:bold;text-decoration:underline;">the result of the sum of</span> <span style="color:red;">what we call in probability theory</span> <span style="color:red;font-weight:bold;text-decoration:underline;">the probability mass function (PMF) of the hypergeometric distribution for obtaining at least \\(k\\) successes, summing from \\(i=k\\) to the minimum of \\(n\\) and \\(K\\), each term calculating the probability of exactly \\(i\\) successes in a sample of size \\(n\\) from a population of \\(N\\) with \\(K\\) successes</span> <span style="color:red;">and represented by the following expression:</span>

  $$P_{N, K, n}(X \geq k) = \sum_{i=k}^{\min(n, K)} \frac{{\binom{K}{i} \cdot \binom{N-K}{n-i}}}{{\binom{N}{n}}}$$

  (version#initial)(380)&emsp;Numerous countries were detrimentally impacted by these blatant misrepresentations of winning probabilities. <span style="color:red;font-weight:bold;text-decoration:underline;">Up to this point, I have already provided the FBI with irrefutable evidence, confirming beyond any doubt and with absolute certainty, that such fraud was perpetrated both in the United States and in France.</span>

  (version#initial)(381)&emsp;But these are merely two instances of mass-marketing frauds. A deeper probe is likely to uncover that similar fraudulent activities tainted McDonald’s promotional campaigns in other nations as well. Given the vast global footprint of McDonald’s Corporation, the extent and scale of this deceptive practice can be staggering. <span style="text-decoration:underline">A coordinated, multi-national approach is warranted to fully uncover the scope of this misconduct and to ensure justice for affected consumers worldwide.</span>

  (version#initial)(382)&emsp;To conclude this section, it’s crucial to remember that the collect-to-win aspect of the McDonald’s Monopoly sweepstakes in the United States for the year 2011 incorporated two distinct fraudulent elements. In this discussion, we've only addressed the first of these frauds—a two-fold deviation from the truth. McDonald's deceptively advertised the probability of winning per attempt as 1 in 4, while in reality, it was closer to 1 in 8. This is just one part of the broader deceit in the collect-to-win scheme.

  (version#initial)(383)&emsp;It's important to clarify that within this one sweepstakes, various games—each constituting separate instances of fraud—were promoted. The collect-to-win game we've discussed is just one facet of this deception, possessing two fraudulent elements in itself, and here we have only explored the first. I will delve into the second fraudulent element of the collect-to-win for the United States in the year 2011—and similarly deceptive practices in other years—after I present and analyze the nature of the fraud as it occurred in Australia in the year 2022.

  (version#initial)(384)&emsp;<span style="color:red;font-weight:bold;text-decoration:underline;">Fact:</span> the first aspect of the specifically targeted instant-win fraudulent scheme in the 2011 mass-marketing fraud in the United States has been conclusively proven, not just beyond a reasonable doubt, but beyond a shadow of a doubt! This scheme includes two distinct fraudulent elements within the instant-win category alone. I will delve into the second aspect of the instant-win fraudulent scheme later on, further unpacking the layers of deception not only within the 2011 frauds but also in other editions.

