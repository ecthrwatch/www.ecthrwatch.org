content: |-
  #### (I)(C)(a) Definition and Role of a Whistleblower {id="definition-and-role-of-a-whistleblower"}

  (version#initial)(63)&emsp;In this section of my crime report, it’s essential to clarify my position as a key witness, analyst, whistleblower, and, following the gag order I've received, a whistleblower times two (x2). This classification is not arbitrary but deeply rooted in the definitions and circumstances surrounding my interactions with McDonald’s Corporation, McDonald’s Europe, McDonald’s France, and the non-public information I have in my possession.

  (version#initial)(64)&emsp;Firstly, it is crucial to establish that my use of the term "whistleblower" is consistent with accepted definitions, despite never having been an employee of McDonald’s. A whistleblower is generally understood as someone who exposes information on illegal activities or dangers to public health and safety, which otherwise might not have come to light. The National Whistleblower Center provides a clear definition[^I-C-a-3]:

  (version#initial)(65)&emsp;“On the simplest level, a whistleblower is someone who reports waste, fraud, abuse, corruption, or dangers to public health and safety to someone who is in the position to rectify the wrongdoing. A whistleblower typically works inside of the organization where the wrongdoing is taking place; however, being an agency or company ‘insider’ is not essential to serving as a whistleblower. What matters is that the individual discloses information about wrongdoing that otherwise would not be known.”

  (version#initial)(66)&emsp;This definition encapsulates my situation. Initially, my involvement began not as an insider but as a victim of McDonald’s Corporation’s activities in France. My efforts to raise concerns directly with McDonald’s France and subsequently with McDonald’s Corporation about ongoing consumer fraud and other illicit activities granted me access to sensitive exchanges and communications. These included correspondences between company executives and me, and one correspondence between my attorney and one of McDonald’s attorneys, which clearly demonstrated McDonald’s awareness and total disregard of the crimes they were committing.

  #### (I)(C)(b) Evolution of My Role as a Whistleblower {id="evolution-of-my-role-as-a-whistleblower"}

  (version#initial)(67)&emsp;The term “whistleblower” was first applied to my actions by a journalist who described one of my websites dedicated to exposing these issues as a "whistleblower site." Although initially hesitant to adopt this label—given my external position relative to the company—it has become increasingly fitting. The non-public information that I have disclosed not only confirms misconduct but also highlights systematic efforts to suppress this information.

  #### (I)(C)(c) Amplified Role Following the Gag Order {id="amplified-role-following-the-gag-order"}

  (version#initial)(68)&emsp;Following the informal gag order imposed upon me, my role as a whistleblower has effectively doubled—hence, whistleblower times two (x2). This term reflects the increased risk and responsibility I've shouldered in continuing to disclose critical information under heightened constraints. The gag order, while preventing me from discussing specifics, underscores the severe implications and risks associated with my continued exposure of these truths.

  (version#initial)(69)&emsp;As I proceed, it remains my imperative to persist in uncovering and reporting the malfeasance of McDonald’s Corporation and its affiliates, maintaining the integrity and truthfulness required to champion public safety and corporate accountability.

  #### (I)(C)(d) Understanding My Analytical Role Under the Dodd-Frank Act {id="understanding-my-analytical-role-under-the-dodd-frank-act"}

  (version#initial)(70)&emsp;My analytical role, though perhaps not formal in the sense of financial analysts or accountants, involves a deep dive into the statistical probability and the operational patterns of McDonald’s criminal schemes. This type of analysis is crucial and aligns with investigative and forensic analysis, which looks beyond surface information to understand underlying mechanisms.

  (version#initial)(71)&emsp;Under the Dodd-Frank Wall Street Reform and Consumer Protection Act, an analyst can indeed be someone who compiles and interprets publicly available or secondary information to detect violations of financial regulations or misconduct. This role extends beyond traditional financial analysts to include any individual who, through their analysis, enables regulatory bodies to identify and act upon regulatory breaches.

  (version#initial)(72)&emsp;According to Stephen M. Kohn in his book Rules for Whistleblowers: A Handbook for Doing What's Right: “The Dodd-Frank Act also permits analysts to file reward claims. An analyst is not a traditional original source, but rather a person who puts together public or secondary information in a manner that permits the commissions to learn that a violation has occurred.”

  (version#initial)(73)&emsp;This provision is particularly pertinent to my activities, as my investigations into the criminal practices of McDonald’s do not merely interpret data but reveal systemic fraud that was not previously acted upon by regulatory bodies.

  (version#initial)(74)&emsp;Given that my work exposes significant frauds followed by serious financial crimes and misconducts (money laundering and failure to alert investors), it may qualify for whistleblower protections under Dodd-Frank. This is crucial as it shields me from retaliation.

  (version#initial)(75)&emsp;In conclusion, my role as an analyst in this context extends beyond traditional financial analysis and enters the realm of forensic examination, where the analysis itself helps to unveil complex schemes and subsequent regulatory violations. By doing so, I embody the spirit of the Dodd-Frank Act’s whistleblower provisions, serving as a critical conduit for transparency and accountability in corporate practices. This reaffirms the legal and societal value of my investigative endeavors, positioning me as a key figure in advocating for consumer rights and ethical business conduct.

