raw_header: '### (V)(T) International Coordination with INTERPOL and Eurojust {id="international-coordination-interpol-eurojust"}'
content: |-
  (version#initial)(824)&emsp;Given the undeniable transnational scope of the evidence presented, robust international cooperation is imperative. The FBI, SFO (the Serious Fraud Office, based in the U.K.), law enforcement authorities in every single country where McDonald's is present, should coordinate their efforts with INTERPOL and Eurojust, as various McDonald's Monopoly promotions were hosted globally, with a possibility that most likely most of them were fraught with legal inconsistencies. Furthermore, it's not only the McDonald's Monopoly which is suspect, but there are also other illegal practices which have been committed by McDonald's Corporation and its accomplices. I've personally witnessed mass-marketing frauds in China for example, frauds which were totally unrelated to the McDonald's Monopoly mass-marketing fraud. Yet, these frauds had the same modus operandi.

  (version#initial)(825)&emsp;Furthermore, even if there countries in which no mass-marketing frauds ever took place, because this criminal RICO enterprise is orchestrated at its core by McDonald's Corporation, restaurants in such countries would be competing unfairly against honest businesses.

  (version#initial)(826)&emsp;A document, "MONEY LAUNDERING: A PRACTICE MANUAL FOR STATE PROSECUTORS", which I found on the website of the Office of Justice Programs of the U.S. Department of Justice at https://www.ojp.gov/pdffiles1/Digitization/155129NCJRS.pdf explains it well:

  (version#initial)(827)&emsp;"Money laundering also distorts the economy. Honest businesses lose out to those bankrolled by organized crime. As a member of the Italian parliament and former prosecutor observed, 'How would you like to be a company competing against [businesses taking dirty money] when you have to carry a debt load of 25 percent and your competition has zero?' With such a competitive advantage, it is no wonder that dirty money quickly penetrates and dominates entire industries." (PART I INTRODUCTION TO MONEY LAUNDERING, CHAPTER ONE -- MONEY LAUNDERING: OVERVIEW OF THE PROBLEM, SECTION B. MONEY LAUNDERING DISTORTS THE ECONOMY AND CORRUPTS SOCIETY).

  (version#initial)(828)&emsp;That's exactly what McDonald's Corporation is: a criminal entity orchestrating a criminal enterprise which has dominated the fast-food industry because they've engaged in a pattern of racketeering activities for decades.

